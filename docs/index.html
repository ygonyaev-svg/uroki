 { id:'y6', title:'Ветер и Солнце', author:'К. Д. Ушинский (по Эзопу)',
   text:'Однажды Солнце и сердитый северный Ветер затеяли спор о том, кто из них сильнее. Долго спорили они и, наконец, решились померяться силами над путешественником, который в это самое время ехал верхом по большой дороге.\n— Посмотри, — сказал Ветер, — как я налечу на него: мигом сорву с него плащ.\nСказал — и начал дуть что было мочи. Но чем более старался Ветер, тем крепче закутывался путешественник в свой плащ: он ворчал на непогоду, но ехал всё дальше и дальше. Ветер сердился, свирепел, осыпал бедного путника дождём и снегом; путешественник надел свой плащ в рукава и подвязался поясом. Тут уж Ветер и сам убедился, что ему плаща не сдёрнуть.\nСолнце, видя бессилие своего соперника, улыбнулось, выглянуло из-за облаков, обогрело, осушило землю, а вместе с тем и бедного полузамёрзшего путешественника. Почувствовав теплоту солнечных лучей, он приободрился, сам снял свой плащ, свернул его и привязал к седлу.\n— Видишь ли, — сказало тогда кроткое Солнце сердитому Ветру, — лаской и добротой можно сделать гораздо более, чем гневом.',
   qs:[['О чём спорили Солнце и Ветер?','кто из них сильнее','кто красивее','кто раньше встаёт','куда поедет путник'],['Что делал путник, когда дул Ветер?','крепче закутывался в плащ','снимал плащ','прятался в доме','бежал домой'],['Какой вывод в конце?','лаской и добротой можно сделать больше, чем гневом','сильнее всех ветер','плащ не нужен','солнце всегда за тучами']] },
 { id:'y7', title:'Дельфины', author:'',
   text:'Дельфины живут в море, но они не рыбы. Дельфины дышат воздухом, как люди. Поэтому они часто поднимаются к поверхности, чтобы вдохнуть.\nДельфины живут большими семьями — стаями. Они «разговаривают» друг с другом свистом и щелчками. У каждого дельфина есть свой свист, как имя.\nУ берегов Португалии, в устье реки Саду возле города Сетубал, живёт целая стая дельфинов. Туда приезжают люди, чтобы посмотреть на них с лодки.',

 { id:'y8', title:'Лев и собачка', author:'Л. Н. Толстой',
   text:'В Лондоне показывали диких зверей и за смотренье брали деньгами или собаками и кошками на корм диким зверям.\nОдному человеку захотелось поглядеть зверей: он ухватил на улице собачонку и принёс её в зверинец. Его пустили смотреть, а собачонку взяли и бросили в клетку ко льву на съеденье.\nСобачка поджала хвост и прижалась в угол клетки. Лев подошёл к ней и понюхал её.\nСобачка легла на спину, подняла лапки и стала махать хвостиком.\nЛев тронул её лапой и перевернул.\nСобачка вскочила и стала перед львом на задние лапки.\nЛев смотрел на собачку, поворачивал голову со стороны на сторону и не трогал её.\nКогда хозяин бросил льву мяса, лев оторвал кусок и оставил собачке.\nВечером, когда лев лёг спать, собачка легла подле него и положила свою голову ему на лапу.\nС тех пор собачка жила в одной клетке со львом, лев не трогал её, ел корм, спал с ней вместе, а иногда играл с ней.\nТак прожили лев и собачка целый год в одной клетке.',

 { id:'y9', title:'Почему листья желтеют', author:'',
   text:'Летом листья зелёные. Им помогает особое вещество — хлорофилл. С его помощью лист ловит солнечный свет и делает из него пищу для дерева.\nОсенью дни становятся короче, солнца меньше. Дерево готовится к зиме и перестаёт делать хлорофилл. Зелёный цвет исчезает, и становятся видны жёлтые и оранжевые краски, которые прятались в листе всё лето.\nПотом листья опадают, а дерево отдыхает до весны.',

 { id:'y10', title:'Прыжок', author:'Л. Н. Толстой',
   text:'Один корабль обошёл вокруг света и возвращался домой. Была тихая погода, весь народ был на палубе. Посреди народа вертелась большая обезьяна и забавляла всех.\nОна подпрыгнула к двенадцатилетнему мальчику, сыну капитана корабля, сорвала с его головы шляпу, надела и живо взобралась на мачту. Все засмеялись, а мальчик остался без шляпы и сам не знал, смеяться ли ему или плакать.\nОбезьяна села на первой перекладине мачты, сняла шляпу и стала зубами и лапами рвать её. Мальчик погрозил ей и крикнул на неё, но она ещё злее рвала шляпу. Матросы громче стали смеяться, а мальчик покраснел, скинул куртку и бросился за обезьяной на мачту.\nТак обезьяна и мальчик добрались до самого верха. Обезьяна повесила шляпу на край последней перекладины. Мальчик бросил мачту и ступил на перекладину. Все замерли от страха: стоило ему только оступиться — и он бы разбился о палубу.\nВ это время капитан корабля, отец мальчика, вышел из каюты. Он увидал сына на мачте и тотчас закричал: «В воду! Прыгай сейчас в воду!» Мальчик размахнулся и прыгнул.\nТочно пушечное ядро, шлёпнуло тело мальчика в море, и не успели волны закрыть его, как уже двадцать молодцов-матросов спрыгнули с корабля в море. Его схватили и вытащили на корабль. Через несколько минут мальчик стал дышать.\nКогда капитан увидал это, он вдруг закричал, как будто его что-то душило, и убежал к себе в каюту, чтоб никто не видал, как он плачет.',

 { id:'y11', title:'Воробьишко', author:'М. Горький',
   text:'Жил-был желторотый воробей, звали его Пудик, а жил он над окошком бани, за верхним наличником, в тёплом гнезде из пакли, моховинок и других мягких материалов. Летать он ещё не пробовал, но уже крыльями махал и всё выглядывал из гнезда: хотелось поскорее узнать — что такое мир и годится ли он для него?\n— Что, что? — спрашивала его воробьиха-мама.\nОн потряхивал крыльями и, глядя на землю, чирикал:\n— Чересчур черна, чересчур!\nПудик не верил маме; он ещё не знал, что если маме не верить, это плохо кончится. Он сидел на самом краю гнезда и во всё горло распевал стихи собственного сочинения. Пел, пел да и вывалился из гнезда, а воробьиха за ним, а кошка — рыжая, зелёные глаза — тут как тут.\nИспугался Пудик, растопырил крылья, качается на сереньких ногах и чирикает. А воробьиха отталкивает его в сторону, перья у неё дыбом встали — страшная, храбрая, клюв раскрыла — в глаз кошке целит.\n— Прочь, прочь! Лети, Пудик, лети на окно, лети…\nСтрах приподнял с земли воробьишку, он подпрыгнул, замахал крыльями — раз, раз и — на окне! Тут и мама подлетела — без хвоста, но в большой радости, села рядом с ним, клюнула его в затылок.\n— Ну что ж! — сказал Пудик. — Всему сразу не научишься!',
   qs:[['Как звали воробья?','Пудик','Чик','Барсик','Пушок'],['Где было гнездо?','над окошком бани','на берёзе','под крышей школы','в скворечнике'],['Кто спас Пудика от кошки?','мама-воробьиха','папа-воробей','собака','мальчик'],['Что потеряла мама-воробьиха?','хвост','крыло','гнездо','голос']] },
 { id:'y12', title:'Муравьи-строители', author:'',
   text:'Муравьи маленькие, но очень сильные. Муравей может поднять груз в двадцать раз тяжелее себя.\nВ муравейнике у каждого своя работа. Одни муравьи строят ходы, другие приносят еду, третьи охраняют вход. Главная в муравейнике — царица. Она откладывает яйца.\nМуравейник похож на подземный город с комнатами и коридорами. Зимой муравьи закрывают входы и спят глубоко под землёй.',

 { id:'a1', title:'Волк и Ягнёнок', author:'И. А. Крылов',
   text:'У сильного всегда бессильный виноват:\nТому в Истории мы тьму примеров слышим,\nНо мы Истории не пишем;\nА вот о том как в Баснях говорят.\nЯгнёнок в жаркий день зашёл к ручью напиться;\nИ надобно ж беде случиться,\nЧто около тех мест голодный рыскал Волк.\nЯгнёнка видит он, на добычу стремится;\nНо, делу дать хотя законный вид и толк,\nКричит: «Как смеешь ты, наглец, нечистым рылом\nЗдесь чистое мутить питьё\nМоё\nС песком и с илом?\nЗа дерзость такову\nЯ голову с тебя сорву».\n«Когда светлейший Волк позволит,\nОсмелюсь я донесть, что ниже по ручью\nОт Светлости его шагов я на сто пью;\nИ гневаться напрасно он изволит:\nПитья мутить ему никак я не могу».\n«Поэтому я лгу!\nНегодный! слыхана ль такая дерзость в свете!\nДа помнится, что ты ещё в запрошлом лете\nМне здесь же как-то нагрубил:\nЯ этого, приятель, не забыл!»\n«Помилуй, мне ещё и отроду нет году», —\nЯгнёнок говорит. «Так это был твой брат». —\n«Нет братьев у меня». — «Так это кум иль сват\nИ, словом, кто-нибудь из вашего же роду».\n«Ах, я чем виноват?» — «Молчи! устал я слушать,\nДосуг мне разбирать вины твои, щенок!\nТы виноват уж тем, что хочется мне кушать».\nСказал и в тёмный лес Ягнёнка поволок.',

 { id:'a2', title:'Край земли', author:'',
   text:'Если поехать из Лиссабона на запад, через час дороги окажешься на мысе Рока — самой западной точке континентальной Европы. Дальше только Атлантический океан.\nСкалы здесь поднимаются над водой почти на сто сорок метров, а ветер бывает таким сильным, что трудно стоять на ногах. На памятном камне высечены слова поэта Луиша де Камоэнса: «Здесь, где земля кончается и начинается море».\nПятьсот лет назад отсюда смотрели на горизонт люди, которые не знали, что лежит за океаном. Сегодня рядом с мысом стоит маяк. Его свет виден за десятки километров и помогает кораблям не разбиться о скалы в тумане.',
   qs:[['Чем знаменит мыс Рока?','это самая западная точка континентальной Европы','там самая высокая гора','там начинается река Тежу','там жил Камоэнс'],['Чьи слова высечены на камне?','поэта Луиша де Камоэнса','Васко да Гамы','короля Португалии','неизвестного моряка'],['Зачем у мыса нужен маяк?','чтобы корабли не разбились о скалы в тумане','для красоты','чтобы туристы фотографировали','чтобы освещать дорогу машинам']] },
 { id:'a3', title:'Квартет', author:'И. А. Крылов',
   text:'Проказница-Мартышка,\nОсёл,\nКозёл\nДа косолапый Мишка\nЗатеяли сыграть Квартет.\nДостали нот, баса, альта, две скрипки\nИ сели на лужок под липки, —\nПленять своим искусством свет.\nУдарили в смычки, дерут, а толку нет.\n«Стой, братцы, стой! — кричит Мартышка. — Погодите!\nКак музыке идти? Ведь вы не так сидите.\nТы с басом, Мишенька, садись против альта,\nЯ, прима, сяду против вторы;\nТогда пойдёт уж музыка не та:\nУ нас запляшут лес и горы!»\nРасселись, начали Квартет;\nОн всё-таки на лад нейдёт.\n«Постойте ж, я сыскал секрет! —\nКричит Осёл, — мы, верно, уж поладим,\nКоль рядом сядем».\nПослушались Осла: уселись чинно в ряд;\nА всё-таки Квартет нейдёт на лад.\nВот пуще прежнего пошли у них разборы\nИ споры,\nКому и как сидеть.\nСлучилось Соловью на шум их прилететь.\nТут с просьбой все к нему, чтоб их решить сомненье.\n«Пожалуй, — говорят, — возьми на час терпенье,\nЧтобы Квартет в порядок наш привесть:\nИ ноты есть у нас, и инструменты есть,\nСкажи лишь, как нам сесть!» —\n«Чтоб музыкантом быть, так надобно уменье\nИ уши ваших понежней, —\nИм отвечает Соловей, —\nА вы, друзья, как ни садитесь,\nВсё в музыканты не годитесь».',

 { id:'a4', title:'Пробковый дуб', author:'',
   text:'Португалия — главный в мире производитель пробки. Её получают из коры пробкового дуба. Удивительно, но дерево при этом не срубают. Кору аккуратно снимают вручную специальным топориком, и через девять лет она вырастает снова.\nПервый раз кору снимают, когда дереву исполнится около двадцати пяти лет, а живёт пробковый дуб около двухсот лет. Из пробки делают не только затычки для бутылок, но и полы, обувь, сумки и даже детали для космических кораблей: пробка лёгкая, не пропускает воду и хорошо защищает от жары.\nНа стволе каждого дерева белой краской пишут последнюю цифру года, когда сняли кору, чтобы знать, когда приходить снова.',
   qs:[['Через сколько лет кора вырастает снова?','через девять','через год','через сто','никогда'],['Почему пробку используют даже в космической технике?','она лёгкая и защищает от жары','она красивая','она дешёвая','она тяжёлая и прочная'],['Зачем на стволе пишут цифру?','чтобы знать, когда снимали кору','чтобы пронумеровать деревья для туристов','это возраст дерева','это номер хозяина']] },
 { id:'a5', title:'Кавказский пленник (начало)', author:'Л. Н. Толстой',
   text:'Служил на Кавказе офицером один барин. Звали его Жилин.\nПришло ему раз письмо из дома. Пишет ему старуха мать: «Стара я уж стала, и хочется перед смертью повидать любимого сынка. Приезжай со мной проститься». Жилин и раздумался: «И в самом деле, плоха уж старуха стала, может, и не придётся увидать».\nНа Кавказе тогда война была. По дорогам ни днём, ни ночью не было проезда. И было заведено, что два раза в неделю из крепости в крепость ходили провожатые солдаты. Спереди и сзади идут солдаты, а в середине едет народ.\nДело было летом. Обоз шёл тихо: то солдаты остановятся, то в обозе колесо у кого соскочит или лошадь станет, и все стоят дожидаются. Солнце уже и за полдни перешло, а обоз только половину дороги прошёл. Пыль, жара, солнце так и печёт, и укрыться негде.\nВыехал Жилин вперёд и думает: «А не уехать ли одному, без солдат? Лошадь подо мной добрая». И подъезжает к нему на лошади другой офицер, Костылин, с ружьём, и говорит:\n— Поедем, Жилин, одни. Мочи нет, есть хочется, да и жара.\nПодумал Жилин и говорит:\n— А ружьё заряжено?\n— Заряжено.\n— Ну, так поедем. Только уговор — не разъезжаться.',
   qs:[['Почему Жилин собрался ехать домой?','мать прислала письмо и просила приехать','ему надоела служба','его выгнали из армии','он хотел купить лошадь'],['Почему по дорогам ездили только с солдатами?','шла война, и в дороге было опасно','так было веселее','солдаты везли почту','у всех не было лошадей'],['Почему офицеры решили ехать без обоза?','обоз шёл медленно, было жарко и хотелось есть','им приказали','обоз заблудился','у них сломалось колесо'],['О чём договорились Жилин и Костылин?','не разъезжаться','ехать порознь','вернуться к обозу','ехать ночью']] },
 { id:'a6', title:'Танец пчёл', author:'',
   text:'Пчела-разведчица находит поле, полное цветов. Как рассказать остальным, куда лететь? Слов у пчёл нет, зато есть танец.\nВернувшись в улей, разведчица начинает бегать по сотам восьмёркой и при этом виляет брюшком. Направление танца показывает, куда лететь относительно солнца, а длительность виляния — насколько далеко цветы. Чем дольше пчела виляет, тем дальше находится поле.\nЭтот танец разгадал австрийский учёный Карл фон Фриш и получил за это Нобелевскую премию в 1973 году.',
   qs:[['Как пчела сообщает о найденных цветах?','танцем','жужжанием одной ноты','запахом','никак'],['Что означает долгое виляние брюшком?','поле с цветами далеко','поле близко','цветов мало','пчела устала'],['Кто разгадал танец пчёл?','Карл фон Фриш','Чарльз Дарвин','Исаак Ньютон','Луи Пастер']] },
 { id:'a7', title:'Муму (начало)', author:'И. С. Тургенев',
   text:'В одной из отдалённых улиц Москвы, в сером доме с белыми колоннами, антресолью и покривившимся балконом, жила некогда барыня, вдова, окружённая многочисленною дворней.\nИз числа всей её челяди самым замечательным лицом был дворник Герасим, мужчина двенадцати вершков роста, сложённый богатырём и глухонемой от рожденья. Барыня взяла его из деревни, где он жил один, в небольшой избушке, и считался едва ли не самым исправным мужиком. Одарённый необычайной силой, он работал за четверых — дело спорилось в его руках, и весело было смотреть на него, когда он пахал или косил.\nНо вот Герасима привезли в Москву, купили ему сапоги, сшили кафтан на лето, на зиму тулуп, дали ему в руки метлу и лопату и определили его дворником.\nКрепко не полюбилось ему сначала его новое житьё. С детства привык он к полевым работам, к деревенскому быту. Но ко всему привыкает человек, и Герасим привык наконец к городскому житью. Вся обязанность его состояла в том, чтобы двор содержать в чистоте, два раза в день привезти бочку с водой, натаскать и наколоть дров да чужих не пускать и по ночам караулить. И надо сказать, усердно исполнял он свою обязанность.',
   qs:[['Кем служил Герасим в Москве?','дворником','кучером','поваром','сторожем в лавке'],['Откуда привезли Герасима?','из деревни','из Петербурга','с Кавказа','из-за границы'],['Как Герасим работал?','за четверых, очень усердно','лениво','только по праздникам','плохо, потому что был глухонемым'],['Как сначала Герасим отнёсся к жизни в городе?','ему не понравилось, он скучал по деревне','ему сразу понравилось','он сбежал','он ничего не заметил']] },
 { id:'a8', title:'Азорские острова', author:'',
   text:'Посреди Атлантического океана, примерно в полутора тысячах километров от Лиссабона, лежат девять Азорских островов. Все они появились из-за извержений подводных вулканов.\nНа острове Сан-Мигел есть озёра в старых кратерах, а в долине Фурнаш из земли поднимается горячий пар. Местные жители даже готовят там блюдо «козиду»: кастрюлю с мясом и овощами закапывают в горячую землю, и через несколько часов обед готов.\nСамая высокая гора Португалии — Пику — тоже находится на Азорах, её высота 2351 метр.',
   qs:[['Как появились Азорские острова?','из-за извержений подводных вулканов','их намыло течением','это обломки материка','их насыпали люди'],['Как готовят козиду в долине Фурнаш?','закапывают кастрюлю в горячую землю','жарят на костре','варят в океане','сушат на солнце'],['Где самая высокая гора Португалии?','на Азорах','у Лиссабона','на Мадейре','в Алгарве']] },
 { id:'a9', title:'Белолобый (начало)', author:'А. П. Чехов',
