<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Уроки</title>
<meta name="theme-color" content="#38bdf8"><meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Уроки">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Nunito:wght@700;800;900&family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
<style>:root{
  --paper:#fbfaf5; --grid:#e3e9f2; --ink:#1f2a44; --ink2:#55607a; --line:#d6dce8;
  --blue:#2350a8; --red:#c8312b; --green:#23824a; --gold:#e0a417; --gold2:#b37d00;
  --card:#ffffff; --soft:#eef2f9; --acc:#2350a8; --accsoft:#e6edfa;
  --r:16px; --sh:0 1px 2px rgba(20,30,60,.06),0 4px 14px rgba(20,30,60,.06);
}
@media (prefers-color-scheme: dark){
  :root{ --paper:#151a24; --grid:#1d2431; --ink:#e8ecf4; --ink2:#a4adc0; --line:#2c3446;
    --blue:#7ea3f0; --red:#ff7b73; --green:#5fcf8c; --gold:#f2bd3c; --gold2:#f2bd3c;
    --card:#1c2230; --soft:#232b3b; --acc:#7ea3f0; --accsoft:#223150; --sh:none; }
}
.yarik{ --acc:#d9620f; --accsoft:#fdeee2; }
.anya{ --acc:#0f8a84; --accsoft:#def3f1; }
@media (prefers-color-scheme: dark){ .yarik{ --acc:#ff9a52; --accsoft:#3a2a1e; } .anya{ --acc:#4fd0c6; --accsoft:#173634; } }

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html{ -webkit-text-size-adjust:100%; }
body{ margin:0; color:var(--ink); font:18px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PT Sans",sans-serif;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px; min-height:100vh; padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
h1{ font-size:30px; line-height:1.2; margin:.2em 0 .4em; }
h2{ font-size:21px; margin:.2em 0 .5em; }
h3{ font-size:17px; margin:1em 0 .4em; color:var(--ink2); }
button,input,select,textarea{ font:inherit; color:inherit; }
.wrap{ max-width:860px; margin:0 auto; padding:16px 16px 60px; }
.wrap.narrow{ max-width:520px; }
.card{ background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:18px 20px; margin:14px 0; box-shadow:var(--sh); }
.hero{ padding:20px 0 6px; }
.eyebrow{ text-transform:uppercase; letter-spacing:.08em; font-size:13px; font-weight:600; color:var(--acc); margin:0; }
.hint{ color:var(--ink2); font-size:15px; }
.center{ text-align:center; }
.row{ display:flex; flex-wrap:wrap; gap:8px; margin:6px 0; }

.btn{ appearance:none; border:0; border-radius:12px; background:var(--acc); color:#fff; font-weight:600; padding:12px 20px; min-height:48px; cursor:pointer; }
.btn:disabled{ opacity:.45; cursor:default; }
.btn.big{ display:block; width:100%; font-size:20px; padding:16px 20px; min-height:60px; margin:14px 0; }
.btn.small{ padding:8px 14px; min-height:40px; font-size:16px; }
.btn.ghost{ background:var(--accsoft); color:var(--acc); }
.btn.mic{ background:var(--green); }
.btn.stop{ background:var(--red); }
.btn:active{ transform:translateY(1px); }
.link{ appearance:none; border:0; background:none; color:var(--acc); font-weight:600; padding:10px 4px; cursor:pointer; }
.chip{ appearance:none; border:1.5px solid var(--line); background:var(--card); border-radius:999px; padding:9px 16px; min-height:44px; cursor:pointer; }
.chip.on{ border-color:var(--acc); background:var(--accsoft); color:var(--acc); font-weight:600; }

.bar{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:4px 0; }
.coins{ display:inline-flex; align-items:center; gap:6px; background:var(--card); border:1px solid var(--line); border-radius:999px; padding:6px 14px; font-size:18px; }
.coin{ display:inline-block; width:20px; height:20px; border-radius:50%; background:radial-gradient(circle at 35% 35%,#ffe28a,var(--gold) 60%,var(--gold2)); box-shadow:inset 0 0 0 2px rgba(0,0,0,.08); vertical-align:-4px; }

/* вход */
.kids{ display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:16px; margin:18px 0; }
.kidcard{ display:grid; justify-items:center; gap:4px; padding:28px 16px; border-radius:22px; border:2px solid var(--acc); background:var(--card); cursor:pointer; box-shadow:var(--sh); }
.avatar{ width:96px; height:96px; border-radius:50%; background:var(--acc); color:#fff; font-size:52px; font-weight:700; display:grid; place-items:center; }
.kn{ font-size:28px; font-weight:700; }
.kg{ color:var(--ink2); }
.kc{ display:inline-flex; align-items:center; gap:6px; margin-top:6px; }
.pinbox{ display:grid; justify-items:center; gap:18px; margin-top:10px; }
.dots{ display:flex; gap:16px; }
.dots i{ width:20px; height:20px; border-radius:50%; border:2px solid var(--ink2); }
.dots i.on{ background:var(--ink); border-color:var(--ink); }
.pad{ display:grid; grid-template-columns:repeat(3,84px); gap:14px; }
.pad span{ display:block; }
.key{ width:84px; height:84px; border-radius:50%; border:1px solid var(--line); background:var(--card); font-size:30px; font-weight:600; cursor:pointer; box-shadow:var(--sh); }
.key:active{ background:var(--soft); }

/* главная */
.hello h1{ margin-bottom:0; }
.hello p{ margin:.2em 0 .6em; color:var(--ink2); }
.prog{ height:10px; border-radius:99px; background:var(--soft); overflow:hidden; }
.prog i{ display:block; height:100%; background:var(--acc); border-radius:99px; transition:width .4s; }
.note{ background:#fff7d6; color:#4a3b00; border:1px solid #f0dc8a; border-radius:12px; padding:12px 16px; margin:12px 0; }
@media (prefers-color-scheme: dark){ .note{ background:#3a3214; color:#f3e3a3; border-color:#5c4f1d; } }
.tiles{ display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:12px; margin:18px 0; }
.tile{ position:relative; display:flex; align-items:center; gap:14px; text-align:left; background:var(--card); border:1.5px solid var(--line); border-radius:var(--r); padding:16px; min-height:92px; cursor:pointer; box-shadow:var(--sh); }
.tile.main{ border-color:var(--acc); }
.tile.done{ opacity:.75; }
.ico{ flex:none; width:56px; height:56px; border-radius:14px; background:var(--accsoft); color:var(--acc); display:grid; place-items:center; font-weight:700; font-size:19px; }
.tt{ display:grid; gap:2px; min-width:0; }
.sn{ font-weight:700; }
.sn em{ font-style:normal; font-size:12px; background:var(--acc); color:#fff; border-radius:6px; padding:1px 6px; margin-left:4px; vertical-align:2px; }
.ut{ color:var(--ink2); font-size:15px; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
.state{ margin-left:auto; font-size:13px; color:var(--acc); font-weight:600; }
.mark,.bigmark{ font-family:"Caveat","Marker Felt","Segoe Print",cursive; color:var(--red); font-weight:700; }
.mark{ margin-left:auto; font-size:42px; line-height:1; transform:rotate(-8deg); }
.m2{ color:var(--ink2); }
.card.win{ border-color:var(--green); text-align:center; }
.speeds{ display:flex; flex-wrap:wrap; gap:8px; }
.speeds span{ background:var(--soft); border-radius:10px; padding:4px 10px; font-size:15px; }

/* урок */
.steps{ display:flex; gap:6px; list-style:none; padding:0; margin:0 0 10px; flex-wrap:wrap; }
.steps li{ font-size:14px; padding:4px 12px; border-radius:99px; background:var(--soft); color:var(--ink2); }
.steps li.now{ background:var(--acc); color:#fff; font-weight:600; }
.steps li.ok{ background:var(--accsoft); color:var(--acc); }
.steps li.ok::before{ content:"✓ "; }
.theory .th{ font-size:19px; }
.theory .th b,.theory .th strong{ color:var(--acc); }
.theory table{ border-collapse:collapse; margin:8px 0; }
.theory td,.theory th{ border:1px solid var(--line); padding:4px 10px; }
.vw{ appearance:none; border:1px solid var(--line); background:var(--soft); border-radius:10px; padding:6px 12px; margin:3px; cursor:pointer; }
.src{ font-size:14px; color:var(--ink2); margin:4px 2px; }
.author{ color:var(--ink2); margin-top:-8px; }
.counter{ font-size:15px; color:var(--ink2); margin-top:8px; }
.task .q{ font-size:24px; line-height:1.4; margin:4px 0 14px; }
.gap{ display:inline-block; min-width:44px; border-bottom:2px solid var(--acc); color:var(--acc); text-align:center; }
.opts{ display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px; }
.opt{ appearance:none; border:2px solid var(--line); background:var(--card); border-radius:14px; padding:14px; min-height:60px; font-size:21px; cursor:pointer; }
.opt:disabled{ cursor:default; }
.opt.right{ border-color:var(--green); background:rgba(35,130,74,.12); color:var(--green); font-weight:700; }
.opt.wrong{ border-color:var(--red); color:var(--red); text-decoration:line-through; opacity:.8; }
.numf{ display:flex; gap:10px; }
.numf input{ flex:1; min-width:0; font-size:26px; padding:10px 14px; border:2px solid var(--line); border-radius:12px; background:var(--card); }
.numf input:focus{ outline:none; border-color:var(--acc); }
.fb{ margin-top:14px; padding:12px 14px; border-radius:12px; }
.fb.ok{ background:rgba(35,130,74,.12); color:var(--green); }
.fb.bad{ background:rgba(200,49,43,.1); color:var(--red); }
.fb.bad .hint{ color:var(--ink2); }
.fb.try{ background:var(--soft); }
.survey textarea{ width:100%; margin-top:6px; padding:10px; border:1.5px solid var(--line); border-radius:12px; background:var(--card); }
.free{ display:block; margin-top:14px; color:var(--ink2); font-size:15px; }
.result{ text-align:center; }
.bigmark{ font-size:110px; line-height:1; transform:rotate(-6deg); display:inline-block; }
.earn{ display:inline-flex; gap:6px; align-items:center; font-size:20px; }
.check{ display:flex; gap:10px; align-items:center; padding:8px 0; font-size:19px; }
.check input{ width:26px; height:26px; }

/* чтение */
.warm{ display:flex; flex-wrap:wrap; gap:10px; margin:10px 0; }
.ww{ appearance:none; border:1.5px solid var(--acc); background:var(--accsoft); color:var(--ink); border-radius:12px; padding:10px 16px; font-size:22px; cursor:pointer; }
.reading .text,.peek .text{ font-size:26px; line-height:1.75; font-family:Georgia,"PT Serif","Times New Roman",serif; }
.anya .reading .text{ font-size:22px; }
.text p{ margin:0 0 .6em; }
.w{ border-radius:5px; padding:0 1px; transition:background .2s; }
.w.r1{ color:var(--green); }
.w.r2{ background:rgba(200,49,43,.15); color:var(--red); text-decoration:underline wavy; }
.w.rc{ background:var(--accsoft); outline:2px solid var(--acc); }
.rest summary,.peek summary{ cursor:pointer; color:var(--acc); font-weight:600; padding:8px 0; }
.rest{ margin-top:12px; color:var(--ink2); }
.readbar{ position:sticky; bottom:0; padding:8px 0 calc(8px + env(safe-area-inset-bottom)); background:linear-gradient(transparent,var(--paper) 30%); }
.readbar .btn.big{ margin:6px 0; }
.rstat{ display:block; text-align:center; color:var(--ink2); }
.readres{ display:flex; flex-wrap:wrap; gap:10px; margin:6px 0; }
.readres span{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:8px 14px; }
.readres b{ font-size:22px; color:var(--acc); }

/* магазин */
.shop{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; }
.item{ display:grid; gap:10px; margin:0; }
.iname{ font-weight:600; }
.price{ display:inline-flex; gap:6px; align-items:center; font-size:20px; }
.plain{ padding-left:20px; }

/* родителям */
.tabs{ display:flex; gap:6px; margin:10px 0; border-bottom:1px solid var(--line); }
.tab{ appearance:none; border:0; background:none; padding:10px 14px; border-bottom:3px solid transparent; cursor:pointer; color:var(--ink2); }
.tab.on{ border-color:var(--acc); color:var(--ink); font-weight:700; }
.tscroll{ overflow-x:auto; }
table{ border-collapse:collapse; width:100%; font-size:15px; }
th,td{ text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
th{ color:var(--ink2); font-weight:600; }
.form label{ display:block; margin:10px 0; color:var(--ink2); font-size:15px; }
.form input,.form select,.shoprow input{ display:block; width:100%; margin-top:4px; padding:10px 12px; border:1.5px solid var(--line); border-radius:10px; background:var(--card); font-size:18px; color:var(--ink); }
.shoprow{ display:grid; grid-template-columns:1fr 90px auto; gap:8px; align-items:center; margin:6px 0; }
.shoprow input{ margin:0; }
.toast{ position:fixed; left:50%; bottom:30px; transform:translateX(-50%); background:var(--ink); color:var(--paper); padding:12px 20px; border-radius:12px; z-index:9; }

@media (max-width:520px){
  body{ font-size:17px; } h1{ font-size:25px; }
  .task .q{ font-size:21px; } .reading .text{ font-size:22px; }
  .pad{ grid-template-columns:repeat(3,72px); } .key{ width:72px; height:72px; }
}

/* картинки и интересы */
.kb{ font-size:26px; letter-spacing:4px; }
.banner{ display:flex; justify-content:space-around; font-size:34px; margin:6px 0 -6px; }
.banner span{ display:inline-block; animation:bob 3s ease-in-out infinite; }
@keyframes bob{ 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-6px) rotate(-6deg) } }
@media (prefers-reduced-motion: reduce){ .banner span{ animation:none; } }
.task{ position:relative; }
.sticker{ position:absolute; top:-18px; right:12px; font-size:40px; transform:rotate(12deg); }
.pic{ display:inline-block; font-size:34px; letter-spacing:2px; line-height:1.3; }
.cheer{ font-size:28px; font-weight:700; color:var(--acc); margin-bottom:6px; }
.anya .hello h1,.anya .cheer{ font-family:Georgia,"PT Serif",serif; }
.anya .card.task{ border-color:#cdbf98; }
.tile.locked{ opacity:.45; filter:grayscale(.6); }
.tile.locked .ico::after{ content:"🔒"; position:absolute; font-size:16px; transform:translate(22px,-22px); }
.tile.locked .ico{ position:relative; }
.rtell{ min-height:4em; margin-top:10px; padding:10px 12px; border:1.5px dashed var(--acc); border-radius:12px; color:var(--ink2); font-size:17px; }
.note.warn{ background:#fff4e0; color:#7a4a00; }
@media (prefers-color-scheme: dark){ .note.warn{ background:#3a2c12; color:#ffd99a; } }
.card.example{ background:var(--accsoft); margin-top:12px; }
.card.example h3{ margin-top:0; }
.task .link[data-act="dunnotask"]{ display:block; margin-top:12px; }
.illus{ margin:12px 0 4px; display:flex; justify-content:center; }
.pic{ max-width:100%; height:auto; color:var(--ink); }
.pic.tens,.pic.arr{ max-height:200px; } .pic.pie,.pic.pct,.pic.clock,.pic.angle,.pic.bars,.pic.box{ max-height:190px; } .pic.scale{ max-height:170px; } .pic.rect{ max-height:200px; }
.wpics{ display:flex; gap:14px; justify-content:center; font-size:64px; line-height:1.1; }
.wpics span{ background:var(--soft); border-radius:18px; padding:6px 12px; }
.task .wpics{ font-size:58px; }
.groups{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; justify-content:center; font-size:26px; }
.groups .grp{ background:var(--soft); border-radius:12px; padding:6px 10px; max-width:260px; word-break:break-all; }
.scenebar{ margin:-18px -20px 12px; border-radius:16px 16px 0 0; overflow:hidden; line-height:0; }
.scenebar .pic{ width:100%; height:auto; display:block; }
.coverwrap{ margin:0 0 14px; border-radius:16px; overflow:hidden; line-height:0; box-shadow:0 2px 10px rgba(0,0,0,.12); }
.coverwrap .pic{ width:100%; height:auto; display:block; }
.pair{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:center; } .pair b{ font-size:28px; } .pic.place{ max-height:110px; } .pic.line{ max-height:110px; }
.illus .pic{ max-width:100%; height:auto; }
.stack{ display:flex; flex-direction:column; align-items:center; gap:6px; }
.pair .pic{ max-width:46%; }
.prizes{ display:flex; flex-wrap:wrap; gap:8px; margin:14px 0; }
.prizes .chip{ font-size:16px; }
.timecard h2{ margin:0 0 8px; font-size:18px; }
.timecard .tt2{ display:flex; flex-wrap:wrap; gap:10px 18px; font-size:17px; }
/* Планшеты: крупнее и на всю ширину */
body{ box-sizing:border-box; overflow-x:hidden; }
.wrap{ box-sizing:border-box; }
.wrap.login{ min-height:calc(100vh - env(safe-area-inset-top) - env(safe-area-inset-bottom)); display:flex; flex-direction:column; justify-content:center; }
.wrap.login .kids{ grid-template-columns:repeat(2,minmax(0,1fr)); }
.wrap.login .kidcard{ padding:40px 16px; }
.wrap.login .avatar{ width:120px; height:120px; font-size:64px; }
.wrap.login .kn{ font-size:34px; } .wrap.login .kb{ font-size:30px; }
@media (min-width:760px){ .wrap{ max-width:980px; padding:24px 32px 60px; } }
@media (min-width:760px) and (max-width:959px){ .wrap{ zoom:1.05; } }
@media (min-width:960px){ .wrap{ zoom:1.2; max-width:min(980px, calc(100vw / 1.2)); } }
@media (min-width:1250px){ .wrap{ zoom:1.3; max-width:min(980px, calc(100vw / 1.3)); } .tiles{ grid-template-columns:repeat(3,minmax(0,1fr)); } }
@media (max-width:520px){ .wrap.login .kids{ grid-template-columns:1fr; } }

/* ===== Яркое оформление (сгенерировано tools/theme_css.py) ===== */
:root:root{ color-scheme:light; --paper:#f0f9ff; --grid:transparent; --ink:#1f2a44; --ink2:#55607a; --line:#e2e8f0; --card:#ffffff; --soft:#f1f5f9;
  --blue:#2563eb; --red:#e11d48; --green:#16a34a; --gold:#f59e0b; --sh:0 6px 0 rgba(15,23,42,.10),0 10px 24px rgba(15,23,42,.12); --r:22px; }

h1,h2,.kn,.btn,.tile .sn,.bigmark+p{ font-family:"Nunito","Arial Rounded MT Bold",-apple-system,sans-serif; }
h1{ font-weight:900; font-size:34px; }
/* текст прямо на фоне */
.hero h1,.hero .eyebrow,body .wrap > .hello h1,body .wrap > .hello p,.lesson > h1,.lesson > .eyebrow,.lesson > .author,.lesson > .hint,.lesson > p,.lesson > h2,.wrap > .center,.counter,.src,.wrap > .hint{ color:#fff; text-shadow:0 2px 6px rgba(0,0,0,.45); }
.lesson > .hint,.wrap > .hint,.counter,.src,.lesson > p,.lesson > .author,.wrap > .center{ background:rgba(15,23,42,.62); border-radius:12px; padding:6px 12px; font-size:16px; display:block; width:fit-content; max-width:100%; text-shadow:none; }
.shop-own{ background:#fff; color:var(--ink); border-radius:20px; padding:12px 18px; box-shadow:var(--sh); } .shop-own h2{ color:var(--ink); text-shadow:none; }
.wrap.login .center .link,.bar .link{ color:#fff; font-weight:800; text-shadow:0 2px 6px rgba(0,0,0,.45); }
.hello .eyebrow{ color:#fde047; text-shadow:0 2px 6px rgba(0,0,0,.5); }
.card,.tile,.kidcard,.opt,.chip{ border:0; box-shadow:var(--sh); }
.card{ border-radius:24px; }
/* кнопки — объёмные */
.btn{ border-radius:18px; font-weight:800; letter-spacing:.01em; box-shadow:0 6px 0 rgba(0,0,0,.22); transition:transform .08s, box-shadow .08s; }
.btn:active{ transform:translateY(5px); box-shadow:0 1px 0 rgba(0,0,0,.22); }
.btn.big{ font-size:22px; min-height:66px; }
.btn.mic{ background:linear-gradient(#22c55e,#16a34a); } .btn.stop{ background:linear-gradient(#fb7185,#e11d48); }
.opt{ border:3px solid transparent; border-radius:18px; font-weight:700; box-shadow:0 5px 0 rgba(15,23,42,.12); transition:transform .08s; }
.opt:not(:disabled):active{ transform:translateY(4px); }
.opt.right{ background:#dcfce7; border-color:#22c55e; animation:pop .35s; } .opt.wrong{ background:#ffe4e6; border-color:#fb7185; animation:shake .35s; }
@keyframes pop{ 50%{ transform:scale(1.08); } } @keyframes shake{ 25%{ transform:translateX(-6px); } 75%{ transform:translateX(6px); } }
/* уроки — у каждого предмета свой цвет */
.tile{ border-radius:22px; border-left:10px solid var(--sc,#94a3b8); transition:transform .1s; }
.tile:not(.locked):active{ transform:scale(.97); }
.tile .ico{ background:var(--sc,#94a3b8); color:#fff; width:62px; height:62px; border-radius:18px; font-size:22px; font-weight:900; box-shadow:0 4px 0 rgba(0,0,0,.18); }
.tile[data-subj=read]{ --sc:#f97316; } .tile[data-subj=math]{ --sc:#3b82f6; } .tile[data-subj=rus]{ --sc:#ef4444; } .tile[data-subj=world]{ --sc:#22c55e; }
.tile[data-subj=hist]{ --sc:#a855f7; } .tile[data-subj=logic]{ --sc:#eab308; } .tile[data-subj=lang]{ --sc:#06b6d4; } .tile[data-subj=hw]{ --sc:#64748b; }
.tile.locked{ opacity:1; filter:none; background:#e2e8f0; } .tile.locked .tt{ opacity:.6; } .tile.locked .ico{ filter:grayscale(1); opacity:.6; } body.anya .tile.locked{ background:#d9c9a3; }
.tile.done{ opacity:1; } .tile.done::after{ content:"✓"; position:absolute; right:12px; top:8px; color:#16a34a; font-weight:900; }
.tile.main{ border-color:var(--sc); }
.prog{ height:16px; background:rgba(255,255,255,.55); } .prog i{ background:linear-gradient(90deg,#facc15,#f97316); }
.steps li{ background:rgba(255,255,255,.85); font-weight:700; } .steps li.now{ background:var(--acc); color:#fff; }
.coins{ border:0; font-weight:900; box-shadow:0 4px 0 rgba(0,0,0,.15); }
.banner{ font-size:40px; }
/* вход */
.wrap.login .kidcard{ border:0; color:#fff; position:relative; overflow:hidden; }
.wrap.login .kidcard .kg,.wrap.login .kidcard .kc{ color:#fff; }
.kidcard.yarik{ background:linear-gradient(#22c55e,#15803d); box-shadow:0 8px 0 #14532d,0 14px 30px rgba(0,0,0,.25); }
.kidcard.anya{ background:linear-gradient(#312e81,#581c87); box-shadow:0 8px 0 #2e1065,0 14px 30px rgba(0,0,0,.25); }
.kidcard .avatar{ background:#fff; color:#15803d; box-shadow:0 5px 0 rgba(0,0,0,.2); } .kidcard.anya .avatar{ color:#6d28d9; background:#fde68a; }

<script>/* v75071f5a */
/* ===== Общие утилиты ===== */
const U = {
  h(s){ let h = 2166136261; for (const c of String(s)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; },
  rng(seed){
    let a = typeof seed === 'number' ? seed : U.h(seed);
    const f = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
    f.int = (x, y) => x + Math.floor(f() * (y - x + 1));
    f.pick = arr => arr[Math.floor(f() * arr.length)];
    f.shuffle = arr => { arr = arr.slice(); for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(f() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
    f.sample = (arr, n) => f.shuffle(arr).slice(0, n);
    return f;
  },
  pl(n, one, few, many){ const m10 = n % 10, m100 = n % 100; if (m10 === 1 && m100 !== 11) return one; if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few; return many; },
  dec(x){ return String(Math.round(x * 1000) / 1000).replace('.', ','); },
  big(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); },
  esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); },
  today(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); },
  dayNum(ds){ const [y, m, d] = ds.split('-').map(Number); return Math.floor(Date.UTC(y, m - 1, d) / 864e5); },
  addDays(ds, n){ const [y, m, d] = ds.split('-').map(Number); const t = new Date(Date.UTC(y, m - 1, d + n)); return t.toISOString().slice(0, 10); },
  roman(n){ const r = [[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']]; let s = ''; for (const [v, c] of r) while (n >= v) { s += c; n -= v; } return s; },
  gcd(a, b){ while (b) [a, b] = [b, a % b]; return Math.abs(a); }
};

/* ===== Конструкторы заданий =====
   k:'c' — выбор ответа, k:'n' — число. q — вопрос (html), a — ответ, w — неверные, e — пояснение */
function C(q, a, w, e){ a = String(a); const ws = []; for (const x of w) { const s = String(x); if (s !== a && !ws.includes(s)) ws.push(s); } return { k: 'c', q, a, w: ws.slice(0, 3), e: e || '' }; }
function N(q, a, e){ return { k: 'n', q, a: Number(a), e: e || '' }; }
function cmp(a, b){ return a > b ? '>' : a < b ? '<' : '='; }
function CMP(q, x, y, e){ const s = cmp(x, y); return C(q, s, ['>', '<', '='].filter(z => z !== s), e); }
/* Банк: строки "вопрос|ответ|неверный1;неверный2;неверный3|пояснение" */
function B(lines){
  const items = lines.map(l => { const [q, a, w, e] = l.split('|'); return { q, a, w: (w || '').split(';').filter(Boolean), e }; });
  return r => { const it = r.pick(items); return C(it.q, it.a, it.w, it.e); };
}
/* Несколько генераторов вперемешку */
function MIX(...gs){ return r => r.pick(gs)(r); }
/* Неверные числовые ответы рядом с правильным */
function near(a, r, steps){ steps = steps || [1, 2, 10, -1, -2, -10, 5, -5]; const out = []; for (const s of r.shuffle(steps)) { const v = a + s; if (v >= 0 && v !== a && !out.includes(v)) out.push(v); if (out.length === 3) break; } return out; }

/* Согласование числа и слова в задачах: «4 сов» → «4 совы», «21 очков» → «21 очко». После предлогов форму не трогаем. */
const AGREE = (() => { const L = 'единица,единицы,единиц|десяток,десятка,десятков|зверёк,зверька,зверьков|рыбка,рыбки,рыбок|мяч,мяча,мячей|монета,монеты,монет|щенок,щенка,щенков|слово,слова,слов|гол,гола,голов|место,места,мест|кораблик,кораблика,корабликов|уровень,уровня,уровней|цент,цента,центов|ведро,ведра,вёдер|нога,ноги,ног|паук,паука,пауков|конфета,конфеты,конфет|собака,собаки,собак|игрок,игрока,игроков|цветок,цветка,цветков|ряд,ряда,рядов|марка,марки,марок|яблоко,яблока,яблок|наклейка,наклейки,наклеек|минута,минуты,минут|день,дня,дней|квадрат,квадрата,квадратов|дом,дома,домов|утка,утки,уток|очко,очка,очков|команда,команды,команд|книга,книги,книг|шкатулка,шкатулки,шкатулок|письмо,письма,писем|сова,совы,сов|заклинание,заклинания,заклинаний|звёздочка,звёздочки,звёздочек|ученик,ученика,учеников|страница,страницы,страниц|кошка,кошки,кошек|мышь,мыши,мышей|сын,сына,сыновей|друг,друга,друзей|кофта,кофты,кофт|юбка,юбки,юбок|стул,стула,стульев|балл,балла,баллов|задача,задачи,задач|час,часа,часов|котёнок,котёнка,котят|птица,птицы,птиц|машина,машины,машин|карандаш,карандаша,карандашей|гриб,гриба,грибов|ягода,ягоды,ягод|лист,листа,листов|страна,страны,стран|ребёнок,ребёнка,детей';
  const m = {}; for (const g of L.split('|')) { const f = g.split(','); for (const w of f) if (!m[w] || w === f[2]) m[w] = f; } return m; })();
const AGREE_PREP = /(?:^|[\s(«])(из|от|до|без|у|для|около|кроме|с|со|по|в|во|на|о|об|к|ко|за|между|над|под|при)\s+$/i;
function agree(s){ if (typeof s !== 'string') return s; return s.replace(/(?<![\d,.])(\d+)(\s+)([а-яё]+)(?![а-яё])/gi, (all, n, sp, w, off, str) => { const f = AGREE[w.toLowerCase()]; if (!f) return all;
  if (AGREE_PREP.test(str.slice(Math.max(0, off - 12), off))) return all; const k = +n, m10 = k % 10, m100 = k % 100;
  const v = m10 === 1 && m100 !== 11 ? f[0] : m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20) ? f[1] : f[2]; return n + sp + (w[0] === w[0].toUpperCase() ? v[0].toUpperCase() + v.slice(1) : v); }); }

/* ===== Ярик, 2 класс. Математика — по учебнику М. И. Моро и др. (1986) ===== */
const Y_MATH = [
 { id:'m2_1', t:'Числа от 1 до 100. Десятки и единицы',
   th:'Число 47 состоит из <b>4 десятков</b> и <b>7 единиц</b>. Десятки пишут слева, единицы справа.<br>10 единиц = 1 десяток. 10 десятков = 1 сотня (100).<br>Сравнивая числа, сначала смотрим на десятки: 52 &gt; 48, потому что 5 дес. больше 4 дес.',
   g: r => { const t = r.int(0,3), n = r.int(11,99), d = Math.floor(n/10), u = n%10;
     if (t===0) return N(`Сколько десятков в числе ${n}?`, d, `${n} = ${d} дес. ${u} ед.`);
     if (t===1) return N(`Запиши число: ${d} дес. ${u} ед.`, n, `${d} десятков и ${u} единиц — это ${n}.`);
     if (t===2) { const m = r.int(10,98); return N(`Какое число идёт при счёте сразу после ${m}?`, m+1, `${m} + 1 = ${m+1}`); }
     const a = r.int(10,99), b = r.int(10,99); return CMP(`Сравни числа: ${a} ? ${b}`, a, b, 'Сначала сравниваем десятки, потом единицы.'); } },
 { id:'m2_2', t:'Сложение и вычитание без перехода через десяток',
   th:'Десятки складываем с десятками, единицы — с единицами:<br>34 + 25 = (30 + 20) + (4 + 5) = 50 + 9 = <b>59</b>.<br>Так же вычитаем: 68 − 23 = (60 − 20) + (8 − 3) = 40 + 5 = <b>45</b>.',
   g: r => { if (r()<.5) { const d1=r.int(1,7), d2=r.int(1,9-d1), u1=r.int(0,8), u2=r.int(0,9-u1), a=d1*10+u1, b=d2*10+u2; return N(`${a} + ${b} = ?`, a+b, `${d1*10} + ${d2*10} = ${(d1+d2)*10}, ${u1} + ${u2} = ${u1+u2}`); }
     const a = r.int(3,9)*10 + r.int(1,9), u1 = a%10, b = r.int(1,Math.floor(a/10)-1)*10 + r.int(0,u1); return N(`${a} − ${b} = ?`, a-b, `Десятки: ${Math.floor(a/10)} − ${Math.floor(b/10)}, единицы: ${u1} − ${b%10}`); } },
 { id:'m2_3', t:'Единицы длины: сантиметр, дециметр, метр',
   th:'<b>1 дм = 10 см</b>, <b>1 м = 10 дм = 100 см</b>.<br>4 дм 6 см = 40 см + 6 см = 46 см.<br>Чтобы сравнить длины, переводим их в одинаковые единицы.',
   g: r => { const t = r.int(0,4);
     if (t===0) { const d=r.int(2,9); return N(`${d} дм = ? см`, d*10, `1 дм = 10 см, значит ${d} дм = ${d*10} см`); }
     if (t===1) { const c=r.int(2,9)*10; return N(`${c} см = ? дм`, c/10, `В 1 дм 10 см`); }
     if (t===2) { const d=r.int(1,9), c=r.int(1,9); return N(`${d} дм ${c} см = ? см`, d*10+c, `${d*10} см + ${c} см`); }
     if (t===3) { const m=r.int(1,5); return N(`${m} м = ? см`, m*100, `1 м = 100 см`); }
     const a=r.int(2,9), b=r.int(15,95); return CMP(`Сравни: ${a} дм ? ${b} см`, a*10, b, `${a} дм = ${a*10} см`); } },
 { id:'m2_4', t:'Сложение с переходом через десяток',
   th:'38 + 7: дополняем до круглого числа. 38 + 2 = 40, и ещё 5 — получается <b>45</b>.<br>Столбиком: 8 + 7 = 15, пишем 5 единиц, а 1 десяток добавляем к десяткам.',
   g: r => { const u1=r.int(2,9), u2=r.int(10-u1,9), d1=r.int(1,7), d2=r.int(0,8-d1), a=d1*10+u1, b=d2*10+u2; return N(`${a} + ${b} = ?`, a+b, `${u1} + ${u2} = ${u1+u2}: пишем ${(u1+u2)%10}, 1 десяток запоминаем`); } },
 { id:'m2_5', t:'Вычитание с переходом через десяток',
   th:'52 − 7: сначала вычтем 2, получим 50, потом ещё 5 — получится <b>45</b>.<br>Столбиком: из 2 нельзя вычесть 7, занимаем 1 десяток: 12 − 7 = 5.',
   g: r => { const d1=r.int(2,9), u1=r.int(0,8), u2=r.int(u1+1,9), d2=r.int(0,d1-1), a=d1*10+u1, b=d2*10+u2; return N(`${a} − ${b} = ?`, a-b, `Занимаем десяток: ${10+u1} − ${u2} = ${10+u1-u2}`); } },
 { id:'m2_6', t:'Уравнения: найди неизвестное число',
   th:'x + 8 = 15. Чтобы найти неизвестное слагаемое, из суммы вычитаем известное слагаемое: x = 15 − 8 = <b>7</b>.<br>Неизвестное уменьшаемое = разность + вычитаемое: x − 5 = 9, x = 14.<br>Неизвестное вычитаемое = уменьшаемое − разность: 20 − x = 12, x = 8.',
   g: r => { const t=r.int(0,3), a=r.int(5,40), x=r.int(5,50);
     if (t===0) return N(`x + ${a} = ${x+a}. Найди x.`, x, `x = ${x+a} − ${a}`);
     if (t===1) return N(`${a} + x = ${x+a}. Найди x.`, x, `x = ${x+a} − ${a}`);
     if (t===2) return N(`x − ${a} = ${x}. Найди x.`, x+a, `x = ${x} + ${a}`);
     const m = x + a; return N(`${m} − x = ${x}. Найди x.`, a, `x = ${m} − ${x}`); } },
 { id:'m2_7', t:'Задачи в два действия',
   th:'Читаем задачу, находим, что известно и что нужно узнать. Если сразу ответить нельзя, сначала находим недостающее число.<br><i>В одной корзине 10 кг яблок, в другой на 4 кг меньше. Сколько в двух корзинах?</i><br>1) 10 − 4 = 6 (кг) — во второй; 2) 10 + 6 = <b>16</b> (кг).',
   g: MIX(
     r => { const a=r.int(8,20), b=r.int(2,a-3); return N(`В одной корзине ${a} кг яблок, а в другой на ${b} кг меньше. Сколько килограммов яблок в двух корзинах?`, a+a-b, `1) ${a} − ${b} = ${a-b}; 2) ${a} + ${a-b} = ${2*a-b}`); },
     r => { const a=r.int(5,15), b=r.int(2,9), c=r.int(2,a+b-1); return N(`На остановке стояли ${a} человек. Подошли ещё ${b}, а ${c} сели в автобус. Сколько человек осталось на остановке?`, a+b-c, `1) ${a} + ${b} = ${a+b}; 2) ${a+b} − ${c} = ${a+b-c}`); },
     r => { const a=r.int(2,6)*5, b=r.int(3,9)*5; return N(`Мама купила хлеб за ${a} центов и молоко за ${b} центов. Она дала 1 евро (100 центов). Сколько центов сдачи она получила?`, 100-a-b, `1) ${a} + ${b} = ${a+b}; 2) 100 − ${a+b} = ${100-a-b}`); },
     r => { const a=r.int(30,60), b=r.int(10,a-5), c=r.int(5,30); return N(`В бочке было ${a} вёдер воды. На полив взяли ${b} вёдер, потом долили ${c}. Сколько вёдер воды стало в бочке?`, a-b+c, `1) ${a} − ${b} = ${a-b}; 2) ${a-b} + ${c} = ${a-b+c}`); },
     r => { const a=r.int(6,15), b=r.int(2,a-2); return N(`Саша сделал ${a} корабликов, а Миша на ${b} меньше. Сколько корабликов сделали мальчики вместе?`, 2*a-b, `1) ${a} − ${b} = ${a-b}; 2) ${a} + ${a-b} = ${2*a-b}`); },
     r => { const a=r.int(20,40), b=r.int(10,25), c=r.int(10, a+b-5); return N(`Аня придумала ${a} слов, Ира ${b} слов, а Серёжа на ${c} слов меньше, чем Аня и Ира вместе. Сколько слов придумал Серёжа?`, a+b-c, `1) ${a} + ${b} = ${a+b}; 2) ${a+b} − ${c} = ${a+b-c}`); }
   ) },
 { id:'m2_8', t:'Периметр',

   g: MIX(
     r => { const a=r.int(3,12), b=r.int(3,12), c=r.int(3,12); return N(`Стороны треугольника ${a} см, ${b} см и ${c} см. Найди периметр.`, a+b+c, `${a} + ${b} + ${c}`); },
     r => { const a=r.int(4,15), b=r.int(2,a-1); return N(`Длина прямоугольника ${a} см, ширина ${b} см. Найди периметр.`, 2*(a+b), `${a} + ${b} + ${a} + ${b}`); },
     r => { const a=r.int(2,10); return N(`Сторона квадрата ${a} см. Найди периметр.`, 4*a, `${a} + ${a} + ${a} + ${a}`); },

   ) },
 { id:'m2_9', t:'Время: часы и минуты',
   th:'<b>1 ч = 60 мин</b>, <b>1 сутки = 24 ч</b>, <b>1 мин = 60 с</b>.<br>Полчаса = 30 мин, четверть часа = 15 мин.<br>Короткая стрелка часов — часовая, длинная — минутная.',
   g: MIX(

function ptNum(n){ const D = PT_UNITS_DATA; if (n < 20) return D[10][n]; if (n < 100) { const t = Math.floor(n / 10), u = n % 10; return D.T[t] + (u ? ' e ' + D[10][u] : ''); } if (n === 100) return 'cem'; const h = Math.floor(n / 100), rest = n % 100; return D.H[h] + (rest ? ' e ' + ptNum(rest) : ''); }
function vocabGen(words, lname){ lname = lname || 'по-португальски';
  return r => { const [pt, ru, em] = r.pick(words); const others = words.filter(w => w[0] !== pt); const t = r.int(0, 2);
    if (t === 0) return Object.assign(C(`Что значит <span class="pt">${pt}</span>?`, ru, r.sample(others, 3).map(w => w[1]), `${pt} — ${ru}`), { sp: pt });
    if (t === 1) return Object.assign(C(`Как ${lname} «${ru}»? <span class="em">${em || ''}</span>`, pt, r.sample(others, 3).map(w => w[0]), `${ru} — ${pt}`), { sp: pt, spAfter: true });
    return Object.assign(C(`Послушай и выбери перевод 🔊`, ru, r.sample(others, 3).map(w => w[1]), `${pt} — ${ru}`), { sp: pt, auto: true }); };
}

   g: B(['Что такое земледелие?|выращивание растений|охота на зверей;рыбалка;торговля','Бронза — это сплав…|меди и олова|железа и угля;золота и серебра;глины и песка','Какой металл люди начали использовать первым?|медь|железо;алюминий;сталь','Что изменилось, когда люди стали земледельцами?|они стали жить оседло|они стали кочевать;они перестали работать;они переселились в пещеры','Кто такой гончар?|мастер, который делает посуду из глины|охотник;пастух;воин','Какое животное одним из первых приручил человек?|собаку|льва;слона;кенгуру']) },
 { id:'h5_4', t:'Древний Египет',
   th:'Египет лежит в долине <b>Нила</b>. Разливы реки приносили плодородный ил. Царём был <b>фараон</b>. Для фараона Хеопса около 2560 г. до н. э. построили пирамиду высотой около 146 м.<br>Египтяне писали <b>иероглифами</b> на <b>папирусе</b>, знали календарь из 365 дней. Иероглифы прочитал француз Шампольон в 1822 г. по Розеттскому камню.',
   g: B(['Почему земля в долине Нила была плодородной?|разливы приносили ил|там часто шли дожди;её удобряли химией;там были леса','Как называли царя Египта?|фараон|император;консул;султан','Чья пирамида — самая большая?|Хеопса|Тутанхамона;Цезаря;Александра Македонского','Кто расшифровал египетские иероглифы?|Шампольон|Геродот;Колумб;Гомер','На чём писали египтяне?|на папирусе|на глиняных табличках;на бумаге;на шёлке','Сколько дней было в египетском году?|365|300;100;12']) },
 { id:'h5_5', t:'Западная Азия: Междуречье, Финикия, Персия',
   th:'<b>Междуречье</b> (Месопотамия) — между реками Тигр и Евфрат. Писали <b>клинописью</b> на глиняных табличках. Царь Вавилона <b>Хаммурапи</b> записал законы на каменном столбе (около 1750 г. до н. э.).<br><b>Финикийцы</b> — мореплаватели и торговцы, придумали <b>алфавит</b> из 22 букв, от него произошли греческий и латинский.<br>Персидская держава была огромной; цари строили дороги и почту.',
   g: B(['Между какими реками лежит Междуречье?|Тигр и Евфрат|Нил и Тежу;Инд и Ганг;Хуанхэ и Янцзы','Как писали в Междуречье?|клинописью на глине|иероглифами на папирусе;буквами на бумаге;узелками','Кто записал свод законов в Вавилоне?|Хаммурапи|Хеопс;Дарий;Цезарь','Что придумали финикийцы?|алфавит|бумагу;порох;колесо обозрения','Чем занимались финикийцы?|мореплаванием и торговлей|только земледелием;строили пирамиды;охотились на мамонтов']) },
 { id:'h5_6', t:'Древняя Индия и Китай',
   th:'В <b>Индии</b> (реки Инд и Ганг) придумали цифры, которые мы называем «арабскими», и знак нуля; там появилась игра — предок шахмат.<br>В <b>Китае</b> (реки Хуанхэ и Янцзы) изобрели <b>бумагу</b>, шёлк, компас. Император Цинь Шихуанди объединил страну и начал строить <b>Великую Китайскую стену</b>. Мудрец Конфуций учил уважать старших и учиться всю жизнь.',
   g: B(['Где придумали цифры, которыми мы пишем?|в Индии|в Египте;в Риме;в Португалии','Что изобрели в Древнем Китае?|бумагу|алфавит;пирамиды;олимпийские игры','Зачем строили Великую Китайскую стену?|для защиты от набегов кочевников|для красоты;для туристов;как дорогу для машин','Предок какой игры появился в Индии?|шахматы|футбол;шашки-го;теннис','Чему учил Конфуций?|уважать старших и учиться всю жизнь|воевать;строить пирамиды;плавать по морю','Какие реки текут в Китае?|Хуанхэ и Янцзы|Тигр и Евфрат;Нил и Конго;Инд и Ганг']) },
 { id:'h5_7', t:'Древняя Греция: мифы, Троя, Гомер',
   th:'Греки жили на Балканах и островах Эгейского моря. Поэт <b>Гомер</b> сложил поэмы «Илиада» (о Троянской войне) и «Одиссея» (о странствиях царя Одиссея).<br>По легенде, греки взяли Трою с помощью <b>деревянного коня</b>. На острове Крит жили мореплаватели, о них сложен миф о Минотавре и лабиринте.',
   g: B(['Кто автор «Илиады» и «Одиссеи»?|Гомер|Геродот;Сократ;Цезарь','Как, по легенде, греки взяли Трою?|с помощью деревянного коня|подкопом;пушками;голодом','О чём «Одиссея»?|о странствиях Одиссея|о строительстве пирамид;о войне с Римом;о путешествии в Индию','На каком острове жил, по мифу, Минотавр?|Крит|Сицилия;Мадейра;Британия','Какое море омывает Грецию?|Эгейское|Балтийское;Чёрное;Северное']) },
 { id:'h5_8', t:'Афины и Спарта. Олимпийские игры',
   th:'В <b>Афинах</b> возникла <b>демократия</b>: важные дела решало народное собрание граждан. В <b>Спарте</b> мальчиков с детства воспитывали воинами.<br>Первые Олимпийские игры прошли в 776 г. до н. э. в Олимпии. В 490 г. до н. э. греки победили персов при <b>Марафоне</b> — отсюда марафонский бег.<br>Греки строили театры, изучали математику (Пифагор) и философию (Сократ).',
   g: B(['Где возникла демократия?|в Афинах|в Спарте;в Египте;в Персии','Когда прошли первые Олимпийские игры?|776 г. до н. э.|1896 г.;476 г.;1500 г. до н. э.','Как воспитывали мальчиков в Спарте?|воинами|художниками;торговцами;мореплавателями','В честь какой битвы назван марафонский бег?|битва при Марафоне|Троянская война;битва при Каннах;Куликовская битва','Кто такой Пифагор?|математик|полководец;царь Спарты;поэт «Илиады»','Что означает слово «демократия»?|власть народа|власть царя;власть жрецов;власть войска']) },
 { id:'h5_9', t:'Александр Македонский',
   th:'<b>Александр Македонский</b> (356–323 гг. до н. э.), ученик философа Аристотеля, в 20 лет стал царём Македонии. Он разгромил Персидскую державу и дошёл до Индии.<br>Основал много городов, самый известный — <b>Александрия</b> в Египте с огромной библиотекой и маяком — одним из семи чудес света.',
   g: B(['Кто был учителем Александра Македонского?|Аристотель|Гомер;Пифагор;Конфуций','До какой страны дошёл Александр со своим войском?|до Индии|до Португалии;до Китая;до Британии','Какой город он основал в Египте?|Александрию|Каир;Рим;Карфаген','Что было знаменито в Александрии?|библиотека и маяк|Колизей;пирамида Хеопса;Великая стена','Какую державу разгромил Александр?|Персидскую|Римскую;Китайскую;Египетскую при Хеопсе']) },
 { id:'h5_10', t:'Древний Рим: город и республика',
   th:'По легенде, Рим основали братья <b>Ромул и Рем</b>, вскормленные волчицей, в 753 г. до н. э. В 509 г. до н. э. римляне изгнали царя — возникла <b>республика</b>: правили два консула и сенат.<br>Римляне строили дороги, акведуки (водопроводы), мосты. Их язык — <b>латынь</b>, от неё произошли португальский, испанский, итальянский, французский.',
   g: B(['Кто, по легенде, основал Рим?|Ромул и Рем|Цезарь и Август;Одиссей;Александр','Кто правил Римской республикой?|два консула и сенат|фараон;царь Спарты;император Китая','Что такое акведук?|водопровод|театр;корабль;крепость','Из какого языка произошёл португальский?|из латыни|из греческого;из арабского;из финикийского','В каком году, по легенде, основан Рим?|753 г. до н. э.|476 г.;1147 г.;776 г. до н. э.']) },
 { id:'h5_11', t:'Рим: Карфаген, Цезарь, империя',
   th:'Рим долго воевал с <b>Карфагеном</b>. Полководец Карфагена <b>Ганнибал</b> в 218 г. до н. э. перешёл со слонами через Альпы. В 146 г. до н. э. Карфаген был разрушен.<br><b>Юлий Цезарь</b> завоевал Галлию и стал диктатором; в 44 г. до н. э. его убили заговорщики. Его наследник <b>Октавиан Август</b> стал первым императором.<br>В Риме построили <b>Колизей</b> — амфитеатр на 50 тысяч зрителей.',
   g: B(['Кто перешёл через Альпы со слонами?|Ганнибал|Цезарь;Александр;Спартак','С каким городом Рим вёл долгие войны?|Карфаген|Афины;Вавилон;Александрия','Кто стал первым римским императором?|Октавиан Август|Юлий Цезарь;Ромул;Нерон','Что такое Колизей?|амфитеатр для зрелищ|храм;дворец императора;маяк','Какую страну завоевал Юлий Цезарь?|Галлию|Египет;Индию;Китай']) },
 { id:'h5_12', t:'Лузитания. Конец Западной Римской империи',
   th:'Римляне пришли на Пиренейский полуостров. Племена <b>лузитан</b> во главе с <b>Вириатом</b> долго им сопротивлялись. Потом здесь была римская провинция <b>Лузитания</b>; Лиссабон назывался <b>Олисипо</b>, в Эворе сохранился римский храм.<br>Империя ослабла и была разделена на Западную и Восточную. В <b>476 году</b> пала Западная Римская империя — этим годом заканчивается история Древнего мира.',
   g: B(['Как римляне называли Лиссабон?|Олисипо|Лузитания;Эвора;Карфаген','Кто возглавил борьбу лузитан против Рима?|Вириат|Ганнибал;Спартак;Ромул','В каком городе Португалии сохранился римский храм?|в Эворе|в Фару;на Мадейре;в Браге на вершине горы','Когда пала Западная Римская империя?|в 476 году|в 1500 году;в 753 г. до н. э.;в 1755 году','Как называлась римская провинция на месте Португалии?|Лузитания|Галлия;Британия;Македония']) }
];

 { id:'g5_3', t:'Градусная сетка: широта и долгота',

 { id:'g5_4', t:'Земная кора: горы, вулканы, землетрясения',
   th:'Земная кора состоит из плит, которые медленно движутся. На их границах бывают <b>землетрясения</b> и извержения <b>вулканов</b>.<br>В 1755 году Лиссабон разрушило сильное землетрясение и цунами. Азорские острова — вулканические, гора Пику (2 351 м) — самая высокая в Португалии. Самая высокая гора мира — Эверест (8 849 м).',
   g: B(['Что разрушило Лиссабон в 1755 году?|землетрясение и цунами|извержение Везувия;война;наводнение реки Дору','Самая высокая гора Португалии?|Пику на Азорах|Серра-да-Эштрела;Эверест;Монблан','Самая высокая гора мира?|Эверест|Эльбрус;Пику;Килиманджаро','Как появились Азорские острова?|из-за извержений вулканов|их насыпали люди;их принёс ледник;из кораллов','Почему бывают землетрясения?|движутся плиты земной коры|дует сильный ветер;Луна притягивает дома;идут дожди']) },
 { id:'g5_5', t:'Вода на Земле',
   th:'Почти 3/4 поверхности Земли покрыто водой. Самый большой и глубокий океан — <b>Тихий</b>, в нём Марианская впадина (около 11 км).<br>Самая длинная река — Нил (или Амазонка — споры идут), самая полноводная — Амазонка. Самая длинная река Пиренейского полуострова — Тежу (около 1 000 км).',
   g: B(['Какая часть поверхности Земли покрыта водой?|почти три четверти|половина;одна десятая;вся','Где находится самая глубокая впадина?|в Тихом океане|в Атлантическом;в Индийском;в Средиземном море','Самая полноводная река мира?|Амазонка|Тежу;Волга;Темза','Самая длинная река Пиренейского полуострова?|Тежу|Дору;Гвадиана;Эбро','Глубина Марианской впадины около…|11 км|1 км;100 м;50 км']) },
 { id:'g5_6', t:'Атмосфера и погода',
   th:'<b>Атмосфера</b> — воздушная оболочка Земли. С высотой воздух холоднее: примерно на 6° на каждый километр.<br>Погоду описывают температура, давление (барометр), ветер (флюгер), осадки, облачность. Климат Португалии — средиземноморский: жаркое сухое лето и мягкая дождливая зима.',

const PT_IRR = { ser:['sou','és','é','somos','são'], estar:['estou','estás','está','estamos','estão'], ter:['tenho','tens','tem','temos','têm'], ir:['vou','vais','vai','vamos','vão'], fazer:['faço','fazes','faz','fazemos','fazem'], poder:['posso','podes','pode','podemos','podem'], querer:['quero','queres','quer','queremos','querem'] };

function conjGen(table){ return r => { const g=r.pick(Object.keys(PT_VERBS).filter(k=>table===PT_REG||true)); const [v,ru]=r.pick(PT_VERBS[g]); const st=v.slice(0,-2); const forms=table[g].map(e=>st+e); const i=r.int(0,4); return Object.assign(C(`${PT_PRON[i]} ___ (${v} — ${ru})`, forms[i], r.sample(forms.filter((_,j)=>j!==i),3), `${v}: ${forms.join(', ')}`), {sp: PT_PRON[i].split(' ')[0]+' '+forms[i], spAfter:true}); }; }

/* ===== Аня: продолжение программы (декабрь — март). Виленкин 5–6 кл. (1990); Ладыженская 5–6 кл.; Агибалова, Донской. История Средних веков (1988); география 5–6 кл. ===== */
const FS = (n, d) => { const g = U.gcd(n, d) || 1; n /= g; d /= g; return d === 1 ? String(n) : `${n}/${d}`; };
const MXS = (n, d) => { const w = Math.floor(n / d), m = n % d; return !m ? String(w) : w ? `${w} ${m}/${d}` : `${m}/${d}`; };
function frC(q, n, d, r, e){ const v = n / d, a = FS(n, d), w = [];
  for (const [x, y] of r.shuffle([[n + d, d], [n, d + 1], [n + 1, d], [Math.max(1, n - 1), d], [n, d * 2], [n * 2, d]])) { if (Math.abs(x / y - v) > 1e-9) { const s = FS(x, y); if (s !== a && !w.includes(s)) w.push(s); } if (w.length === 3) break; }
  return C(q, a, w, e); }

 { id:'m5_32', t:'Наименьшее общее кратное',
   th:'<b>НОК</b> — самое маленькое число, которое делится на оба числа. НОК(4, 6) = 12.<br>НОК(a, b) = a · b : НОД(a, b). Если числа взаимно простые, НОК = их произведение: НОК(4, 9) = 36.',
   g: MIX(r => { const a=r.int(2,15), b=r.int(2,15); return N(`Найди НОК(${a}, ${b}).`, a*b/U.gcd(a,b), `${a} · ${b} : ${U.gcd(a,b)}`); },
     r => { const a=r.pick([3,4,5,6]), b=r.pick([4,6,8,10]); return N(`Автобус №1 приходит каждые ${a} мин, №2 — каждые ${b} мин. Сейчас пришли вместе. Через сколько минут снова придут вместе?`, a*b/U.gcd(a,b), `НОК(${a}, ${b})`); }) },
 { id:'m5_33', t:'Основное свойство дроби. Сокращение',
   th:'Числитель и знаменатель можно умножить или разделить на одно и то же число — дробь не изменится: 2/3 = 4/6 = 6/9.<br><b>Сократить</b> — разделить на общий делитель: 12/18 = 2/3 (делим на 6).',
   g: MIX(r => { let x, y; do { x=r.int(1,8); y=r.int(2,9); } while (x>=y || U.gcd(x,y)!==1); const k=r.int(2,9); return C(`Сократи дробь ${x*k}/${y*k}`, `${x}/${y}`, [`${x+1}/${y}`, `${x}/${y+1}`, `${x*k}/${y}`, `${x}/${y*k}`], `Делим числитель и знаменатель на ${k}`); },
     r => { let x, y; do { x=r.int(1,6); y=r.int(2,9); } while (x>=y); const k=r.int(2,6); return N(`${x}/${y} = ?/${y*k}. Найди числитель.`, x*k, `${y} · ${k} = ${y*k}, значит и ${x} · ${k}`); }) },
 { id:'m5_34', t:'Общий знаменатель. Сравнение дробей',
   th:'Чтобы сравнить 3/4 и 5/6, приведём к общему знаменателю 12: 3/4 = 9/12, 5/6 = 10/12. Значит 3/4 < 5/6.<br>Общий знаменатель — НОК знаменателей.',
   g: MIX(r => { const b=r.pick([3,4,5,6,8]), d=r.pick([3,4,6,9,10,12]); const a=r.int(1,b-1), c=r.int(1,d-1); return CMP(`Сравни: ${a}/${b} ? ${c}/${d}`, a*d, c*b, `${a}/${b} = ${a*d}/${b*d}, ${c}/${d} = ${c*b}/${b*d}`); },
     r => { const b=r.pick([2,3,4,5,6]), d=r.pick([3,4,6,8,10]); return N(`Найди наименьший общий знаменатель дробей 1/${b} и 1/${d}.`, b*d/U.gcd(b,d), `НОК(${b}, ${d})`); }) },
 { id:'m5_35', t:'Сложение и вычитание дробей с разными знаменателями',
   th:'Приводим к общему знаменателю, потом складываем числители: 1/4 + 1/6 = 3/12 + 2/12 = <b>5/12</b>.<br>Ответ сокращаем, если можно: 1/6 + 1/3 = 1/6 + 2/6 = 3/6 = 1/2.',
   g: r => { const b=r.pick([2,3,4,5,6,8]), d=r.pick([3,4,6,9,10,12].filter(x=>x!==b)); const a=r.int(1,b-1), c=r.int(1,d-1); const plus = r() < .6 || a*d===c*b; const [p,q] = plus ? [a,b] : (a*d > c*b ? [a,b] : [c,d]); const [s,t] = plus ? [c,d] : (a*d > c*b ? [c,d] : [a,b]); const n = plus ? p*t+s*q : p*t-s*q; return frC(`${p}/${q} ${plus?'+':'−'} ${s}/${t} = ?`, n, q*t, r, `Общий знаменатель, потом сокращаем`); } },
 { id:'m5_36', t:'Умножение обыкновенных дробей',
   th:'Числитель умножаем на числитель, знаменатель — на знаменатель: 2/3 · 3/5 = 6/15 = <b>2/5</b>.<br>Дробь на натуральное число: 3/8 · 2 = 6/8 = 3/4.',
   g: MIX(r => { const a=r.int(1,5), b=r.int(a+1,9), c=r.int(1,5), d=r.int(c+1,9); return frC(`${a}/${b} · ${c}/${d} = ?`, a*c, b*d, r, `(${a} · ${c})/(${b} · ${d}) и сокращаем`); },
     r => { const a=r.int(1,7), b=r.int(a+1,12), k=r.int(2,6); return frC(`${a}/${b} · ${k} = ?`, a*k, b, r, `${a} · ${k} = ${a*k}`); }) },
 { id:'m5_37', t:'Нахождение дроби от числа',
   th:'Чтобы найти 3/4 от 20: делим на знаменатель и умножаем на числитель: 20 : 4 · 3 = <b>15</b>.<br>Чтобы найти число по его части: 2/5 числа = 8 → всё число 8 : 2 · 5 = 20.',
   g: MIX(r => { const b=r.int(2,9), a=r.int(1,b-1), n=b*r.int(2,15); return N(`Найди ${a}/${b} от ${n}.`, n/b*a, `${n} : ${b} · ${a}`); },
     r => { const b=r.int(3,8), a=r.int(1,b-1), n=b*r.int(2,10); return N(`В книге ${n} страниц. Аня прочитала ${a}/${b} книги. Сколько страниц она прочитала?`, n/b*a, `${n} : ${b} · ${a}`); },
     r => { const b=r.int(3,8), a=r.int(1,b-1), m=r.int(2,10); return N(`${a}/${b} числа равны ${a*m}. Найди всё число.`, b*m, `${a*m} : ${a} · ${b}`); }) },
 { id:'m5_38', t:'Окружность и круг',
   th:'<b>Радиус</b> — отрезок от центра до окружности. <b>Диаметр</b> — через центр, d = 2r.<br>Длина окружности C = 2πr ≈ 2 · 3,14 · r. Площадь круга S = πr².',
   g: MIX(r => { const R=r.int(2,40); return N(`Радиус окружности ${R} см. Найди диаметр.`, 2*R); },
     r => { const R=r.int(2,40); return N(`Диаметр окружности ${2*R} см. Найди радиус.`, R); },
     r => { const R=r.int(1,10); return N(`Найди длину окружности радиуса ${R} см (π ≈ 3,14).`, Math.round(628*R)/100, `2 · 3,14 · ${R}`); }) }
);

 { id:'r5_20', t:'О и Ё после шипящих в корне',

 { id:'r5_21', t:'И и Ы после Ц',

 { id:'r5_22', t:'Приставки на З и С',
   th:'Перед <b>звонкой</b> согласной и гласной пишем <b>з</b>: <b>раздать, безоблачный</b>. Перед <b>глухой</b> — <b>с</b>: <b>раскрыть, бесполезный</b>.<br>Так ведут себя приставки без-/бес-, раз-/рас-, из-/ис-, воз-/вос-, вз-/вс-, низ-/нис-, через-/черес-.',

 { id:'r5_23', t:'Корни -лаг-/-лож-, -раст-/-рос-',

 { id:'r5_24', t:'Корни -гор-/-гар-, -зар-/-зор-',
   th:'<b>-гар-/-гор-</b>: без ударения пишем <b>о</b>: з<b>а</b>гар — заг<b>о</b>реть, г<b>о</b>рячий.<br><b>-зор-/-зар-</b>: без ударения пишем <b>а</b>: з<b>о</b>ри — з<b>а</b>ря, оз<b>а</b>рить. Исключение: <b>выгарки</b>.',

 { id:'r5_25', t:'Е и И в окончаниях существительных',

 { id:'r5_26', t:'Склонение существительных',
   th:'<b>1-е склонение</b> — ж. и м. р. на -а, -я: мама, папа, земля. <b>2-е</b> — м. р. без окончания и ср. р. на -о, -е: дом, окно, поле. <b>3-е</b> — ж. р. на ь: ночь, мышь.<br><b>Разносклоняемые</b>: путь и 10 слов на -мя (время, имя…).',

 { id:'r5_27', t:'Краткие прилагательные',

 { id:'r5_28', t:'Спряжение глаголов. Е и И в окончаниях',

 { id:'r5_29', t:'Ь после шипящих',

 { id:'r5_30', t:'Прямая речь',

 { id:'r5_31', t:'Сложное предложение',
   th:'В <b>сложном</b> предложении две и больше грамматические основы. Между частями ставим <b>запятую</b>: <b>Солнце село, и стало прохладно.</b><br>В простом с однородными сказуемыми запятой перед <b>и</b> нет: <b>Солнце село и скрылось.</b>',

 { id:'r5_32', t:'Члены предложения',
   th:'<b>Подлежащее</b> — кто? что? <b>Сказуемое</b> — что делает? <b>Дополнение</b> — косвенные падежи: кого? чего? чем? <b>Определение</b> — какой? чей? <b>Обстоятельство</b> — где? когда? как? почему?',
   g: r => { const S=[['Рыжая лиса быстро бежала по лесу.',[['лиса','подлежащее'],['бежала','сказуемое'],['рыжая','определение'],['быстро','обстоятельство'],['по лесу','обстоятельство']]],['Аня читает интересную книгу.',[['Аня','подлежащее'],['читает','сказуемое'],['книгу','дополнение'],['интересную','определение']]],['Вечером Ярик забил красивый гол.',[['Ярик','подлежащее'],['забил','сказуемое'],['гол','дополнение'],['вечером','обстоятельство'],['красивый','определение']]],['Старый маяк светил кораблям.',[['маяк','подлежащее'],['светил','сказуемое'],['кораблям','дополнение'],['старый','определение']]]]; const [s,ws]=r.pick(S); const [w,a]=r.pick(ws); return C(`${s}<br>Каким членом предложения является «${w}»?`, a, ['подлежащее','сказуемое','дополнение','определение','обстоятельство'], ''); } },
 { id:'r5_33', t:'Морфемы. Разбор слова по составу',
   th:'<b>Приставка</b> — перед корнем, <b>корень</b> — общая часть родственных слов, <b>суффикс</b> — после корня, <b>окончание</b> — изменяемая часть.<br>под-<b>снеж</b>-ник-∅: приставка под-, корень снеж, суффикс -ник, окончание нулевое.',
   g: B(['Найди корень: подснежник|снеж|под;ник;подснеж','Найди приставку: переход|пере|ход;од;перех','Найди суффикс: лесник|ник|лес;ес;к','Найди окончание: книга|а|книг;ниг;га','Найди корень: водяной|вод|вода;ян;ной','Найди приставку: безоблачный|без|облак;облачн;ый','Найди суффикс: домик|ик|дом;м;ок','Найди корень: пригородный|город|при;н;пригород']) },
 { id:'r5_34', t:'НЕ с глаголами',

   g: B(['Как написать: (не)знал|раздельно|слитно;через дефис','Как написать: (не)навидеть|слитно|раздельно;через дефис','Как написать: (не)пришёл|раздельно|слитно;через дефис','Как написать: (не)годовать|слитно|раздельно;через дефис','Как написать: (не)могу|раздельно|слитно;через дефис','Как написать: (не)здоровится|слитно|раздельно;через дефис','Как написать: (не)буду|раздельно|слитно;через дефис']) },
 { id:'r5_35', t:'Корни -бер-/-бир-, -мер-/-мир-, -тер-/-тир-',
   th:'Если после корня суффикс <b>-а-</b> — пишем <b>и</b>: соб<b>и</b>рать, зам<b>и</b>рать, выт<b>и</b>рать. Без суффикса <b>-а-</b> — <b>е</b>: соб<b>е</b>ру, зам<b>е</b>реть, выт<b>е</b>реть.',

);

A_HIST.push(
 { id:'h5_13', t:'Великое переселение народов. Карл Великий',
   th:'После падения Рима в Европе появились королевства германских племён. Самым сильным стало <b>королевство франков</b>. Король <b>Карл Великий</b> объединил большую часть Западной Европы и в <b>800 году</b> был коронован императором.<br>Здесь начинаются <b>Средние века</b> — время рыцарей, замков и монастырей (примерно 476–1500 гг.).',
   g: B(['Какое племя создало сильное королевство в Галлии?|франки|римляне;греки;викинги','Когда Карл Великий стал императором?|в 800 году|в 476 году;в 1000 году;в 1492 году','С какого события обычно начинают Средние века?|с падения Западной Римской империи|с открытия Америки;с первых Олимпийских игр;с постройки пирамид','Где в Средние века хранили и переписывали книги?|в монастырях|в банках;в театрах;в типографиях']) },
 { id:'h5_14', t:'Византия',
   th:'Восточная Римская империя прожила ещё тысячу лет и называлась <b>Византия</b>. Столица — <b>Константинополь</b> (сейчас Стамбул). Император <b>Юстиниан</b> построил собор <b>Святой Софии</b> (537 г.) и собрал римские законы в один свод.<br>Из Византии на Русь пришли христианство, письменность и иконы. В 1453 г. Константинополь взяли турки.',
   g: B(['Как называлась Восточная Римская империя?|Византия|Галлия;Лузитания;Персия','Столица Византии?|Константинополь|Рим;Афины;Киев','Какой собор построил Юстиниан?|Святой Софии|Святого Петра;Нотр-Дам;Василия Блаженного','В каком году турки взяли Константинополь?|1453|1066;800;1492','Как сейчас называется Константинополь?|Стамбул|Анкара;Афины;Каир']) },
 { id:'h5_15', t:'Арабы. Аль-Андалус',
   th:'В VII веке в Аравии возникла новая религия — <b>ислам</b>. Арабы создали огромную державу — <b>халифат</b>. В 711 г. они пришли на Пиренейский полуостров; эту землю называли <b>Аль-Андалус</b>.<br>Арабы принесли в Европу цифры, которыми мы пишем (их называют <b>арабскими</b>), слово «алгебра», апельсины и рис. В португальском много арабских слов: <b>azeite, açúcar, almofada</b>.',
   g: B(['Как называлось арабское государство?|халифат|империя франков;Византия;республика','Когда арабы пришли на Пиренейский полуостров?|в 711 году|в 1143 году;в 476 году;в 1500 году','Как называли арабские земли на полуострове?|Аль-Андалус|Лузитания;Галлия;Олисипо','Какие цифры мы называем арабскими?|1, 2, 3…|I, V, X;α, β, γ;иероглифы','Какое португальское слово пришло из арабского?|azeite|mesa;livro;escola']) },
 { id:'h5_16', t:'Викинги',
   th:'<b>Викинги</b> (норманны) жили в Скандинавии. На быстрых <b>драккарах</b> они плавали по морям и рекам, торговали и нападали на города. Около 1000 года викинг <b>Лейф Эрикссон</b> доплыл до Северной Америки — за 500 лет до Колумба.<br>По рекам Руси шёл торговый путь <b>«из варяг в греки»</b> — от Балтийского моря до Византии.',
   g: B(['Откуда были викинги?|из Скандинавии|из Африки;из Греции;из Индии','Как назывались их корабли?|драккары|каравеллы;триремы;фрегаты','Кто из викингов доплыл до Америки?|Лейф Эрикссон|Колумб;Магеллан;Васко да Гама','Как назывался путь из Балтики в Византию?|из варяг в греки|шёлковый путь;путь в Индию;янтарная тропа']) },
 { id:'h5_17', t:'Древняя Русь',
   th:'Восточные славяне жили по Днепру и Волхову. Главными городами стали <b>Новгород</b> и <b>Киев</b>. В <b>988 г.</b> князь <b>Владимир</b> крестил Русь. Его сын <b>Ярослав Мудрый</b> строил школы и собор Святой Софии в Киеве, при нём появился свод законов — <b>«Русская Правда»</b>.<br>Братья <b>Кирилл и Мефодий</b> создали славянскую азбуку.',
   g: B(['Кто крестил Русь?|князь Владимир|Ярослав Мудрый;Рюрик;Олег','Когда крестили Русь?|в 988 году|в 1240 году;в 800 году;в 1380 году','Как назывался свод законов Ярослава Мудрого?|Русская Правда|Кодекс Юстиниана;Повесть временных лет;Судебник','Кто создал славянскую азбуку?|Кирилл и Мефодий|Владимир и Ярослав;Борис и Глеб;Минин и Пожарский','Какие два города были главными на Руси?|Киев и Новгород|Москва и Казань;Рим и Афины;Киев и Константинополь']) },
 { id:'h5_18', t:'Рыцари и замки',
   th:'<b>Рыцарь</b> — воин на коне в доспехах. Мальчик сначала был пажом, потом оруженосцем, а в 21 год его <b>посвящали в рыцари</b>. Рыцарь должен был быть храбрым, верным и защищать слабых.<br><b>Замок</b> строили на холме, вокруг — ров с водой и подъёмный мост; главная башня — <b>донжон</b>. В Португалии сохранились замки в Гимарайнше, Синтре, Обидуше.',
   g: B(['Кем был будущий рыцарь до посвящения?|оруженосцем|монахом;купцом;королём','Как называлась главная башня замка?|донжон|минарет;пирамида;акведук','Что окружало замок?|ров с водой|забор из сетки;пустыня;лес из пальм','Где в Португалии есть средневековый замок?|в Гимарайнше|в Фару на пляже;на Азорах в вулкане;в Лиссабонском аэропорту']) },
 { id:'h5_19', t:'Средневековый город. Университеты',
   th:'Города росли вокруг рынков и замков. Ремесленники одной профессии объединялись в <b>цехи</b>: ученик → подмастерье → мастер. Город окружали стены, на главной площади стояли собор и ратуша.<br>Появились первые <b>университеты</b>: Болонья, Париж, Оксфорд. В Португалии университет основали в 1290 г.; позже он переехал в <b>Коимбру</b>.',
   g: B(['Как назывались союзы ремесленников?|цехи|клубы;партии;гильдии футбола','Кем становился ученик после обучения в мастерской?|подмастерьем|рыцарем;монахом;королём','В каком городе Португалии старинный университет?|в Коимбре|в Фару;в Синтре;в Обидуше','Что строили на главной площади?|собор и ратушу|стадион;вокзал;аэропорт']) },
 { id:'h5_20', t:'Крестовые походы',
   th:'В 1096 г. начался <b>первый крестовый поход</b>: рыцари Западной Европы пошли освобождать Иерусалим. Походов было много, они длились почти 200 лет.<br>Из походов европейцы привезли новые знания, пряности, сахар, зеркала. Часть крестоносцев в 1147 г. помогла португальцам взять <b>Лиссабон</b>.',
   g: B(['Когда начался первый крестовый поход?|в 1096 году|в 988 году;в 1492 году;в 1380 году','Какой город хотели освободить крестоносцы?|Иерусалим|Рим;Лиссабон;Париж','Сколько примерно длились крестовые походы?|около 200 лет|10 лет;1 год;500 лет','Какой португальский город крестоносцы помогли взять в 1147 году?|Лиссабон|Порту;Фару;Брагу']) },
 { id:'h5_21', t:'Рождение Португалии',
   th:'Христианские королевства отвоёвывали полуостров у арабов — это называлось <b>Реконкиста</b>. <b>Афонсу Энрикеш</b>, родившийся, по преданию, в Гимарайнше, в 1128 г. победил при Сан-Мамеде, в 1139 г. назвался королём, а в <b>1143 г.</b> Кастилия признала королевство <b>Португалия</b>.<br>В 1249 г. взяли Алгарве — так сложились границы страны, почти не менявшиеся до сих пор.',
   g: B(['Кто был первым королём Португалии?|Афонсу Энрикеш|Васко да Гама;Карл Великий;Вириат','Какой город называют «колыбелью Португалии»?|Гимарайнш|Лиссабон;Фару;Эвора','Как называлось отвоевание земель у арабов?|Реконкиста|Возрождение;крестовый поход;Великое переселение','В каком году признали королевство Португалия?|1143|1492;800;1500','Какую область отвоевали последней, в 1249 году?|Алгарве|Минью;Алентежу;Бейру']) },
 { id:'h5_22', t:'Русь и Орда. Александр Невский. Куликовская битва',
   th:'В XIII веке на Русь пришли монголы хана <b>Батыя</b>; русские земли попали в зависимость от <b>Золотой Орды</b>. Князь <b>Александр Невский</b> разбил шведов на Неве (1240) и рыцарей на Чудском озере — <b>Ледовое побоище</b> (1242).<br>В <b>1380 г.</b> московский князь <b>Дмитрий Донской</b> победил ордынцев на <b>Куликовом поле</b>.',
   g: B(['Кто победил в Ледовом побоище?|Александр Невский|Дмитрий Донской;Ярослав Мудрый;Батый','Где произошло Ледовое побоище?|на Чудском озере|на Неве;на Куликовом поле;на Днепре','Когда была Куликовская битва?|в 1380 году|в 1240 году;в 1242 году;в 988 году','Кто командовал русскими на Куликовом поле?|Дмитрий Донской|Александр Невский;Владимир;Батый']) },
 { id:'h5_23', t:'Великие географические открытия',
   th:'Португальский принц <b>Генрих Мореплаватель</b> собирал моряков и картографов. На лёгких <b>каравеллах</b> португальцы шли вдоль Африки: <b>Бартоломеу Диаш</b> обогнул мыс Доброй Надежды (1488), <b>Васко да Гама</b> доплыл до Индии (1498), <b>Кабрал</b> открыл Бразилию (1500).<br><b>Колумб</b> в 1492 г. доплыл до Америки. Экспедиция <b>Магеллана</b> (1519–1522) впервые обошла Землю.',
   g: B(['Кто первым доплыл из Европы до Индии вокруг Африки?|Васко да Гама|Колумб;Магеллан;Кабрал','В каком году Колумб доплыл до Америки?|1492|1498;1500;1143','Кто открыл Бразилию?|Кабрал|Диаш;Колумб;Магеллан','Чья экспедиция впервые обошла Землю?|Магеллана|Колумба;Васко да Гамы;Генриха','Как назывались корабли португальцев?|каравеллы|драккары;триремы;пароходы','Кто обогнул мыс Доброй Надежды?|Бартоломеу Диаш|Васко да Гама;Кабрал;Колумб']) },
 { id:'h5_24', t:'Книгопечатание и Возрождение',
   th:'Около 1450 г. <b>Иоганн Гутенберг</b> изобрёл печатный станок — книги стали дешевле. Это время называют <b>Возрождением</b>: учёные и художники снова изучали древних греков и римлян.<br><b>Леонардо да Винчи</b> написал «Мону Лизу» и придумывал машины. <b>Микеланджело</b> расписал потолок Сикстинской капеллы. На Руси первую точно датированную книгу напечатал <b>Иван Фёдоров</b> (1564).',
   g: B(['Кто изобрёл книгопечатание в Европе?|Гутенберг|Леонардо;Колумб;Фёдоров','Кто написал «Мону Лизу»?|Леонардо да Винчи|Микеланджело;Рафаэль;Гутенберг','Кто напечатал первую датированную книгу на Руси?|Иван Фёдоров|Ярослав Мудрый;Кирилл;Дмитрий Донской','Что «возрождали» в эпоху Возрождения?|знания древних греков и римлян|рыцарские турниры;пирамиды;викингов']) }
);

A_GEO.push(
 { id:'g5_8', t:'Материки и океаны',
   th:'На Земле 6 материков: <b>Евразия</b> (самый большой), <b>Африка</b>, <b>Северная Америка</b>, <b>Южная Америка</b>, <b>Антарктида</b>, <b>Австралия</b> (самый маленький).<br>Океаны: <b>Тихий</b>, <b>Атлантический</b>, <b>Индийский</b>, <b>Северный Ледовитый</b>, иногда выделяют <b>Южный</b>.',
   g: B(['Самый большой материк?|Евразия|Африка;Австралия;Антарктида','Самый маленький материк?|Австралия|Антарктида;Африка;Южная Америка','Сколько материков на Земле?|6|5;7;4','Самый большой океан?|Тихий|Атлантический;Индийский;Северный Ледовитый','Какой океан омывает Португалию?|Атлантический|Тихий;Индийский;Северный Ледовитый','На каком материке нет постоянных жителей?|Антарктида|Австралия;Африка;Евразия']) },
 { id:'g5_9', t:'Евразия',
   th:'<b>Евразия</b> — две части света: Европа и Азия; граница идёт по Уральским горам. Здесь самая высокая гора мира — <b>Эверест</b> (8 848 м) в Гималаях, самое глубокое озеро — <b>Байкал</b>, самое большое озеро — <b>Каспийское море</b>.<br>Португалия — на самом западе Евразии; мыс Рока — её крайняя западная точка.',
   g: B(['По каким горам проходит граница Европы и Азии?|Уральским|Альпам;Пиренеям;Гималаям','Самая высокая гора мира?|Эверест|Эльбрус;Монблан;Килиманджаро','Где находится Эверест?|в Гималаях|в Альпах;в Андах;на Урале','Самое глубокое озеро мира?|Байкал|Каспийское море;Ладожское;Виктория','Крайняя западная точка Евразии?|мыс Рока|мыс Доброй Надежды;мыс Горн;Гибралтар']) },
 { id:'g5_10', t:'Африка',
   th:'<b>Африка</b> — самый жаркий материк, её пересекает экватор. На севере — самая большая жаркая пустыня <b>Сахара</b>. Самая длинная река — <b>Нил</b>. Самая высокая гора — вулкан <b>Килиманджаро</b>.<br>В саваннах живут слоны, жирафы, львы, зебры. Португальский язык — официальный в Анголе, Мозамбике, Кабо-Верде.',

 { id:'g5_11', t:'Северная и Южная Америка',

 { id:'g5_13', t:'Природа Португалии',

 { id:'g5_14', t:'Природа России',
   th:'Россия — самая большая страна мира, в ней 11 часовых поясов. С севера на юг сменяются зоны: <b>арктическая пустыня, тундра, тайга, смешанные леса, степь</b>.<br>Великие реки: <b>Волга</b>, Обь, Енисей, Лена, Амур. Самая высокая гора — <b>Эльбрус</b> (5 642 м) на Кавказе. На Камчатке — вулканы и гейзеры.',
   g: B(['Самая высокая гора России?|Эльбрус|Эверест;Белуха;Ключевская сопка','Какая природная зона самая большая в России?|тайга|степь;пустыня;саванна','Где в России есть вулканы и гейзеры?|на Камчатке|в Москве;на Урале;в Крыму','Сколько часовых поясов в России?|11|3;24;7','Какая зона идёт сразу к югу от тундры?|тайга (лесотундра)|степь;пустыня;саванна']) },
 { id:'g5_15', t:'Ориентирование. Компас',
   th:'Стороны горизонта: <b>север, юг, запад, восток</b>. Стрелка <b>компаса</b> показывает на север (синий или тёмный конец).<br>В полдень Солнце в северном полушарии стоит на <b>юге</b>, тень показывает на <b>север</b>. Мох на деревьях чаще растёт с северной стороны, но это не точный способ.',

 { id:'g5_16', t:'Солнечная система',

 { id:'g5_18', t:'Реки и озёра',
   th:'Начало реки — <b>исток</b>, место впадения — <b>устье</b>. Река с притоками — <b>речная система</b>. Где река падает с уступа — <b>водопад</b>.<br>Самая длинная река — <b>Нил</b> (около 6 700 км), самая полноводная — <b>Амазонка</b>. Самый высокий водопад — <b>Анхель</b> (979 м) в Венесуэле.',
   g: B(['Как называется начало реки?|исток|устье;приток;дельта','Как называется место, где река впадает в море?|устье|исток;русло;порог','Самый высокий водопад мира?|Анхель|Ниагарский;Виктория;Игуасу','Какая река течёт через Лиссабон?|Тежу|Дору;Гвадиана;Сена','Как называется река, впадающая в другую реку?|приток|исток;устье;озеро']) },

   g: B(['Из чего образовался гранит?|из застывшей магмы|из песка;из ракушек;из льда','К какой группе относится известняк?|осадочные|магматические;метаморфические;металлы','Какой камень добывают у Эштремоша?|мрамор|алмазы;уголь;нефть','Из чего делают плитку азулежу?|из глины|из мрамора;из стекла;из гранита','Базальт — это…|застывшая лава|песок;соль;торф']) },
 { id:'g5_20', t:'Человек и природа',

);

 { id:'l5_11', t:'Шифр Цезаря',
   th:'Юлий Цезарь заменял каждую букву на букву, стоящую на 3 дальше по алфавиту: А → Г, Б → Д… Чтобы расшифровать, сдвигай назад.',

 { id:'l5_16', t:'Логические таблицы',

   g: B(['Аня, Лиза и Вера играют на скрипке, флейте и пианино. Аня не на скрипке и не на пианино. Лиза не на скрипке. Кто играет на пианино?|Лиза|Аня;Вера;никто','Маша, Катя и Оля живут на 1, 2 и 3 этажах. Маша живёт выше Кати, Оля — ниже Кати. Кто на 3 этаже?|Маша|Катя;Оля;никто','Три кота: рыжий, чёрный и белый — Барсик, Мурзик и Снежок. Снежок не белый, Барсик не рыжий и не белый. Какого цвета Мурзик?|белый|рыжий;чёрный;серый','У Пети, Коли и Димы кошка, собака и попугай. У Пети нет кошки и собаки. У Коли нет собаки. У кого собака?|у Димы|у Пети;у Коли;ни у кого']) },
 { id:'l5_17', t:'Календарь и дни недели',
   th:'Через 7 дней снова тот же день недели. Чтобы узнать день через n дней, найди остаток от деления n на 7 и отсчитай столько дней вперёд.<br>Сегодня понедельник. Через 10 дней: 10 = 7 + 3 → четверг.',
   g: r => { const D=['понедельник','вторник','среда','четверг','пятница','суббота','воскресенье']; const s=r.int(0,6), n=r.int(8,60); const a=D[(s+n)%7]; return C(`Сегодня ${D[s]}. Какой день недели будет через ${n} дней?`, a, D.filter(x=>x!==a), `${n} = 7 · ${Math.floor(n/7)} + ${n%7}`); } },
 { id:'l5_18', t:'Задачи на части',
   th:'Если у Ани в 3 раза больше марок, чем у брата, а вместе 48, то это 1 + 3 = 4 равные части. Одна часть 48 : 4 = 12 (у брата), у Ани 36.',
   g: MIX(r => { const p=r.int(6,20), k=r.int(2,5); return N(`У Ани в ${k} раза больше наклеек, чем у Ярика. Вместе у них ${p*(k+1)}. Сколько наклеек у Ярика?`, p, `${p*(k+1)} : ${k+1}`); },

 { id:'l5_19', t:'Считаем фигуры',
   th:'Считай по порядку: сначала маленькие фигуры, потом составленные из двух, из трёх и так далее.<br>В квадрате 2×2 клетки: 4 маленьких квадрата + 1 большой = <b>5</b> квадратов.',
   g: B(['Сколько всего квадратов в квадрате 2×2 клетки?|5|4;6;8','Сколько всего квадратов в квадрате 3×3 клетки?|14|9;10;13','Сколько треугольников получится, если в треугольнике провести одну линию из вершины к противоположной стороне?|3|2;4;5','Сколько прямоугольников в полоске из 3 клеток?|6|3;4;5','Сколько отрезков на прямой с 4 отмеченными точками?|6|4;3;8']) },
 { id:'l5_20', t:'Двоичная система',
   th:'Компьютеры считают двумя цифрами: <b>0 и 1</b>. Разряды двоичного числа: 1, 2, 4, 8, 16…<br>1011₂ = 8 + 0 + 2 + 1 = <b>11</b>.',
   g: MIX(r => { const n=r.int(2,31); return N(`Переведи из двоичной системы в обычную: ${n.toString(2)}₂`, n, n.toString(2).split('').map((d,i,a)=>d==='1'?2**(a.length-1-i):null).filter(x=>x).join(' + ')); },

 { id:'l5_21', t:'Чётность',
   th:'Чётное + чётное = чётное, нечётное + нечётное = чётное, чётное + нечётное = нечётное. Произведение чётное, если хоть один множитель чётный.<br>Сумма пяти нечётных чисел — нечётная.',
   g: B(['Какой будет сумма 7 нечётных чисел?|нечётная|чётная;любая;ноль','Какой будет сумма двух нечётных чисел?|чётная|нечётная;любая;нельзя сказать','Каким будет произведение 3 · 5 · 7 · 8?|чётным|нечётным;нулём;нельзя сказать','Можно ли разменять 25 евро монетами по 2 евро?|нет|да;только 12 монетами;только в банке','Кузнечик прыгает по 2 клетки. Может ли он попасть с клетки 1 на клетку 10?|нет|да;только назад;если прыгнет 5 раз']) },
 { id:'l5_22', t:'Олимпиадные задачи',
   th:'Не спеши: перечитай условие, нарисуй схему, проверь ответ на маленьких числах.',
   g: B(['Бревно распилили на 5 частей. Сколько сделали распилов?|4|5;6;10','На лестнице 10 ступенек. На какую ступеньку встанешь, если поднимешься на 5, а потом спустишься на 2?|3|7;8;2','Сколько концов у четырёх с половиной палок?|10|8;9;12','В комнате 4 угла. В каждом углу сидит кошка, напротив каждой кошки — 3 кошки. Сколько всего кошек?|4|12;16;7','Улитка ползёт по столбу 10 м: днём поднимается на 3 м, ночью сползает на 2 м. На какой день она доберётся до верха?|на 8-й|на 10-й;на 5-й;на 7-й']) }

PT_A.push(
 { id:'p5_12', t:'Pretérito imperfeito — «бывало, раньше»',
   th:'Imperfeito — длительное или привычное действие в прошлом: <b>Quando eu era pequena, brincava no parque</b> (когда я была маленькой, я играла в парке).<br>-ar: brinc<b>ava</b>, brinc<b>avas</b>, brinc<b>ava</b>, brinc<b>ávamos</b>, brinc<b>avam</b>. -er/-ir: com<b>ia</b>, com<b>ias</b>, com<b>ia</b>, com<b>íamos</b>, com<b>iam</b>.<br>Неправильные: ser — <b>era</b>, ter — <b>tinha</b>, ir — <b>ia</b>.',

 { id:'p5_13', t:'Futuro: ir + infinitivo',
   th:'Самый простой способ сказать о будущем: <b>ir</b> в настоящем времени + инфинитив.<br><b>Vou estudar</b> — я буду учиться. <b>Vamos jogar</b> — мы будем играть. <b>Amanhã ela vai ler</b> — завтра она будет читать.',
   g: r => { const f=PT_IRR.ir; const i=r.int(0,4); const [v,ru]=r.pick(PT_VERBS.ar.concat(PT_VERBS.er)); return Object.assign(C(`Amanhã ${PT_PRON[i]} ___ ${v}. (${ru})`, f[i], f.filter((_,j)=>j!==i).concat(['ir']), `ir: ${f.join(', ')}`), {sp:PT_PRON[i].split(' ')[0]+' '+f[i]+' '+v, spAfter:true}); } },
 { id:'p5_14', t:'Прилагательные: род и число',
   th:'Прилагательное согласуется с существительным: <b>o gato preto, a gata preta, os gatos pretos, as gatas pretas</b>.<br>На -e и согласную в м. и ж. роде одинаково: <b>o livro grande, a casa grande</b>; plural: <b>grandes, azuis, felizes</b>.',
   g: B(['a casa ___ (bonito)|bonita|bonito;bonitos;bonitas','os livros ___ (novo)|novos|novo;nova;novas','as flores ___ (amarelo)|amarelas|amarela;amarelos;amarelo','o carro ___ (vermelho)|vermelho|vermelha;vermelhos;vermelhas','a menina ___ (feliz)|feliz|feliza;felizes;felizo','os olhos ___ (azul)|azuis|azuls;azules;azul','as mesas ___ (grande)|grandes|grande;grandas;grandos']) },
 { id:'p5_15', t:'Possessivos: meu, minha…',
   th:'Притяжательное согласуется с <b>предметом</b>, а не с хозяином: <b>o meu livro, a minha casa, os meus livros, as minhas casas</b>.<br>teu/tua (твой), seu/sua (его, её, ваш), nosso/nossa (наш). В Португалии перед ними обычно ставят артикль.',

 { id:'p5_16', t:'Demonstrativos: este, esse, aquele',
   th:'<b>este/esta</b> — этот (рядом со мной), <b>esse/essa</b> — этот (рядом с тобой), <b>aquele/aquela</b> — тот (далеко от нас обоих).<br>Neutral: isto, isso, aquilo — «это» о предмете без названия: <b>O que é isto?</b>',

 { id:'p5_17', t:'Estar a + infinitivo — «сейчас делаю»',
   th:'В Португалии о действии прямо сейчас говорят: <b>estar a + infinitivo</b>.<br><b>Estou a ler</b> — я (сейчас) читаю. <b>O Yarik está a jogar à bola</b> — Ярик играет в мяч. (В Бразилии говорят иначе: estou lendo.)',
   g: r => { const f=PT_IRR.estar; const i=r.int(0,4); const [v,ru]=r.pick(PT_VERBS.ar.concat(PT_VERBS.er, PT_VERBS.ir)); return Object.assign(C(`Agora ${PT_PRON[i]} ___ ${v}. (сейчас ${ru})`, `${f[i]} a`, [`${PT_IRR.ser[i]} a`, `${f[i]} de`, `${PT_IRR.ir[i]} a`], `estar a + infinitivo: ${f[i]} a ${v}`), {sp:PT_PRON[i].split(' ')[0]+' '+f[i]+' a '+v, spAfter:true}); } },
 { id:'p5_18', t:'Comparativos: mais… do que',
   th:'<b>mais … do que</b> — больше/более, чем: O Tejo é <b>mais</b> comprido <b>do que</b> o Douro.<br><b>menos … do que</b> — менее. <b>tão … como</b> — такой же, как.<br>Особые формы: bom → <b>melhor</b>, mau → <b>pior</b>, grande → <b>maior</b>, pequeno → <b>menor</b>.',
   g: B(['O Tejo é ___ comprido do que o Douro.|mais|menos;tão;muito','Este bolo é ___ do que aquele. (лучше)|melhor|mais bom;pior;bem','A Rússia é ___ do que Portugal. (больше)|maior|mais grande;menor;melhor','A Ana é tão alta ___ a irmã.|como|do que;que;de','Hoje o tempo está ___ do que ontem. (хуже)|pior|mais mau;melhor;menos']) },
 { id:'p5_19', t:'Gostar de',
   th:'После <b>gostar</b> всегда <b>de</b>: <b>Gosto de</b> chocolate. С артиклем: de + o = <b>do</b>, de + a = <b>da</b>: Gosto <b>do</b> verão. Gostas <b>da</b> escola?<br>Глагол после gostar de — в инфинитиве: <b>Gosto de ler.</b>',

 { id:'p5_20', t:'O tempo e as estações — погода',

 { id:'p5_21', t:'Na cidade — в городе',

 { id:'p5_22', t:'Imperativo — просьбы и команды',

 { id:'y1', title:'Котёнок и дождь', author:'',
   text:'Кот Барсик не любил дождь. Когда на улице капало, он садился на подоконник и смотрел на капли. Капли бежали по стеклу, и Барсик пытался поймать их лапой. Но стекло мешало.\nОднажды дождь кончился, и на небе появилась радуга. Барсик вышел во двор, понюхал мокрую траву и чихнул. «Нет, — подумал кот, — лучше я пойду спать на диван». И ушёл в дом.',

 { id:'y2', title:'Утренние лучи', author:'К. Д. Ушинский',
   text:'Выплыло на небо красное солнышко и стало рассылать повсюду свои золотые лучи — будить землю.\nПервый луч полетел и попал на жаворонка. Встрепенулся жаворонок, выпорхнул из гнёздышка, поднялся высоко-высоко и запел свою серебряную песенку: «Ах, как хорошо в свежем утреннем воздухе! Как хорошо! Как привольно!»\nВторой луч попал на зайчика. Передёрнул ушами зайчик и весело запрыгал по росистому лугу: побежал он добывать себе сочной травки на завтрак.\nТретий луч попал в курятник. Петух захлопал крыльями и запел: «Ку-ка-ре-ку!» Куры слетели с нашестей, закудахтали, стали разгребать сор и червяков искать.\nЧетвёртый луч попал в улей. Выползла пчёлка из восковой кельи, села на окошечко, расправила крылья и «зум-зум-зум!» — полетела собирать медок с душистых цветов.\nПятый луч попал в детскую на постельку к маленькому лентяю: режет ему прямо в глаза, а он повернулся на другой бок и опять заснул.',

 { id:'y3', title:'Ёжик готовится к зиме', author:'',
   text:'Осенью в лесу стало холодно. Ёжик знал: скоро зима. Он ходил по лесу и собирал сухие листья и мох. Всё это он носил в свою норку под корнями старого дуба.\nБелка спросила ёжика: «Зачем тебе столько листьев? Ты же их не ешь!» Ёжик ответил: «Из листьев я сделаю тёплую постель. Я буду спать всю зиму, до самой весны».\nБелка удивилась. Сама она зимой не спит, а прыгает по веткам и ищет орехи, которые спрятала осенью.',

 { id:'y4', title:'Четыре желания', author:'К. Д. Ушинский',
   text:'Митя накатался на саночках с ледяной горы и на коньках по замёрзшей реке, прибежал домой румяный, весёлый и говорит отцу: «Уж как весело зимой! Я бы хотел, чтобы всё зима была!»\n«Запиши твоё желание в мою карманную книжку», — сказал отец. Митя записал.\nПришла весна. Митя вволю набегался за пёстрыми бабочками по зелёному лугу, нарвал цветов, прибежал к отцу и говорит: «Что за прелесть эта весна! Я бы желал, чтобы всё весна была».\nОтец опять вынул книжку и приказал Мите записать своё желание.\nНастало лето. Митя с отцом отправились на сенокос. Весь длинный день веселился мальчик: ловил рыбу, набрал ягод, кувыркался в душистом сене, а вечером сказал отцу: «Вот уж сегодня я повеселился вволю! Я бы желал, чтобы лету конца не было». И это желание Мити было записано в ту же книжку.\nНаступила осень. В саду собирали плоды — румяные яблоки и жёлтые груши. Митя был в восторге и говорил отцу: «Осень лучше всех времён года!» Тогда отец вынул свою записную книжку и показал мальчику, что он то же самое говорил и о весне, и о зиме, и о лете.',

 { id:'y5', title:'Ракушки', author:'',
   text:'В субботу Ярик с Юрой и мамой поехали на пляж. Море было холодным, но солнце светило ярко. Ярик решил собрать ракушки. Сначала он нашёл три белые ракушки, потом две розовые. Самую большую ракушку он нашёл у камней. Она была похожа на ухо.\nЮра сказал, что если приложить её к уху, кажется, будто шумит море. На самом деле ракушка просто отражает звуки вокруг, как маленькая пещера. Ярик приложил ракушку и засмеялся: шумело! Дома он положил все ракушки в банку и поставил её на окно.',
