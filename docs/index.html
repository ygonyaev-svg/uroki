смехом вытаскивал его обратно из её желудка. И чем ярче были воспоминания, тем громче и тоскливее скулила Каштанка.\nНо скоро утомление и теплота взяли верх над грустью… Она стала засыпать. В её воображении забегали собаки; пробежал, между прочим, и мохнатый старый пудель, которого она видела сегодня на улице, с бельмом на глазу и с клочьями шерсти около носа. Федюшка, с долотом в руке, погнался за пуделем, потом вдруг сам покрылся мохнатой шерстью, весело залаял и очутился около Каштанки. Каштанка и он добродушно понюхали друг другу носы и побежали на улицу…", "ka2": "Глава третья. Новое, очень приятное знакомство\nКогда Каштанка проснулась, было уже светло и с улицы доносился шум, какой бывает только днём. В комнате не было ни души. Каштанка потянулась, зевнула и, сердитая, угрюмая, прошлась по комнате. Она обнюхала углы и мебель, заглянула в переднюю и не нашла ничего интересного. Кроме двери, которая вела в переднюю, была ещё одна дверь. Подумав, Каштанка поцарапала её обеими лапами, отворила и вошла в следующую комнату. Тут на кровати, укрывшись байковым одеялом, спал заказчик, в котором она узнала вчерашнего незнакомца.\n— Рррр… — заворчала она, но, вспомнив про вчерашний обед, завиляла хвостом и стала нюхать.\nОна понюхала одежду и сапоги незнакомца и нашла, что они очень пахнут лошадью. Из спальни вела куда-то ещё одна дверь, тоже затворённая. Каштанка поцарапала эту дверь, налегла на неё грудью, отворила и тотчас же почувствовала странный, очень подозрительный запах. Предчувствуя неприятную встречу, ворча и оглядываясь, Каштанка вошла в маленькую комнатку с грязными обоями и в страхе попятилась назад. Она увидела нечто неожиданное и страшное. Пригнув к земле шею и голову, растопырив крылья и шипя, прямо на неё шёл серый гусь. Несколько в стороне от него, на матрасике, лежал белый кот; увидев Каштанку, он вскочил, выгнул спину в дугу, задрал хвост, взъерошил шерсть и тоже зашипел. Собака испугалась не на шутку, но, не желая выдавать своего страха, громко залаяла и бросилась к коту… Кот ещё сильнее выгнул спину, зашипел и ударил Каштанку лапой по голове. Каштанка отскочила, присела на все четыре лапы и, протягивая к коту морду, залилась громким, визгливым лаем; в это время гусь подошёл сзади и больно долбанул её клювом в спину. Каштанка вскочила и бросилась на гуся…\n— Это что такое? — послышался громкий, сердитый голос, и в комнату вошёл незнакомец в халате и с сигарой в зубах. — Что это значит? На место!\nОн подошёл к коту, щёлкнул его по выгнутой спине и сказал:\n— Фёдор Тимофеич, это что значит? Драку подняли? Ах ты, старая каналья! Ложись!\nИ, обратившись к гусю, он крикнул:\n— Иван Иваныч, на место!\nКот покорно лёг на свой матрасик и закрыл глаза. Судя по выражению его морды и усов, он сам был недоволен, что погорячился и вступил в драку. Каштанка обиженно заскулила, а гусь вытянул шею и заговорил о чём-то быстро, горячо и отчётливо, но крайне непонятно.\n— Ладно, ладно! — сказал хозяин, зевая. — Надо жить мирно и дружно. — Он погладил Каштанку и продолжал: — А ты, рыжик, не бойся… Это хорошая публика, не обидит. Постой, как же мы тебя звать будем? Без имени нельзя, брат.\nНезнакомец подумал и сказал:\n— Вот что… Ты будешь — Тётка… Понимаешь? Тётка!\nИ, повторив несколько раз слово «Тётка», он вышел. Каштанка села и стала наблюдать. Кот неподвижно сидел на матрасике и делал вид, что спит. Гусь, вытягивая шею и топчась на одном месте, продолжал говорить о чём-то быстро и горячо. По-видимому, это был очень умный гусь; после каждой длинной тирады он всякий раз удивлённо пятился назад и делал вид, что восхищается своею речью… Послушав его и ответив ему «рррр…», Каштанка принялась обнюхивать углы. В одном из углов стояло маленькое корытце, в котором она увидела мочёный горох и размокшие ржаные корки. Она попробовала горох — невкусно, попробовала корки — и стала есть. Гусь нисколько не обиделся, что незнакомая собака поедает его корм, а, напротив, заговорил ещё горячее и, чтобы показать своё доверие, сам подошёл к корытцу и съел несколько горошинок.\nГлава четвёртая. Чудеса в решете\nНемного погодя опять вошёл незнакомец и принёс с собой какую-то странную вещь, похожую на ворота и на букву П. На перекладине этого деревянного, грубо сколоченного П висел колокол и был привязан пистолет; от языка колокола и от курка пистолета тянулись верёвочки. Незнакомец поставил П посреди комнаты, долго что-то развязывал и завязывал, потом посмотрел на гуся и сказал:\n— Иван Иваныч, пожалуйте!\nГусь подошёл к нему и остановился в ожидательной позе.\n— Ну-с, — сказал незнакомец, — начнём с самого начала. Прежде всего поклонись и сделай реверанс! Живо!\nИван Иваныч вытянул шею, закивал во все стороны и шаркнул лапкой.\n— Так, молодец… Теперь умри!\nГусь лёг на спину и задрал вверх лапы. Проделав ещё несколько подобных неважных фокусов, незнакомец вдруг схватил себя за голову, изобразил на своём лице ужас и закричал:\n— Караул! Пожар! Горим!\nИван Иваныч подбежал к П, взял в клюв верёвку и зазвонил в колокол.\nНезнакомец остался очень доволен. Он погладил гуся по шее и сказал:\n— Молодец, Иван Иваныч! Теперь представь, что ты ювелир и торгуешь золотом и брильянтами. Представь теперь, что ты приходишь к себе в магазин и застаёшь в нём воров. Как бы ты поступил в данном случае?\nГусь взял в клюв другую верёвочку и потянул, отчего тотчас же раздался оглушительный выстрел. Каштанке очень понравился звон, а от выстрела она пришла в такой восторг, что забегала вокруг П и залаяла.\n— Тётка, на место! — крикнул ей незнакомец. — Молчать!\nРабота Ивана Иваныча не кончилась стрельбой. Целый час потом незнакомец гонял его вокруг себя на корде и хлопал бичом, причём гусь должен был прыгать через барьер и сквозь обруч, становиться на дыбы, то есть садиться на хвост и махать лапками. Каштанка не отрывала глаз от Ивана Иваныча, завывала от восторга и несколько раз принималась бегать за ним со звонким лаем. Утомив гуся и себя, незнакомец вытер со лба пот и крикнул:\n— Марья, позови-ка сюда Хавронью Ивановну!\nЧерез минуту послышалось хрюканье… Каштанка заворчала, приняла очень храбрый вид и на всякий случай подошла поближе к незнакомцу. Отворилась дверь, в комнату поглядела какая-то старуха и, сказав что-то, впустила чёрную, очень некрасивую свинью. Не обращая никакого внимания на ворчанье Каштанки, свинья подняла вверх свой пятачок и весело захрюкала. По-видимому, ей было очень приятно видеть своего хозяина, кота и Ивана Иваныча. Когда она подошла к коту и слегка толкнула его под живот своим пятачком и потом о чём-то заговорила с гусем, в её движениях, в голосе и в дрожании хвостика чувствовалось много добродушия. Каштанка сразу поняла, что ворчать и лаять на таких субъектов — бесполезно.\nХозяин убрал П и крикнул:\n— Фёдор Тимофеич, пожалуйте!\nКот поднялся, лениво потянулся и нехотя, точно делая одолжение, подошёл к свинье.\n— Ну-с, начнём с египетской пирамиды, — начал хозяин.\nОн долго объяснял что-то, потом скомандовал: «Раз… два… три!» Иван Иваныч при слове «три» взмахнул крыльями и вскочил на спину свиньи… Когда он, балансируя крыльями и шеей, укрепился на щетинистой спине, Фёдор Тимофеич вяло и лениво, с явным пренебрежением и с таким видом, как будто он презирает и ставит ни в грош своё искусство, полез на спину свиньи, потом нехотя взобрался на гуся и стал на задние лапы. Получилось то, что незнакомец называл египетской пирамидой. Каштанка взвизгнула от восторга, но в это время старик кот зевнул и, потеряв равновесие, свалился с гуся. Иван Иваныч пошатнулся и тоже свалился. Незнакомец закричал, замахал руками и стал опять что-то объяснять. Провозившись целый час с пирамидой, неутомимый хозяин принялся учить Ивана Иваныча ездить верхом на коте, потом стал учить кота курить и т. п.\nУченье кончилось тем, что незнакомец вытер со лба пот и вышел. Фёдор Тимофеич брезгливо фыркнул, лёг на матрасик и закрыл глаза, Иван Иваныч направился к корытцу, а свинья была уведена старухой. Благодаря массе новых впечатлений день прошёл для Каштанки незаметно, а вечером она со своим матрасиком была уже водворена в комнатке с грязными обоями и ночевала в обществе Фёдора Тимофеича и гуся.", "ka3": "Глава пятая. Талант! Талант!\nПрошёл месяц.\nКаштанка уже привыкла к тому, что её каждый вечер кормили вкусным обедом и звали Тёткой. Привыкла она и к незнакомцу, и к своим новым сожителям. Жизнь потекла как по маслу.\nВсе дни начинались одинаково. Обыкновенно раньше всех просыпался Иван Иваныч и тотчас же подходил к Тётке или к коту, выгибал шею и начинал говорить о чём-то горячо и убедительно, но по-прежнему непонятно. Иной раз он поднимал вверх голову и произносил длинные монологи. В первые дни знакомства Каштанка думала, что он говорит много потому, что очень умён, но прошло немного времени, и она потеряла к нему всякое уважение; когда он подходил к ней со своими длинными речами, она уж не виляла хвостом, а третировала его, как надоедливого болтуна, который не даёт никому спать, и без всякой церемонии отвечала ему: «рррр»…\nФёдор же Тимофеич был иного рода господин. Этот, проснувшись, не издавал никакого звука, не шевелился и даже не открывал глаз. Он охотно бы не просыпался, потому что, как видно было, он недолюбливал жизни. Ничто его не интересовало, ко всему он относился вяло и небрежно, всё презирал и даже, поедая свой вкусный обед, брезгливо фыркал.\nПроснувшись, Каштанка начинала ходить по комнатам и обнюхивать углы. Только ей и коту позволялось ходить по всей квартире; гусь же не имел права переступать порог комнатки с грязными обоями, а Хавронья Ивановна жила где-то на дворе в сарайчике и появлялась только во время ученья. Хозяин просыпался поздно и, напившись чаю, тотчас же принимался за свои фокусы. Каждый день в комнатку вносились П, бич, обручи, и каждый день проделывалось почти одно и то же. Ученье продолжалось часа три-четыре, так что иной раз Фёдор Тимофеич от утомления пошатывался, как пьяный, Иван Иваныч раскрывал клюв и тяжело дышал, а хозяин становился красным и никак не мог стереть со лба пот.\nУченье и обед делали дни очень интересными, вечера же проходили скучновато. Обыкновенно вечерами хозяин уезжал куда-то и увозил с собою гуся и кота. Оставшись одна, Тётка ложилась на матрасик и начинала грустить… Грусть подкрадывалась к ней как-то незаметно и овладевала ею постепенно, как потёмки комнатой. Начиналось с того, что у собаки пропадала всякая охота лаять, есть, бегать по комнатам и даже глядеть, затем в воображении её появлялись какие-то две неясные фигуры, не то собаки, не то люди, с физиономиями симпатичными, милыми, но непонятными; при появлении их Тётка виляла хвостом, и ей казалось, что она их где-то когда-то видела и любила… А засыпая, она всякий раз чувствовала, что от этих фигурок пахнет клеем, стружками и лаком.\nКогда она совсем уже свыклась с новой жизнью и из тощей, костлявой дворняжки обратилась в сытого, выхоленного пса, однажды перед ученьем хозяин погладил её и сказал:\n— Пора нам, Тётка, делом заняться. Довольно тебе бить баклуши. Я хочу из тебя артистку сделать… Ты хочешь быть артисткой?\nИ он стал учить её разным наукам. В первый урок она училась стоять и ходить на задних лапах, что ей ужасно нравилось. Во второй урок она должна была прыгать на задних лапах и хватать сахар, который высоко над её головой держал учитель. Затем в следующие уроки она плясала, бегала на корде, выла под музыку, звонила и стреляла, а через месяц уже могла с успехом заменять Фёдора Тимофеича в «египетской пирамиде». Училась она очень охотно и была довольна своими успехами; беганье с высунутым языком на корде, прыганье в обруч и езда верхом на старом Фёдоре Тимофеиче доставляли ей величайшее наслаждение. Всякий удавшийся фокус она сопровождала звонким, восторженным лаем, а учитель удивлялся, приходил тоже в восторг и потирал руки.\n— Талант! Талант! — говорил он. — Несомненный талант! Ты положительно будешь иметь успех!\nИ Тётка так привыкла к слову «талант», что всякий раз, когда хозяин произносил его, вскакивала и оглядывалась, как будто оно было её кличкой.\nГлава шестая. Беспокойная ночь\nТётке приснился собачий сон, будто за нею гонится дворник с метлой, и она проснулась от страха.\nВ комнатке было тихо, темно и очень душно. Кусались блохи. Тётка раньше никогда не боялась потёмок, но теперь почему-то ей стало жутко и захотелось лаять. В соседней комнате громко вздохнул хозяин, потом, немного погодя, в своём сарайчике хрюкнула свинья, и опять всё смолкло. Когда думаешь об еде, то на душе становится легче, и Тётка стала думать о том, как она сегодня украла у Фёдора Тимофеича куриную лапку и спрятала её в гостиной между шкапом и стеной, где очень много паутины и пыли. Не мешало бы теперь пойти и посмотреть: цела эта лапка или нет? Очень может быть, что хозяин нашёл её и скушал. Но раньше утра нельзя выходить из комнатки — такое правило. Тётка закрыла глаза, чтобы поскорее уснуть, так как она знала по опыту, что чем скорее уснёшь, тем скорее наступит утро. Но вдруг недалеко от неё раздался странный крик, который заставил её вздрогнуть и вскочить на все четыре лапы. Это крикнул Иван Иваныч, и крик его был не болтливый и убедительный, как обыкновенно, а какой-то дикий, пронзительный и неестественный, похожий на скрип отворяемых ворот. Ничего не разглядев в потёмках и не поняв, Тётка почувствовала ещё больший страх и проворчала:\n— Ррррр…\nПрошло немного времени, сколько его требуется на то, чтобы обглодать хорошую кость; крик не повторялся. Тётка мало-помалу успокоилась и задремала. Ей приснились две большие чёрные собаки с клочьями прошлогодней шерсти на бёдрах и на боках; они из большой лохани с жадностью ели помои, от которых шёл белый пар и очень вкусный запах; изредка они оглядывались на Тётку, скалили зубы и ворчали: «А тебе мы не дадим!» Но из дому выбежал мужик в шубе и прогнал их кнутом; тогда Тётка подошла к лохани и стала кушать, но, как только мужик ушёл за ворота, обе чёрные собаки с рёвом бросились на неё, и вдруг опять раздался пронзительный крик.\n— К-ге! К-ге-ге! — крикнул Иван Иваныч.\nТётка проснулась, вскочила и, не сходя с матрасика, залилась воющим лаем. Ей уже казалось, что кричит не Иван Иваныч, а кто-то другой, посторонний. И почему-то в сарайчике опять хрюкнула свинья.\nНо вот послышалось шарканье туфель, и в комнатку вошёл хозяин в халате и со свечой. Мелькающий свет запрыгал по грязным обоям и по потолку и прогнал потёмки. Тётка увидела, что в комнатке нет никого постороннего. Иван Иваныч сидел на полу и не спал. Крылья у него были растопырены и клюв раскрыт, и вообще он имел такой вид, как будто очень утомился и хотел пить. Старый Фёдор Тимофеич тоже не спал. Должно быть, и он был разбужен криком.\n— Иван Иваныч, что с тобой? — спросил хозяин у гуся. — Что ты кричишь! Ты болен?\nГусь молчал. Хозяин потрогал его за шею, погладил по спине и сказал:\n— Ты чудак. И сам не спишь, и другим не даёшь.\nКогда хозяин вышел и унёс с собою свет, опять наступили потёмки. Тётке было страшно. Гусь не кричал, но ей опять стало чудиться, что в потёмках стоит кто-то чужой. Страшнее всего было то, что этого чужого нельзя было укусить, так как он был невидим и не имел формы. И почему-то она думала, что в эту ночь должно непременно произойти что-то очень худое. Фёдор Тимофеич тоже был непокоен. Тётка слышала, как он возился на своём матрасике, зевал и встряхивал головой.\nГде-то на улице застучали в ворота, и в сарайчике хрюкнула свинья. Тётка заскулила, протянула передние лапы и положила на них голову. В стуке ворот, в хрюканье не спавшей почему-то свиньи, в потёмках и в тишине почудилось ей что-то такое же тоскливое и страшное, как в крике Ивана Иваныча. Всё было в тревоге и в беспокойстве, но отчего? Кто этот чужой, которого не было видно? Вот около Тётки на мгновение вспыхнули две тусклые зелёные искорки. Это в первый раз за всё время знакомства подошёл к ней Фёдор Тимофеич. Что ему нужно было? Тётка лизнула ему лапу и, не спрашивая, зачем он пришёл, завыла тихо и на разные голоса.\n— К-ге! — крикнул Иван Иваныч. — К-ге-ге!\nОпять отворилась дверь, и вошёл хозяин со свечой. Гусь сидел в прежней позе, с разинутым клювом и растопырив крылья. Глаза у него были закрыты.\n— Иван Иваныч! — позвал хозяин.\nГусь не шевельнулся. Хозяин сел перед ним на полу, минуту глядел на него молча и сказал:\n— Иван Иваныч! Что же это такое? Умираешь ты, что ли? Ах, я теперь вспомнил, вспомнил! — вскрикнул он и схватил себя за голову. — Я знаю, отчего это! Это оттого, что сегодня на тебя наступила лошадь! Боже мой, боже мой!\nТётка не понимала, что говорит хозяин, но по его лицу видела, что и он ждёт чего-то ужасного. Она протянула морду к тёмному окну, в которое, как казалось ей, глядел кто-то чужой, и завыла.\n— Он умирает, Тётка! — сказал хозяин и всплеснул руками. — Да, да, умирает! К вам в комнату пришла смерть. Что нам делать?\nБледный, встревоженный хозяин, вздыхая и покачивая головой, вернулся к себе в спальню. Тётке жутко было оставаться в потёмках, и она пошла за ним. Он сел на кровать и несколько раз повторил:\n— Боже мой, что же делать?\nТётка ходила около его ноги, не понимая, отчего это у неё такая тоска и отчего все так беспокоятся, и стараясь понять, следила за каждым его движением. Фёдор Тимофеич, редко покидавший свой матрасик, тоже вошёл в спальню хозяина и стал тереться около его ног. Он встряхивал головой, как будто хотел вытряхнуть из неё тяжёлые мысли, и подозрительно заглядывал под кровать.\nХозяин взял блюдечко, налил в него из рукомойника воды и опять пошёл к гусю.\n— Пей, Иван Иваныч! — сказал он нежно, ставя перед ним блюдечко. — Пей, голубчик.\nНо Иван Иваныч не шевелился и не открывал глаз. Хозяин пригнул его голову к блюдечку и окунул клюв в воду, но гусь не пил, ещё шире растопырил крылья, и голова его так и осталась лежать в блюдечке.\n— Нет, ничего уже нельзя сделать! — вздохнул хозяин. — Всё кончено. Пропал Иван Иваныч!\nИ по его щёкам поползли вниз блестящие капельки, какие бывают на окнах во время дождя. Не понимая, в чём дело, Тётка и Фёдор Тимофеич жались к нему и с ужасом смотрели на гуся.\n— Бедный Иван Иваныч! — говорил хозяин, печально вздыхая. — А я-то мечтал, что весной повезу тебя на дачу и буду гулять с тобой по зелёной травке. Милое животное, хороший мой товарищ, тебя уже нет! Как же я теперь буду обходиться без тебя?\nТётке казалось, что и с нею случится то же самое, то есть что и она тоже вот так, неизвестно отчего, закроет глаза, протянет лапы, оскалит рот, и все на неё будут смотреть с ужасом. По-видимому, такие же мысли бродили и в голове Фёдора Тимофеича. Никогда раньше старый кот не был так угрюм и мрачен, как теперь.\nНачинался рассвет, и в комнатке уже не было того невидимого чужого, который пугал так Тётку. Когда совсем рассвело, пришёл дворник, взял гуся за лапы и унёс его куда-то. А немного погодя явилась старуха и вынесла корытце.\nТётка пошла в гостиную и посмотрела за шкап: хозяин не скушал куриной лапки, она лежала на своём месте, в пыли и паутине. Но Тётке было скучно, грустно и хотелось плакать. Она даже не понюхала лапки, а пошла под диван, села там и начала скулить тихо, тонким голоском:\n— Ску-ску-ску…", "ka4": "Глава седьмая. Неудачный дебют\nВ один прекрасный вечер хозяин вошёл в комнатку с грязными обоями и, потирая руки, сказал:\n— Ну-с…\nЧто-то он хотел ещё сказать, но не сказал и вышел. Тётка, отлично изучившая во время уроков его лицо и интонацию, догадалась, что он был взволнован, озабочен и, кажется, сердит. Немного погодя он вернулся и сказал:\n— Сегодня я возьму с собой Тётку и Фёдора Тимофеича. В египетской пирамиде ты, Тётка, заменишь сегодня покойного Ивана Иваныча. Чёрт знает что! Ничего не готово, не выучено, репетиций было мало! Осрамимся, провалимся!\nЗатем он опять вышел и через минуту вернулся в шубе и в цилиндре. Подойдя к коту, он взял его за передние лапы, поднял и спрятал его на груди под шубу, причём Фёдор Тимофеич казался очень равнодушным и даже не потрудился открыть глаз. Для него, по-видимому, было решительно всё равно: лежать ли, или быть поднятым за ноги, валяться ли на матрасике, или покоиться на груди хозяина под шубой…\n— Тётка, пойдём, — сказал хозяин.\nНичего не понимая и виляя хвостом, Тётка пошла за ним. Через минуту она уже сидела в санях около ног хозяина и слушала, как он, пожимаясь от холода и волнения, бормотал:\n— Осрамимся! Провалимся!\nСани остановились около большого странного дома, похожего на опрокинутый супник. Длинный подъезд этого дома с тремя стеклянными дверями был освещён дюжиной ярких фонарей. Двери со звоном отворялись и, как рты, глотали людей, которые сновали у подъезда. Людей было много, часто к подъезду подбегали и лошади, но собак не было видно.\nХозяин взял на руки Тётку и сунул её на грудь, под шубу, где находился Фёдор Тимофеич. Тут было темно и душно, но тепло. На мгновение вспыхнули две тусклые зелёные искорки — это открыл глаза кот, обеспокоенный холодными, жёсткими лапами соседки. Тётка лизнула его ухо и, желая усесться возможно удобнее, беспокойно задвигалась, смяла его под себя холодными лапами и нечаянно высунула из-под шубы голову, но тотчас же сердито заворчала и нырнула под шубу. Ей показалось, что она увидела громадную, плохо освещённую комнату, полную чудовищ; из-за перегородок и решёток, которые тянулись по обе стороны комнаты, выглядывали страшные рожи: лошадиные, рогатые, длинноухие, и какая-то одна толстая, громадная рожа с хвостом вместо носа и с двумя длинными обглоданными костями, торчащими изо рта.\nКот сипло замяукал под лапами Тётки, но в это время шуба распахнулась, хозяин сказал «гоп!», и Фёдор Тимофеич с Тёткою прыгнули на пол. Они уже были в маленькой комнате с серыми дощатыми стенами; тут, кроме небольшого столика с зеркалом, табурета и тряпья, развешанного по углам, не было никакой другой мебели, и, вместо лампы или свечи, горел яркий веерообразный огонёк, приделанный к трубочке, вбитой в стену. Фёдор Тимофеич облизал свою шубу, помятую Тёткой, пошёл под табурет и лёг. Хозяин, всё ещё волнуясь и потирая руки, стал раздеваться… Он разделся так, как обыкновенно раздевался у себя дома, готовясь лечь под байковое одеяло, то есть снял всё, кроме белья, потом сел на табурет и, глядя в зеркало, начал выделывать над собой удивительные штуки. Прежде всего он надел на голову парик с пробором и с двумя вихрами, похожими на рога, потом густо намазал лицо чем-то белым и сверх белой краски нарисовал ещё брови, усы и румяны. Затеи его этим не кончились. Опачкавши лицо и шею, он стал облачаться в какой-то необыкновенный, ни с чем не сообразный костюм, какого Тётка никогда не видала раньше ни в домах, ни на улице. Представьте вы себе широчайшие панталоны, сшитые из ситца с крупными цветами, какой употребляется в мещанских домах для занавесок и обивки мебели, панталоны, которые застёгиваются у самых подмышек; одна панталона сшита из коричневого ситца, другая из светло-жёлтого. Утонувши в них, хозяин надел ещё ситцевую курточку с большим зубчатым воротником и с золотой звездой на спине, разноцветные чулки и зелёные башмаки…\nУ Тётки запестрило в глазах и в душе. От белолицей мешковатой фигуры пахло хозяином, голос у неё был тоже знакомый, хозяйский, но бывали минуты, когда Тётку мучили сомнения, и тогда она готова была бежать от пёстрой фигуры и лаять. Новое место, веерообразный огонёк, запах, метаморфоза, случившаяся с хозяином, — всё это вселяло в неё неопределённый страх и предчувствие, что она непременно встретится с каким-нибудь ужасом вроде толстой рожи с хвостом вместо носа. А тут ещё где-то за стеной далеко играла ненавистная музыка и слышался временами непонятный рёв. Одно только и успокаивало её — это невозмутимость Фёдора Тимофеича. Он преспокойно дремал под табуретом и не открывал глаз, даже когда двигался табурет.\nКакой-то человек во фраке и в белой жилетке заглянул в комнатку и сказал:\n— Сейчас выход мисс Арабеллы. После неё — вы.\nХозяин ничего не ответил. Он вытащил из-под стола небольшой чемодан, сел и стал ждать. По губам и по рукам его было заметно, что он волновался, и Тётка слышала, как дрожало его дыхание.\n— M-r Жорж, пожалуйте! — крикнул кто-то за дверью.\nХозяин встал и три раза перекрестился, потом достал из-под табурета кота и сунул его в чемодан.\n— Иди, Тётка! — сказал он тихо.\nТётка, ничего не понимая, подошла к его рукам; он поцеловал её в голову и положил рядом с Фёдором Тимофеичем. Засим наступили потёмки… Тётка топталась по коту, царапала стенки чемодана и от ужаса не могла произнести ни звука, а чемодан покачивался, как на волнах, и дрожал…\n— А вот и я! — громко крикнул хозяин. — А вот и я!\nТётка почувствовала, что после этого крика чемодан ударился о что-то твёрдое и перестал качаться. Послышался громкий густой рёв: по ком-то хлопали, и этот кто-то, вероятно рожа с хвостом вместо носа, ревел и хохотал так громко, что задрожали замочки у чемодана. В ответ на рёв раздался пронзительный, визгливый смех хозяина, каким он никогда не смеялся дома.\n— Га! — крикнул он, стараясь перекричать рёв. — Почтеннейшая публика! Я сейчас только с вокзала! У меня издохла бабушка и оставила мне наследство! В чемодане что-то очень тяжёлое — очевидно, золото… Га-а! И вдруг здесь миллион! Сейчас мы откроем и посмотрим…\nВ чемодане щёлкнул замок. Яркий свет ударил Тётку по глазам; она прыгнула вон из чемодана и, оглушённая рёвом, быстро, во всю прыть забегала вокруг своего хозяина и залилась звонким лаем.\n— Га! — закричал хозяин. — Дядюшка Фёдор Тимофеич! Дорогая тётушка! Милые родственники, чёрт бы вас взял!\nОн упал животом на песок, схватил кота и Тётку и принялся обнимать их. Тётка, пока он тискал её в своих объятиях, мельком оглядела тот мир, в который занесла её судьба, и, поражённая его грандиозностью, на минуту застыла от удивления и восторга, потом вырвалась из объятий хозяина и от остроты впечатления, как волчок, закружилась на одном месте. Новый мир был велик и полон яркого света; куда ни взглянешь, всюду, от пола до потолка, видны были одни только лица, лица, лица и больше ничего.\n— Тётушка, прошу вас сесть! — крикнул хозяин.\nПомня, что это значит, Тётка вскочила на стул и села. Она поглядела на хозяина. Глаза его, как всегда, глядели серьёзно и ласково, но лицо, в особенности рот и зубы, были изуродованы широкой неподвижной улыбкой. Сам он хохотал, прыгал, подёргивал плечами и делал вид, что ему очень весело в присутствии тысячей лиц. Тётка поверила его весёлости, вдруг почувствовала всем своим телом, что на неё смотрят эти тысячи лиц, подняла вверх свою лисью морду и радостно завыла.\n— Вы, Тётушка, посидите, — сказал ей хозяин, — а мы с дядюшкой попляшем камаринского.\nФёдор Тимофеич в ожидании, когда его заставят делать глупости, стоял и равнодушно поглядывал по сторонам. Плясал он вяло, небрежно, угрюмо, и видно было по его движениям, по хвосту и по усам, что он глубоко презирал и толпу, и яркий свет, и хозяина, и себя… Протанцевав свою порцию, он зевнул и сел.\n— Ну-с, Тётушка, — сказал хозяин, — сначала мы с вами споём, а потом попляшем. Хорошо?\nОн вынул из кармана дудочку и заиграл. Тётка, не вынося музыки, беспокойно задвигалась на стуле и завыла. Со всех сторон послышались рёв и аплодисменты. Хозяин поклонился и, когда всё стихло, продолжал играть… Во время исполнения одной очень высокой ноты где-то наверху среди публики кто-то громко ахнул.\n— Тятька! — крикнул детский голос. — А ведь это Каштанка!\n— Каштанка и есть! — подтвердил пьяненький дребезжащий тенорок. — Каштанка! Федюшка, это, накажи бог, Каштанка! Фюйть!\nКто-то на галерее свистнул, и два голоса, один — детский, другой — мужской, громко позвали:\n— Каштанка! Каштанка!\nТётка вздрогнула и посмотрела туда, где кричали. Два лица: одно волосатое, пьяное и ухмыляющееся, другое — пухлое, краснощёкое и испуганное — ударили её по глазам, как раньше ударил яркий свет… Она вспомнила, упала со стула и забилась на песке, потом вскочила и с радостным визгом бросилась к этим лицам. Раздался оглушительный рёв, пронизанный насквозь свистками и пронзительным детским криком:\n— Каштанка! Каштанка!\nТётка прыгнула через барьер, потом через чьё-то плечо, очутилась в ложе; чтобы попасть в следующий ярус, нужно было перескочить высокую стену; Тётка прыгнула, но не допрыгнула и поползла назад по стене. Затем она переходила с рук на руки, лизала чьи-то руки и лица, подвигалась всё выше и выше и наконец попала на галёрку…\nСпустя полчаса Каштанка шла уже по улице за людьми, от которых пахло клеем и лаком. Лука Александрыч покачивался и инстинктивно, наученный опытом, старался держаться подальше от канавы.\n— В бездне греховней валяюся во утробе моей… — бормотал он. — А ты, Каштанка, — недоумение. Супротив человека ты всё равно, что плотник супротив столяра.\nРядом с ним шагал Федюшка в отцовском картузе. Каштанка глядела им обоим в спины, и ей казалось, что она давно уже идёт за ними и радуется, что жизнь её не обрывалась ни на минуту.\nВспоминала она комнатку с грязными обоями, гуся, Фёдора Тимофеича, вкусные обеды, ученье, цирк, но всё это представлялось ей теперь, как длинный, перепутанный, тяжёлый сон…", "sl1": "Маленькая девочка нездорова. Каждый день к ней ходит доктор Михаил Петрович, которого она знает уже давно-давно. А иногда он приводит с собою еще двух докторов, незнакомых. Они переворачивают девочку на спину и на живот, слушают что-то, приложив ухо к телу, оттягивают вниз нижнее веко и смотрят. При этом они как-то важно посапывают, лица у них строгие, и говорят они между собою на непонятном языке.\nПотом переходят из детской в гостиную, где их дожидается мама. Самый главный доктор — высокий, седой, в золотых очках — рассказывает ей о чем-то серьезно и долго. Дверь не закрыта, и девочке с ее кровати все видно и слышно. Многого она не понимает, но знает, что речь идет о ней. Мама глядит на доктора большими, усталыми, заплаканными глазами. Прощаясь, главный доктор говорит громко:\n— Главное, — не давайте ей скучать. Исполняйте все ее капризы.\n— Ах, доктор, но она ничего не хочет!\n— Ну, не знаю… вспомните, что ей нравилось раньше, до болезни. Игрушки… какие-нибудь лакомства…\n— Нет, нет, доктор, она ничего не хочет…\n— Ну, постарайтесь ее как-нибудь развлечь… Ну, хоть чем-нибудь… Даю вам честное слово, что если вам удастся ее рассмешить, развеселить, — то это будет лучшим лекарством. Поймите же, что ваша дочка больна равнодушием к жизни, и больше ничем… До свидания, сударыня!\n— Милая Надя, милая моя девочка, — говорит мама, — не хочется ли тебе чего-нибудь?\n— Нет, мама, ничего не хочется.\n— Хочешь, я посажу к тебе на постельку всех твоих кукол. Мы поставим креслица, диван, столик и чайный прибор. Куклы будут пить чай и разговаривать о погоде и о здоровье своих детей.\n— Спасибо, мама… Мне не хочется… Мне скучно…\n— Ну, хорошо, моя девочка, не надо кукол. А может быть, позвать к тебе Катю или Женечку? Ты ведь их так любишь.\n— Не надо, мама. Правда же, не надо. Я ничего, ничего не хочу. Мне так скучно!\n— Хочешь, я тебе принесу шоколаду?\nНо девочка не отвечает и смотрит в потолок неподвижными, невеселыми глазами. У нее ничего не болит и даже нет жару. Но она худеет и слабеет с каждым днем. Что бы с ней ни делали, ей все равно, и ничего ей не нужно. Так лежит она целые дни и целые ночи, тихая, печальная. Иногда она задремлет на полчаса, но и во сне ей видится что-то серое, длинное, скучное, как осенний дождик.\nКогда из детской отворена дверь в гостиную, а из гостиной дальше в кабинет, то девочка видит папу. Папа ходит быстро из угла в угол и все курит, курит. Иногда он приходит в детскую, садится на край постельки и тихо поглаживает Надины ноги. Потом вдруг встает и отходит к окну. Он что-то насвистывает, глядя на улицу, но плечи у него трясутся. Затем он торопливо прикладывает платок к одному глазу, к другому и, точно рассердись, уходит к себе в кабинет. Потом он опять бегает из угла в угол и все… курит, курит, курит… И кабинет от табачного дыма делается весь синий.\nНо однажды утром девочка просыпается немного бодрее, чем всегда. Она что-то видела во сне, но никак не может вспомнить, что именно, и смотрит долго и внимательно в глаза матери.\n— Тебе что-нибудь нужно? — спрашивает мама.\nНо девочка вдруг вспоминает свой сон и говорит шепотом, точно по секрету:\n— Мама… а можно мне… слона? Только не того, который нарисован на картинке… Можно?\n— Конечно, моя девочка, конечно, можно.\nОна идет в кабинет и говорит папе, что девочка хочет слона. Папа тотчас же надевает пальто и шляпу и куда-то уезжает. Через полчаса он возвращается с дорогой, красивой игрушкой. Это большой серый слон, который сам качает головою и машет хвостом; на слоне красное седло, а на седле золотая палатка и в ней сидят трое маленьких человечков. Но девочка глядит на игрушку так же равнодушно, как на потолок и на стены, и говорит вяло:\n— Нет. Это совсем не то. Я хотела настоящего, живого слона, а этот мертвый.\n— Ты погляди только, Надя, — говорит папа. — Мы его сейчас заведем, и он будет совсем, совсем как живой.\nСлона заводят ключиком, и он, покачивая головой и помахивая хвостом, начинает переступать ногами и медленно идет по столу. Девочке это совсем не интересно и даже скучно, но, чтобы не огорчить отца, она шепчет кротко:\n— Я тебя очень, очень благодарю, милый папа. Я думаю, ни у кого нет такой интересной игрушки… Только… помнишь… ведь ты давно обещал свозить меня в зверинец посмотреть на настоящего слона… и ни разу не повез…\n— Но, послушай же, милая моя девочка, пойми, что это невозможно. Слон очень большой, он до потолка, он не поместится в наших комнатах… И потом, где я его достану?\n— Папа, да мне не нужно такого большого… Ты мне привези хоть маленького, только живого. Ну, хоть вот, вот такого… Хоть слоненышка.\n— Милая девочка, я рад все для тебя сделать, но этого я не могу. Ведь это все равно как если бы ты вдруг мне сказала: папа, достань мне с неба солнце.\nДевочка грустно улыбается.\n— Какой ты глупый, папа. Разве я не знаю, что солнце нельзя достать, потому что оно жжется. И луну тоже нельзя. Нет, мне бы слоника… настоящего.\nИ она тихо закрывает глаза и шепчет:\n— Я устала… Извини меня, папа…\nПапа хватает себя за волосы и убегает в кабинет. Там он некоторое время мелькает из угла в угол. Потом решительно бросает на пол недокуренную папиросу (за что ему всегда достается от мамы) и кричит горничной:\n— Ольга! Пальто и шляпу!\nВ переднюю выходит жена.\n— Ты куда, Саша? — спрашивает она.\nОн тяжело дышит, застегивая пуговицы пальто.\n— Я сам, Машенька, не знаю куда… только, кажется, я сегодня к вечеру и в самом деле приведу сюда, к нам, настоящего слона.\nЖена смотрит на него тревожно.\n— Милый, здоров ли ты? Не болит ли у тебя голова? Может быть, ты плохо спал сегодня?\n— Я совсем не спал, — отвечает он сердито. — Я вижу, ты хочешь спросить, не сошел ли я с ума? Покамест нет еще. До свиданья! Вечером все будет видно.\nИ он исчезает, громко хлопнув входной дверью.", "sl2": "Через два часа он сидит в зверинце, в первом ряду, и смотрит, как ученые звери по приказанию хозяина выделывают разные штуки. Умные собаки прыгают, кувыркаются, танцуют, поют под музыку, складывают слова из больших картонных букв. Обезьянки — одни в красных юбках, другие в синих штанишках — ходят по канату и ездят верхом на большом пуделе. Огромные рыжие львы скачут сквозь горящие обручи. Неуклюжий тюлень стреляет из пистолета. Под конец выводят слонов. Их три: один большой, два совсем маленькие, карлики, но все-таки ростом куда больше, чем лошадь. Странно смотреть, как эти громадные животные, на вид такие неповоротливые и тяжелые, исполняют самые трудные фокусы, которые не под силу и очень ловкому человеку. Особенно отличается самый большой слон. Он становится сначала на задние лапы, садится, становится на голову, ногами вверх, ходит по деревянным бутылкам, ходит по катящейся бочке, переворачивает хоботом страницы большой картонной книги и, наконец, садится за стол и, повязавшись салфеткой, обедает, совсем как благовоспитанный мальчик.\nПредставление оканчивается. Зрители расходятся. Надин отец подходит к толстому немцу, хозяину зверинца. Хозяин стоит за дощатой перегородкой и держит во рту большую черную сигару.\n— Извините, пожалуйста, — говорит Надин отец. — Не можете ли вы отпустить вашего слона ко мне домой на некоторое время?\nНемец от удивления широко открывает глаза и даже рот, отчего сигара падает на землю. Он, кряхтя, нагибается, подымает сигару, вставляет ее опять в рот и только тогда произносит:\n— Отпустить? Слона? Домой? Я вас не понимаю.\nПо глазам немца видно, что он тоже хочет спросить, не болит ли у Надиного отца голова… Но отец поспешно объясняет, в чем дело: его единственная дочь, Надя, больна какой-то странной болезнью, которой даже доктора не понимают как следует. Она лежит уж месяц в кроватке, худеет, слабеет с каждым днем, ничем не интересуется, скучает и потихоньку гаснет. Доктора велят ее развлекать, но ей ничто не нравится; велят исполнять все ее желания, но у нее нет никаких желаний. Сегодня она захотела видеть живого слона. Неужели это невозможно сделать?\nИ он добавляет дрожащим голосом, взявши немца за пуговицу пальто:\n— Ну вот… Я, конечно, надеюсь, что моя девочка выздоровеет. Но… спаси бог… вдруг ее болезнь окончится плохо… вдруг девочка умрет?.. Подумайте только: ведь меня всю жизнь будет мучить мысль, что я не исполнил ее последнего желания!..\nНемец хмурится и в раздумье чешет мизинцем левую бровь. Наконец он спрашивает:\n— Гм… А сколько вашей девочке лет?\n— Шесть.\n— Гм… Моей Лизе тоже шесть. Гм… Но, знаете, вам это будет дорого стоить. Придется привести слона ночью и только на следующую ночь увести обратно. Днем нельзя. Соберется публикум, и сделается один скандал… Таким образом выходит, что я теряю целый день, и вы мне должны возвратить убыток.\n— О, конечно, конечно… не беспокойтесь об этом…\n— Потом: позволит ли полиция водить один слон в один дом?\n— Я это устрою. Позволит.\n— Еще один вопрос: позволит ли хозяин вашего дома вводить в свой дом один слон?\n— Позволит. Я сам хозяин этого дома.\n— Ага! Это еще лучше. И потом еще один вопрос: в котором этаже вы живете?\n— Во втором.\n— Гм… Это уже не так хорошо… Имеете ли вы в своем доме широкую лестницу, высокий потолок, большую комнату, широкие двери и очень крепкий пол? Потому что мой Томми имеет высоту три аршина и четыре вершка, а в длину четыре аршин. Кроме того, он весит сто двенадцать пудов.\nНадин отец задумывается на минуту.\n— Знаете ли что? — говорит он. — Поедем сейчас ко мне и рассмотрим все на месте. Если надо, я прикажу расширить проход в стенах.\n— Очень хорошо! — соглашается хозяин зверинца.\nНочью слона ведут в гости к больной девочке.\nВ белой попоне он важно шагает по самой середине улицы, покачивает головой и то свивает, то развивает хобот. Вокруг него, несмотря на поздний час, большая толпа. Но слон не обращает на нее внимания: он каждый день видит сотни людей в зверинце. Только один раз он немного рассердился.\nКакой-то уличный мальчишка подбежал к нему под самые ноги и начал кривляться на потеху зевакам.\nТогда слон спокойно снял с него хоботом шляпу и перекинул ее через соседний забор, утыканный гвоздями.\nГородовой идет среди толпы и уговаривает ее:\n— Господа, прошу разойтись. И что вы тут находите такого необыкновенного? Удивляюсь! Точно не видали никогда живого слона на улице.\nПодходят к дому. На лестнице, так же как и по всему пути слона, до самой столовой, все двери растворены настежь, для чего приходилось отбивать молотком дверные щеколды. Точно так же делалось однажды, когда в дом вносили большую чудотворную икону.\nНо перед лестницей слон останавливается в беспокойстве и упрямится.\n— Надо дать ему какое-нибудь лакомство… — говорит немец. — Какой-нибудь сладкий булка или что… Но… Томми!.. Ого-го!.. Томми!\nНадин отец бежит в соседнюю булочную и покупает большой круглый фисташковый торт. Слон обнаруживает желание проглотить его целиком вместе с картонной коробкой, но немец дает ему всего четверть. Торт приходится по вкусу Томми, и он протягивает хобот за вторым ломтем. Однако немец оказывается хитрее. Держа в руке лакомство, он подымается вверх со ступеньки на ступеньку, и слон с вытянутым хоботом, с растопыренными ушами поневоле следует за ним. На площадке Томми получает второй кусок.\nТаким образом его приводят в столовую, откуда заранее вынесена вся мебель, а пол густо застлан соломой… Слона привязывают за ногу к кольцу, ввинченному в пол. Кладут перед ним свежей моркови, капусты и репы. Немец располагается рядом, на диване. Тушат огни, и все ложатся спать.\nНа другой день девочка просыпается чуть свет в прежде всего спрашивает:\n— А что же слон? Он пришел?\n— Пришел, — отвечает мама, — но только он велел, чтобы Надя сначала умылась, а потом съела яйцо всмятку и выпила горячего молока.\n— А он добрый?\n— Он добрый. Кушай, девочка. Сейчас мы пойдем к нему.\n— А он смешной?\n— Немножко. Надень теплую кофточку.\nЯйцо быстро съедено, молоко выпито. Надю сажают в ту самую колясочку, в которой она ездила, когда была еще такой маленькой, что совсем не умела ходить, и везут в столовую.\nСлон оказывается гораздо больше, чем думала Надя, когда разглядывала его на картинке. Ростом он только чуть-чуть пониже двери, а в длину занимает половину столовой. Кожа на нем грубая, в тяжелых складках. Ноги толстые, как столбы. Длинный хвост с чем-то вроде помела на конце. Голова в больших шишках. Уши большие, как лопухи, и висят вниз. Глаза совсем крошечные, но умные и добрые. Клыки обрезаны. Хобот — точно длинная змея и оканчивается двумя ноздрями, а между ними подвижной, гибкий палец. Если бы слон вытянул хобот во всю длину, то наверно достал бы он им до окна.\nДевочка вовсе не испугана. Она только немножко поражена громадной величиной животного. Зато нянька, шестнадцатилетняя Поля, начинает визжать от страха.\nХозяин слона, немец, подходит к колясочке и говорит:\n— Доброго утра, барышня. Пожалуйста, не бойтесь. Томми очень добрый и любит детей.\nДевочка протягивает немцу свою маленькую бледную ручку.\n— Здравствуйте, как вы поживаете? — отвечает она. — Я вовсе ни капельки не боюсь. А как его зовут?\n— Томми.\n— Здравствуйте, Томми, — произносит девочка и кланяется головой. Оттого, что слон такой большой, она не решается говорить ему на «ты». — Как вы спали эту ночь?\nОна и ему протягивает руку. Слон осторожно берет и пожимает ее тоненькие пальчики своим подвижным сильным пальцем и делает это гораздо нежнее, чем доктор Михаил Петрович. При этом слон качает головой, а его маленькие глаза совсем сузились, точно смеются.\n— Ведь он все понимает? — спрашивает девочка немца.\n— О, решительно все, барышня!\n— Но только он не говорит?\n— Да, вот только не говорит. У меня, знаете, есть тоже одна дочка, такая же маленькая, как и вы. Ее зовут Лиза. Томми с ней большой, очень большой приятель.\n— А вы, Томми, уже пили чай? — спрашивает девочка слона.\nСлон опять вытягивает хобот и дует в самое лицо девочки теплым сильным дыханием, отчего легкие волосы на голове девочки разлетаются во все стороны.\nНадя хохочет и хлопает в ладоши. Немец густо смеется. Он сам такой большой, толстый и добродушный, как слон, и Наде кажется, что они оба похожи друг на друга. Может быть, они родня?\n— Нет, он не пил чаю, барышня. Но он с удовольствием пьет сахарную воду. Также он очень любит булки.\nПриносят поднос с булками. Девочка угощает слона. Он ловко захватывает булку своим пальцем и, согнув хобот кольцом, прячет ее куда-то вниз под голову, где у него движется смешная, треугольная, мохнатая нижняя губа. Слышно, как булка шуршит о сухую кожу. То же самое Томми проделывает с другой булкой, и с третьей, и с четвертой, и с пятой и в знак благодарности кивает головой, и его маленькие глазки еще больше суживаются от удовольствия. А девочка радостно хохочет.\nКогда все булки съедены, Надя знакомит слона со своими куклами:\n— Посмотрите, Томми, вот эта нарядная кукла — это Соня. Она очень добрый ребенок, но немножко капризна и не хочет есть суп. А это Наташа — Сонина дочь. Она уже начинает учиться и знает почти все буквы. А вот это — Матрешка. Это моя самая первая кукла. Видите, у нее нет носа, и голова приклеена, и нет больше волос. Но все-таки нельзя же выгонять из дому старушку. Правда, Томми? Она раньше была Сониной матерью, а теперь служит у нас кухаркой. Ну, так давайте играть, Томми: вы будете папой, а я мамой, а это будут наши дети.\nТомми согласен. Он смеется, берет Матрешку за шею и тащит к себе в рот. Но это только шутка. Слегка пожевав куклу, он опять кладет ее девочке на колени, правда немного мокрую и помятую.\nПотом Надя показывает ему большую книгу с картинками и объясняет:\n— Это лошадь, это канарейка, это ружье… Вот клетка с птичкой, вот ведро, зеркало, печка, лопата, ворона… А это вот, посмотрите, это слон! Правда, совсем не похоже? Разве же слоны бывают такие маленькие, Томми?\nТомми находит, что таких маленьких слонов никогда не бывает на свете. Вообще ему эта картинка не нравится. Он захватывает пальцем край страницы и переворачивает ее.\nНаступает час обеда, но девочку никак нельзя оторвать от слона. На помощь приходит немец:\n— Позвольте, я все это устрою. Они пообедают вместе.\nОн приказывает слону сесть. Слон послушно садится, отчего пол во всей квартире сотрясается и дребезжит посуда в шкафу, а у нижних жильцов сыплется с потолка штукатурка. Напротив его садится девочка. Между ними ставят стол. Слону подвязывают скатерть вокруг шеи, и новые друзья начинают обедать. Девочка ест суп из курицы и котлетку, а слон — разные овощи и салат. Девочке дают крошечную рюмку хересу, а слону — теплой воды со стаканом рома, и он с удовольствием вытягивает этот напиток хоботом из миски. Затем они получают сладкое — девочка чашку какао, а слон половину торта, на этот раз орехового. Немец в это время сидит с папой в гостиной и с таким же наслаждением, как и слон, пьет пиво, только в большем количестве.\nПосле обеда приходят какие-то папины знакомые, их еще в передней предупреждают о слоне, чтобы они не испугались. Сначала они не верят, а потом, увидев Томми, жмутся к дверям.\n— Не бойтесь, он добрый! — успокаивает их девочка.\nНо знакомые поспешно уходят в гостиную и, не просидев и пяти минут, уезжают.\nНаступает вечер. Поздно. Девочке пора спать. Однако ее невозможно оттащить от слона. Она так и засыпает около него, и ее уже сонную отвозят в детскую. Она даже не слышит, как ее раздевают.\nВ эту ночь Надя видит во сне, что она женилась на Томми, и у них много детей, маленьких, веселых слоняток. Слон, которого ночью отвели в зверинец, тоже видит во сне милую, ласковую девочку. Кроме того, ему снятся большие торты, ореховые и фисташковые, величиною с ворота…\nУтром девочка просыпается бодрая, свежая и, как в прежние времена, когда она была еще здорова, кричит на весь дом, громко и нетерпеливо:\n— Мо-лоч-ка!\nУслышав этот крик, мама радостно крестится у себя в спальне.\nНо девочка тут же вспоминает о вчерашнем и спрашивает:\n— А слон?\nЕй объясняют, что слон ушел домой по делам, что у него есть дети, которых нельзя оставлять одних, что он просил кланяться Наде и что он ждет ее к себе в гости, когда она будет здорова.\nДевочка хитро улыбается и говорит:\n— Передайте Томми, что я уже совсем здорова!"};

 r2: 'Прошло несколько недель. Пойндекстеры устроились в новом доме и устроили большой праздник для соседей: офицеров из ближнего форта и плантаторов. Гостей позвали на охоту за дикими лошадьми.\nДом Каса-дель-Корво стоял на высоком берегу реки. Его построили когда-то испанцы: толстые белые стены, плоская крыша, внутренний двор с фонтаном и цветами. Слуги несколько дней готовили праздник. Во дворе поставили длинные столы, повесили фонарики, привезли музыкантов из посёлка. Луиза примеряла новое платье, а Генри чистил своё ружьё и мечтал о том, как будет охотиться вместе с офицерами.\nПриехали молодые офицеры в синих мундирах, соседи-плантаторы с жёнами, мексиканские вакеро в расшитых куртках. Колхаун ходил между гостями и всем рассказывал, что Луиза почти его невеста. Девушка делала вид, что не слышит.\nПраздник удался. Играла музыка, офицеры танцевали с дочерьми плантаторов, старики спорили о ценах на хлопок и о новых законах. Генри показывал друзьям конюшню. Луиза танцевала со всеми, кто её приглашал, кроме Колхауна: каждый раз, когда он подходил, у неё как будто случайно находилось дело. Колхаун скрипел зубами и всё чаще наливал себе вина. А утром гости собрались у ворот на охоту. Мужчины проверяли ружья и сёдла, вакеро свёртывали лассо, собаки лаяли и рвались вперёд.\nНа охоту пригласили и Мориса-мустангера, лучшего знатока лошадей в округе. Он приехал на своём гнедом коне и сразу заметил вдали табун. Впереди табуна бежала необыкновенная кобылица — пятнистая, будто осыпанная белыми и тёмными пятнами. Мексиканцы называли таких лошадей «пегими».\nЛуиза пришла в восторг. «Какая красавица! — воскликнула она. — Я бы отдала за неё что угодно!» Морис тихо сказал, что постарается поймать кобылицу для неё. Колхаун усмехнулся: дикую лошадь из табуна поймать почти невозможно.\nМорис объяснил гостям, как охотятся на мустангов. Дикие лошади очень чуткие: они слышат всадника за милю и чуют запах человека по ветру. Поэтому подъезжать нужно против ветра, медленно и тихо. А когда первые увидел, как она улыбается. Они медленно возвращались к гостям, и Морис рассказывал о прерии: как найти воду по полёту птиц, как узнать погоду по облакам, почему ночью в траве светятся огоньки светляков.\nЛуиза спросила, не страшно ли ему жить одному в прерии. Морис ответил, что он не один: у него есть верный конь, собака Тара и старый слуга Фелим, который приехал с ним из Ирландии. «А прерия похожа на море, — сказал он. — Кто её не знает, тот боится. А кто знает, тот любит». Когда они подъехали к гостям, Колхаун встретил их мрачным взглядом. Отец бросился к дочери и долго благодарил Мориса, но тот только поклонился и сказал, что любой на его месте поступил бы так же.\nЧерез несколько дней к Каса-дель-Корво прискакал слуга Мориса — добродушный старый Фелим. Он привёл пятнистую кобылицу. Морис всё-таки поймал её лассо и прислал Луизе в подарок. Девушка назвала её Луной.\nЛуиза каждое утро выходила к загону, приносила кобылице сахар и тихо разговаривала с ней. Сначала Луна дрожала и пятилась, но через неделю стала брать сахар с ладони, а потом позволила себя оседлать. Скоро Луиза уже скакала на ней по берегу реки, и никто в округе не мог её догнать.\nЛюди в посёлке удивлялись: «Пойндекстерова дочка скачет, как настоящая мексиканка!» А некоторые замечали, что прогулки Луизы почему-то всё чаще проходят в сторону ручья Аламо, где стояла хижина мустангера. Колхаун тоже это заметил. Он стал следить за Луизой и подкупил одного из слуг, чтобы тот рассказывал ему, куда ездит молодая хозяйка.\nКолхаун, увидев подарок, побледнел от злости. Вечером в салуне посёлка он нарочно толкнул Мориса и оскорбил его. Морис ответил спокойно, но твёрдо. Колхаун схватился за пистолет. Хорошо, что вмешались офицеры и остановили ссору. Но с этого дня Колхаун стал опасным врагом мустангера.\nОфицеры потом долго обсуждали эту ссору. Одни говорили, что мустангер держался как настоящий джентльмен. Другие шептались, что Колхаун не прощает обид и рано или поздно отомстит. Сам Колхаун ходил мрачный, много пил и о чём-то подолгу говорил со своими слугами.\nА Генри, брат Луизы, наоборот, подружился с Морисом. Он часто приезжал к нему в хижину на берегу ручья, где на стенах висели шкуры, сёдла и лассо. «Ты настоящий человек прерии», — говорил Генри, и Морис смеялся.',
 r3: 'Наступила осень. Однажды ночью Генри Пойндекстер уехал из дома и не вернулся. Утром нашли только следы его коня. Отец места себе не находил. Соседи собрались и поехали искать юношу по прерии.\nОтряд был большой: плантаторы, офицеры из форта, вакеро, слуги. Впереди ехали следопыты. Колхаун тоже поехал и всё время держался рядом с Пойндекстером. Он говорил, что Генри, наверное, поехал к мустангеру и что от этого бродяги можно ожидать чего угодно. Отец молчал. Луиза осталась дома, но не могла найти себе места: она ходила по комнатам, выходила на крышу и смотрела в прерию, пока глаза не начинали болеть от солнца.\nПрошёл день, второй. Следопыты нашли место, где Генри останавливался у ручья, нашли отпечатки его сапог и следы ещё одной лошади. Потом пошёл дождь и смыл почти всё. Люди устали, лошади хромали. Некоторые стали говорить, что пора возвращаться домой. Колхаун горячился и требовал ехать к хижине мустангера. «Там мы найдём ответ!» — кричал он. В хижине никого не оказалось. Дверь была открыта, очаг холодный, на столе стояла недопитая кружка. Мориса не было. Фелим тоже исчез: позже выяснилось, что он сам искал хозяина.\nИ тут случилось то, от чего у всех похолодела кровь. На краю зарослей появился всадник на тёмном коне. На нём был плащ, а на месте головы — ничего! Всадник постоял, будто смотрел на людей, развернул коня и исчез в высокой траве. Люди замерли. «Это призрак!» — шептали одни. «Дьявол!» — крестились другие.\nВсадника без головы видели ещё много раз — то у реки, то на холмах. Он появлялся и пропадал, и никто не мог его догнать. Только один человек не испугался — старый охотник Зеб Стумп, высокий, неторопливый, в потёртой кожаной куртке. Он внимательно осмотрел следы копыт и сказал: «Призраки следов не оставляют. А этот конь подкован».\nЗеб Стумп был охотником всю жизнь. Он умел читать следы, как другие читают книгу. По сломанной ветке он мог сказать, когда здесь проехал всадник, по примятой траве — куда он свернул, по капле крови на листе — ранен ли зверь. Его старая кобыла была такой же неторопливой, как хозяин, но никогда не уставала. Люди в посёлке посмеивались над Зебом за его медлительность, но, когда случалась беда, шли именно к нему.\nЛуиза пришла к Зебу сама. Она сказала, что не верит ни в каких призраков и не верит, что Морис мог причинить зло её брату. Старый охотник долго молчал, а потом сказал: «Вот это правильно, мисс. Сначала смотрят глазами, а потом думают головой. А кто сразу кричит, тот обычно что-то прячет». И он посмотрел туда, где стоял Колхаун.\nВ это время Мориса нашли в лесу — раненого, в лихорадке. Он лежал под деревом, и к нему не подпускала волков его верная собака Тара. Колхаун сразу закричал, что это Морис убил Генри. Многие ему поверили, потому что все знали о ссоре.\nНекоторые горячие головы даже предлагали не ждать суда и наказать мустангера сразу. Колхаун подзадоривал их. Но офицеры не позволили устроить расправу. «Каждый человек имеет право на суд», — твёрдо сказал майор из форта. Мориса перевезли в посёлок и заперли. Он был так слаб, что не мог даже рассказать, что случилось той ночью. Фелим сидел у дверей и плакал.\nДоктор из форта лечил Мориса. Он говорил, что у раненого сильная лихорадка и что ему нужен покой. Иногда Морис бредил и что-то шептал. Однажды он ясно сказал: «Генри, возьми мой плащ, ты промокнешь…» Доктор записал эти слова, но никто тогда не понял, как они важны. Мориса посадили под стражу, и начался суд.\nЗеб Стумп не поверил в вину мустангера. Вместе с Луизой он стал искать правду. Они нашли место, где Генри последний раз видели живым, и Зеб заметил на коре дерева след от пули. Пуля была самодельная, с особой меткой.\nЗеб аккуратно вырезал пулю ножом и спрятал в кожаный мешочек. «Пусть полежит до суда», — сказал он. Потом они долго шли по следу. Зеб показывал Луизе, где лошадь остановилась, где испугалась и помчалась галопом, где через ручей прошёл человек в сапогах с широкими каблуками. «Такие сапоги в округе носит только один человек», — пробормотал охотник, но имени не назвал.\nЛуиза уставала, руки её были исцарапаны колючками, но она не жаловалась. Ночью они разводили маленький костёр, и Зеб рассказывал, как надо ждать зверя у водопоя: терпеливо, тихо, против ветра. «Всадник тоже придёт к воде, — сказал он. — Конь у него живой, а живому коню нужно пить».\nНаконец Зеб выследил Всадника без головы и поймал его коня лассо. Оказалось, что это был Генри. Ночью он поменялся с Морисом плащами и шляпами, потому что Морис подарил ему свой плащ от дождя. А враг, который поджидал Мориса в темноте, по ошибке выстрелил в Генри. Испуганный конь унёс тело хозяина в прерию, и издалека казалось, что всадник без головы.\nЗеб так и подстерёг его — у водопоя на рассвете. Конь подошёл к ручью, опустил голову к воде, и в этот миг старый охотник бросил лассо. Петля легла точно. Конь рванулся, но Зеб держал крепко, а потом заговорил с ним тихо и ласково, как с ребёнком. Конь задрожал и успокоился. Это был конь Генри.\nЗеб подошёл ближе и снял шляпу. На седле была сумка Генри, а под седлом — потник с вышитыми буквами «Г. П.». Старый охотник вздохнул. Он понял, что юноши уже нет в живых. Он бережно накрыл всадника плащом и повёл коня в посёлок, шагая рядом пешком и держа повод в руке.\nНа суде Зеб показал пулю. На ней были инициалы — «К. К.». Это была пуля Кассия Колхауна! Он хотел убить Мориса из ревности, а убил Генри, своего родственника. Колхаун понял, что разоблачён, выхватил пистолет и бросился на Мориса, но его схватили.\nВ зале суда стало так тихо, что было слышно, как жужжит муха. Потом люди зашумели, закричали. Пойндекстер побледнел и закрыл лицо руками: человек, которого он считал родным, оказался убийцей его сына. Луиза плакала — и от горя по брату, и от облегчения, что Морис спасён.\nМориса освободили. Вскоре выяснилось ещё одно: старый Фелим принёс письмо из Ирландии. Морис оказался не бродягой, а наследником богатого рода. Но для Луизы это было неважно — она полюбила его, когда он был простым мустангером.\nЛуиза и Морис поженил /* ===== Картинки к заданиям: рисунки к математике (SVG), картинки к словам задания, тематические сцены, обложки глав ===== */
const PX = {
  svg: (w, h, body, cls) => `<svg class="pic ${cls || ''}" width="${Math.round(w)}" height="${Math.round(h)}" viewBox="0 0 ${w} ${h}" role="img" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">${body}</svg>`,
  t: (x, y, s, size, fill, anchor) => `<text x="${x}" y="${y}" font-size="${size || 16}" fill="${fill || 'currentColor'}" text-anchor="${anchor || 'middle'}" font-family="system-ui,-apple-system,sans-serif" font-weight="600">${s}</text>`,
  num: s => Number(String(s).replace(/\s/g, '').replace(',', '.'))
};

/* Десятки палочками, единицы кружками */
function picTens(nums, op){
  const items = []; let x = 10, H = 0;
  nums.forEach((n, k) => {
    const d = Math.floor(n / 10), e = n % 10, start = x; let g = '';
    for (let i = 0; i < d; i++) { g += `<rect x="${x}" y="10" width="12" height="100" rx="3" fill="#3b82f6"/>`; for (let j = 1; j < 10; j++) g += `<line x1="${x}" x2="${x + 12}" y1="${10 + j * 10}" y2="${10 + j * 10}" stroke="#bfdbfe" stroke-width="1"/>`; x += 16; }
    for (let i = 0; i < e; i++) { g += `<circle cx="${x + 8 + (i % 2) * 16}" cy="${102 - Math.floor(i / 2) * 18}" r="7" fill="#f59e0b"/>`; }
    if (e) x += 36;
    g += PX.t((start + x) / 2 - 4, 132, n, 18);
    items.push(g); x += 10;
    if (k < nums.length - 1) { items.push(PX.t(x + 8, 70, op, 28)); x += 30; }
    H = 140;
  });
  return PX.svg(Math.max(x, 120), H, items.join(''), 'tens');
}
/* Умножение — ряды, деление — поровну по группам */
function picArray(a, b, emo, div){
  const R = div ? Math.round(a / b) : a, C = div ? b : b; if (R * C > 100) return '';
  const s = 26, w = C * s + 20, h = R * s + 30; let g = '';
  for (let i = 0; i < R; i++) for (let j = 0; j < C; j++) g += `<text x="${10 + j * s + s / 2}" y="${10 + i * s + s * .78}" font-size="${s * .8}" text-anchor="middle">${emo}</text>`;
  if (div) for (let j = 0; j < C; j++) g += `<rect x="${10 + j * s + 1}" y="6" width="${s - 2}" height="${R * s + 6}" rx="8" fill="none" stroke="#a78bfa" stroke-dasharray="4 3"/>`;
  if (w >= 140) g += PX.t(w / 2, h - 4, div ? `${a} — поровну на ${C}` : `${a} ряд. по ${b}`, 13, '#64748b');
  return PX.svg(Math.max(w, 60), h, g, 'arr');
}
/* Дробь — круг */
function picPie(n, d){
  if (!(d > 0 && d <= 16)) return ''; const whole = Math.floor(n / d), rest = n % d, pies = Math.min(4, whole + (rest ? 1 : 0)) || 1; let g = '';
  for (let p = 0; p < pies; p++) { const cx = 55 + p * 105, fill = p < whole ? d : rest;
    for (let i = 0; i < d; i++) { const a0 = i / d * 2 * Math.PI - Math.PI / 2, a1 = (i + 1) / d * 2 * Math.PI - Math.PI / 2;
      const x0 = cx + 45 * Math.cos(a0), y0 = 55 + 45 * Math.sin(a0), x1 = cx + 45 * Math.cos(a1), y1 = 55 + 45 * Math.sin(a1);
      g += `<path d="M${cx},55 L${x0.toFixed(1)},${y0.toFixed(1)} A45,45 0 ${d === 1 ? 1 : 0},1 ${x1.toFixed(1)},${y1.toFixed(1)} Z" fill="${i < fill ? '#14b8a6' : '#e2e8f0'}" stroke="#fff" stroke-width="2"/>`; } }
  g += PX.t(pies * 105 / 2 + 2, 122, `${n}/${d}`, 16);
  return PX.svg(pies * 105 + 5, 130, g, 'pie');
}
/* Проценты — сетка 10×10 */
function picPct(p){ if (!(p > 0 && p <= 100)) return ''; let g = '';
  for (let i = 0; i < 100; i++) g += `<rect x="${10 + (i % 10) * 12}" y="${10 + Math.floor(i / 10) * 12}" width="11" height="11" rx="2" fill="${i < p ? '#f43f5e' : '#e2e8f0'}"/>`;
  g += PX.t(70, 146, `${p} из 100`, 12, '#64748b'); return PX.svg(140, 152, g, 'pct'); }
/* Прямоугольник со сторонами */
function picRect(a, b, unit, sq){ const k = 150 / Math.max(a, b), w = Math.max(30, a * k), h = Math.max(24, b * k), L = 70;
  let g = `<rect x="${L}" y="24" width="${w}" height="${h}" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>`;
  g += PX.t(L + w / 2, 17, sq === '?' ? '?' : `${a} ${unit}`, 14) + PX.t(L - 6, 24 + h / 2 + 5, sq === '?' ? '?' : `${b} ${unit}`, 14, null, 'end');
  if (sq) g += PX.t(L + w / 2, 24 + h / 2 + 6, sq === '?' ? `P = ${a * 4} ${unit}` : 'квадрат', 13, '#16a34a');
  return PX.svg(L + w + 20, h + 44, g, 'rect'); }
/* Коробка-параллелепипед */
function picBox(a, b, c, unit){ const g = `<path d="M30,60 L130,60 L130,140 L30,140 Z" fill="#fde68a" stroke="#b45309" stroke-width="2"/><path d="M30,60 L60,30 L160,30 L130,60 Z" fill="#fcd34d" stroke="#b45309" stroke-width="2"/><path d="M130,60 L160,30 L160,110 L130,140 Z" fill="#fbbf24" stroke="#b45309" stroke-width="2"/>`
  + PX.t(80, 158, `${a} ${unit}`, 13) + PX.t(170, 80, `${c} ${unit}`, 13, null, 'start') + PX.t(150, 22, `${b} ${unit}`, 13);
  return PX.svg(230, 165, g, 'box'); }
/* Линейка */
function picRuler(cm){ cm = Math.min(cm, 60); const k = cm > 30 ? 8 : 14, w = cm * k + 30; let g = `<rect x="10" y="20" width="${cm * k + 10}" height="40" rx="4" fill="#fef3c7" stroke="#d97706"/>`;
  for (let i = 0; i <= cm; i++) g += `<line x1="${15 + i * k}" x2="${15 + i * k}" y1="20" y2="${i % 10 === 0 ? 48 : i % 5 === 0 ? 40 : 32}" stroke="#92400e"/>` + (i % 10 === 0 ? PX.t(15 + i * k, 76, i, 11, '#92400e') : '');
  g += PX.t(w / 2, 14, `${cm} см = ${Math.floor(cm / 10)} дм ${cm % 10} см`, 12, '#64748b');

/* Рисунок к заданию по математике: разбираем условие */
function mathPic(kid, q){
  const s = q.replace(/<[^>]+>/g, ' ').replace(/&nbsp;/g, ' ').replace(/ /g, ' ');
  let m;
  if ((m = s.match(/(\d+)\s*ч\s*(\d+)\s*мин/))) return picClock(+m[1], +m[2]);
  if (/(^|[^а-яё])час(ов|а|ы)?([^а-яё]|$)|минут/.test(s) && !/\d+\s*[·:]/.test(s)) return picClock(3, 0);
  if ((m = s.match(/(\d+)\s*%/)) && kid === 'anya') return picPct(+m[1]);
  if ((m = s.match(/(\d+)\s*%/))) return picPct(+m[1]);
  if ((m = s.match(/(\d+)\s+(\d+)\/(\d+)/))) return picPie(+m[1] * +m[3] + +m[2], +m[3]);
  if ((m = s.match(/(\d+)\/(\d+)/))) return picPie(+m[1], +m[2]);
  if ((m = s.match(/частей\D+(\d+)\D+?(\d+)/)) && /раздел/.test(s)) return picPie(+m[2], +m[1]);
  if ((m = s.match(/(\d+)\s*(см|дм|м)\s*[×x]\s*(\d+)\s*\2\s*[×x]\s*(\d+)/))) return picBox(+m[1], +m[3], +m[4], m[2]);
  if ((m = s.match(/(\d+)\s*(см|дм|м)\s*[×x]\s*(\d+)/))) return picRect(+m[1], +m[3], m[2]);
  if ((m = s.match(/[Рр]ебро куба (\d+)\s*(\S+)/))) return picBox(+m[1], +m[1], +m[1], m[2].replace(/\.$/, ''));
  if ((m = s.match(/[Дд]лина[^\d]*(\d+)\s*(см|дм|м)[^\d]*ширина[^\d]*(\d+)/))) return picRect(+m[1], +m[3], m[2]);
  if ((m = s.match(/[Пп]ериметр квадрата\D*(\d+)\s*(см|дм|м)/))) return picRect(+m[1] / 4, +m[1] / 4, m[2], '?');
  if ((m = s.match(/[Сс]торона квадрата\D*(\d+)\s*(см|дм|м)/))) return picRect(+m[1], +m[1], m[2], true);
  if ((m = s.match(/(Прямой|Развёрнутый) угол[^\d]*(\d+)°/))) return picAngle(+m[2], m[1] === 'Прямой' ? 90 : 180);
  if ((m = s.match(/среднее арифметическое:\s*([\d,\s]+)/))) { const v = m[1].split(/,\s*/).map(Number).filter(x => x > 0); if (v.length >= 2 && v.length <= 8) return picBars(v); }
  if ((m = s.match(/Округли (\d+[,.]\d+) до (десятых|сотых|целых)/))) { const v = PX.num(m[1]), st = { 'десятых': .1, 'сотых': .01, 'целых': 1 }[m[2]]; return picLine(v, st); }
  if ((m = s.match(/Сравни:\s*(\d{1,3}(?:[\s\u00a0]\d{3})+)\s*\?\s*(\d{1,3}(?:[\s\u00a0]\d{3})+)/))) return `<div class="stack">${picPlace(m[1])}${picPlace(m[2])}</div>`;
  if ((m = s.match(/(?:числе|Округли)\s*(\d{1,3}(?:[\s\u00a0]\d{3})+)/))) return picPlace(m[1]);
  if ((m = s.match(/(?:в числе|Запиши десятичной дробью:?)\s*(\d+,\d+)/))) return picPlace(m[1]);
  if ((m = s.match(/(\d+,\d+)\s*([+−·:-])\s*(\d+(?:,\d+)?)/)) && kid === 'anya') return `<div class="pair">${picPlace(m[1])}<b>${m[2]}</b>${picPlace(m[3])}</div>`;
  if ((m = s.match(/(\d+)\s*(дм|см)(?![а-яё])/)) && kid === 'yarik' && !/\d+\s*м(?![а-яё])/.test(s)) { const cm = m[2] === 'дм' ? +m[1] * 10 : +m[1]; const m2 = s.match(/(\d+)\s*(дм|см)(?![а-яё]).*?(\d+)\s*(дм|см)(?![а-яё])/); const v = m2 ? Math.max(...[[+m2[1], m2[2]], [+m2[3], m2[4]]].map(([n, u]) => u === 'дм' ? n * 10 : n)) : cm; if (v <= 60 && v > 0) return picRuler(v); }
  if ((m = s.match(/(\d+)\s*(дм|см|м)(?![а-яё]).*?(\d+)\s*(дм|см|м)(?![а-яё])/)) && kid === 'yarik') { const cm = (n, u) => u === 'м' ? n * 100 : u === 'дм' ? n * 10 : n; const v = Math.max(cm(+m[1], m[2]), cm(+m[3], m[4])); if (v <= 60) return picRuler(v); }
  if ((m = s.match(/^(.*?)\b(\d*)\s*x\s*([+−-])\s*(\d+)\s*=\s*(\d+)/)) || (m = s.match(/(\d+)\s*([+−-])\s*x\s*=\s*(\d+)/))) {
    const eq = s.match(/[^.:]*x[^.]*=\s*\d+/); if (eq) { const [l, r] = eq[0].split('='); return picScale(l.trim().replace(/^.*?:\s*/, '').replace(/^Реши уравнение\s*/, ''), r.trim()); } }
  if ((m = s.match(/(\d+)\s*x\s*=\s*(\d+)/))) return picScale(m[1] + 'x', m[2]);
  if (kid === 'yarik') {
    if ((m = s.match(/(\d+)\s*([·:])\s*(\d+)\s*=\s*\?/))) { const a = +m[1], b = +m[3]; return m[2] === '·' ? picArray(a, b, '🔵') : picArray(a, b, '🔵', true); }
    if ((m = s.match(/(\d+)\s*·\s*(\d+)/)) && +m[1] <= 10 && +m[2] <= 10) return picArray(+m[1], +m[2], '🔵');
    if ((m = s.match(/(\d+)\s*([+−-])\s*(\d+)\s*=\s*\?/)) && +m[1] <= 100 && +m[3] <= 100) return picTens([+m[1], +m[3]], m[2]);
    if ((m = s.match(/Сравни числа:\s*(\d+)\s*\?\s*(\d+)/))) return picTens([+m[1], +m[2]], '?');
    if ((m = s.match(/в числе (\d+)/)) && +m[1] <= 100) return picTens([+m[1]], '');
    if ((m = s.match(/(\d+)\s*дес\.\s*(\d+)\s*ед/))) return picTens([+m[1] * 10 + +m[2]], '');
    if ((m = s.match(/(\d+)\s+[а-яё]+\s+разложили[^\d]+по\s+(\d+)/))) { const e = wordPics(s, 1)[0] || '🔵'; return picArray(+m[1] / +m[2], +m[2], e); }
    const ns = (s.match(/\d+/g) || []).map(Number); const e = wordPics(s, 1)[0];
    if (e && ns.length >= 2 && ns[0] <= 20 && ns[1] <= 20) return `<div class="groups">${ns.slice(0, 2).map(n => `<span class="grp">${e.repeat(n)}</span>`).join('<b>?</b>')}</div>`;
  }
  return '';
}

/* Главная функция: рисунок к заданию */
function illus(kid, subj, t){
  const q = (t.q || '').replace(/<[^>]+>/g, ' ');
  if (/[\u{1F300}-\u{1FAFF}]{3,}/u.test(q)) return ''; /* в задании уже есть картинки */
  if (subj === 'math') { const m = mathPic(kid, t.q || ''); if (m) return `<div class="illus">${m}</div>`; }
  const q2 = String(t.a).length <= 3 && /_/.test(q) ? q.replace(/_+/, t.a) : q;
  const w = picWords(q2);
  return w ? `<div class="illus">${w}</div>` : '';
}

function findUnit(kid, subj, val){
  const c = KIDS[kid].cur[subj]; if (!c || !c.units) return null; const v = String(val).toLowerCase().trim();
  for (const [track, list] of [['', c.units], ['_alt', c.alt || []]]) { const i = list.findIndex(u => u.id.toLowerCase() === v || u.t.toLowerCase().includes(v)); if (i >= 0) return { key: subj + track, i }; }
  return null;
}
function subjByName(kid, name){ const n = String(name || '').toLowerCase(); for (const [k, c] of Object.entries(KIDS[kid].cur)) if (k === n || c.name.toLowerCase().startsWith(n) || (c.altName && c.altName.toLowerCase().startsWith(n))) return k; return null; }
function applyCfg(rows){
  for (const row of rows) {
    const kid = /ан/i.test(row.kid) ? 'anya' : /яр/i.test(row.kid) ? 'yarik' : null; if (!kid || !row.id) continue;
    const K = S.kids[kid]; if (K.applied.includes(row.id)) continue;
    const type = String(row.type || '').toLowerCase();
    if (type.startsWith('тем')) { const s = subjByName(kid, row.subj); const f = s && findUnit(kid, s, row.value); if (f) K.pos[f.key] = f.i; }
    else if (type.startsWith('дз')) K.hwText.push({ id: row.id, text: String(row.value), done: false });
    else if (type.startsWith('сооб')) K.msgs.push({ id: row.id, text: String(row.value), seen: false });
    else if (type.startsWith('монет')) K.coins += Number(row.value) || 0;
    else if (type.startsWith('чтен')) { const n = Number(row.value); if (n > 0) K.readWords = n; }
    K.applied.push(row.id);
  }
  save(); if (cur.kid) render();
}

/* ===== Помощники по программе ===== */
function track(subj, ds){ const c = cur.K().cur[subj]; return c && c.alt && (U.dayNum(ds) % 2 === 1) ? '_alt' : ''; }
function unitsOf(kid, subj, tr){ const c = KIDS[kid].cur[subj]; return tr === '_alt' ? c.alt : c.units; }
function unitAt(kid, subj, tr){ const list = unitsOf(kid, subj, tr); const K = S.kids[kid]; let i = K.pos[subj + tr] || 0;
  if (i >= list.length) { /* программа пройдена — повторяем самые слабые темы */ const w = list.map((u, j) => [j, acc(K, u.id)]).sort((a, b) => a[1] - b[1]); i = w[0][0]; }
  return { u: list[i], i, total: list.length }; }
function acc(K, uid){ const s = K.stats[uid]; return s && s.n ? s.ok / s.n : 1; }
function genTasks(unit, seed, n){ const r = U.rng(seed); const out = []; const seen = new Set(); let guard = 0;
  while (out.length < n && guard++ < n * 12) { const t = unit.g(r); if (seen.has(t.q)) continue; seen.add(t.q); if (t.k === 'c') t.opts = r.shuffle([t.a, ...t.w]); out.push(t); }
  return out; }
function grade(x){ return x >= .9 ? 5 : x >= .75 ? 4 : x >= .5 ? 3 : 2; }
function dayRec(kid, ds){ const K = S.kids[kid]; if (!K.days[ds]) K.days[ds] = { les:{}, bonus:false }; return K.days[ds]; }
function nTasks(kid, subj){ return Math.max(3, KIDS[kid].n + (S.kids[kid].lvl[subj] || 0) + (S.kids[kid].extraN || 0)); }

function say(text, lang){ try { const s = window.speechSynthesis; if (!s) return; s.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = lang || 'ru-RU'; const vs = s.getVoices(); const v = vs.find(v => v.lang === u.lang) || vs.find(v => v.lang && v.lang.startsWith(u.lang.slice(0, 2))); if (v) u.voice = v; u.rate = lang && lang.startsWith('ru') ? .9 : .85; s.speak(u); } catch (e) {} }
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const normW = w => w.toLowerCase().replace(/ё/g, 'е').replace(/[^\p{L}\p{N}]/gu, '');
function lev(a, b){ const m = a.length, n = b.length; if (!m) return n; if (!n) return m; let p = Array.from({ length: n + 1 }, (_, j) => j); for (let i = 1; i <= m; i++) { const c = [i]; for (let j = 1; j <= n; j++) c[j] = Math.min(p[j] + 1, c[j - 1] + 1, p[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); p = c; } return p[n]; }
function sim(a, b){ if (a === b) return true; if (Math.abs(a.length - b.length) > 2) return false; const d = lev(a, b); return d <= (b.length >= 7 ? 2 : b.length >= 4 ? 1 : 0); }
function align(T, spoken){ const st = new Array(T.length).fill(0); let p = 0, extra = 0;
  for (const s of spoken) { if (!s) continue; let f = -1; for (let j = p; j < Math.min(T.length, p + 5); j++) if (T[j] && sim(s, T[j])) { f = j; break; }
    if (f < 0) { extra++; continue; } for (let k = p; k < f; k++) st[k] = T[k].length <= 2 ? 1 : 2; st[f] = 1; p = f + 1; }
  return { st, p, extra }; }

/* ----- Баллы: 1 балл = 1 минута игры. За день максимум 60: 50 за уроки по качеству + 10 за безупречный день ----- */

const PH_STEP = { warm:'Разминка', read:'Читаю вслух', silent:'Читаю сам', retell:'Пересказ', qs:'Вопросы', survey:'Отзыв', done:'Отзыв' };

    case 'prdone': { const K = S.kids[kid]; if (cur.prSel.length < 3) { alertMsg('Выбери хотя бы 3 приза'); break; }
      const all = prizeIdeas(kid).concat(cur.prOwn), old = K.shop || [];
      K.shop = cur.prSel.map(id => { const o = old.find(x => x.id === id); if (o) return o; const it = all.find(x => x.id === id); return it ? Object.assign({}, it) : null; }).filter(Boolean);
      const fresh = K.shop.filter(x => !old.some(o => o.id === x.id)); K.prizesSet = true;
      ev(kid, 'призы выбраны', { text: K.shop.map(x => x.name + (x.price == null ? ' (нужна цена)' : ` — ${x.price}`)).join('; ') });
      save(); go(cur.prBack || 'home'); break; }
    case 'saveunits': for (const kd of ['yarik', 'anya']) for (const [k, c] of Object.entries(KIDS[kd].cur)) for (const tr of ['', '_alt']) { const el = document.getElementById(`sel_${kd}_${k}${tr}`); if (el) S.kids[kd].pos[k + tr] = +el.value; } save(); alertMsg('Темы сохранены'); break;
    case 'savesync': S.cfg.sync = document.getElementById('syncurl').value.trim(); save(); flush(); pull(); alertMsg('Сохранено'); break;
  }
});
function alertMsg(t){ const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2200); }
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form]'); if (!f) return; e.preventDefault(); const k = f.dataset.form;
  const val = id => (document.getElementById(id) || {}).value || '';
  if (k === 'setup') { const p = val('pp'), y = val('py'), a = val('pa'); if (![p, y, a].every(x => /^\d{4}$/.test(x))) return alertMsg('Нужно по четыре цифры'); S.parentPin = hashPin(p); S.kids.yarik.pin = hashPin(y); S.kids.anya.pin = hashPin(a); save(); go('login'); }
  if (k === 'num') answer(val('numin'));
  if (k === 'prize') { const t = val('prname').trim().slice(0, 60); if (t) { const it = { id: 'o' + Date.now(), name: t, price: null, own: true }; cur.prOwn.push(it); cur.prSel.push(it.id); render(); } }
  if (k === 'pins') { const p = val('np'), y = val('ny'), a = val('na'); if (/^\d{4}$/.test(p)) S.parentPin = hashPin(p); if (/^\d{4}$/.test(y)) S.kids.yarik.pin = hashPin(y); if (/^\d{4}$/.test(a)) S.kids.anya.pin = hashPin(a); save(); alertMsg('Коды обновлены'); render(); }
  if (k === 'hw') { const t = val('hwtext').trim(); if (t) { S.kids[cur.parentKid].hwText.push({ id: 'h' + Date.now(), text: t, done: false }); save(); alertMsg('Задание добавлено'); render(); } }
  if (k === 'coins') { const n = parseInt(val('coinadd')); if (n) { S.kids[cur.parentKid].coins += n; ev(cur.parentKid, 'монеты от родителя', { coins: S.kids[cur.parentKid].coins, price: n }); save(); alertMsg('Готово'); render(); } }
});
window.addEventListener('online', () => { flush(); pull(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { pull(); flush(); if (cur.ds !== U.today() && cur.view === 'home') render(); } });
if ('speechSynthesis' in window) try { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => {}; } catch (e) {}
render(); pull(); flush(); setInterval(() => { pull(); flush(); }, 5 * 60 * 1000);

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');
</script></body></html>
