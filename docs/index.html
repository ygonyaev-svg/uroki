<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Уроки</title>
<meta name="theme-color" content="#2350a8">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Уроки">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>:root{
  --paper:#fbfaf5; --grid:#e3e9f2; --ink:#1f2a44; --ink2:#55607a; --line:#d6dce8;
  --blue:#2350a8; --red:#c8312b; --green:#23824a; --gold:#e0a417; --gold2:#b37d00;
  --card:#ffffff; --soft:#eef2f9; --acc:#2350a8; --accsoft:#e6edfa;
  --r:16px; --sh:0 1px 2px rgba(20,30,60,.06),0 4px 14px rgba(20,30,60,.06);
}
@media (prefers-color-scheme: dark){
  :root{ --paper:#151a24; --grid:#1d2431; --ink:#e8ecf4; --ink2:#a4adc0; --line:#2c3446;
    --blue:#7ea3f0; --red:#ff7b73; --green:#5fcf8c; --gold:#f2bd3c; --gold2:#f2bd3c;
    --card:#1c2230; --soft:#232b3b; --acc:#7ea3f0; --accsoft:#223150; --sh:none; }
}
.yarik{ --acc:#d9620f; --accsoft:#fdeee2; }
.anya{ --acc:#0f8a84; --accsoft:#def3f1; }
@media (prefers-color-scheme: dark){ .yarik{ --acc:#ff9a52; --accsoft:#3a2a1e; } .anya{ --acc:#4fd0c6; --accsoft:#173634; } }

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html{ -webkit-text-size-adjust:100%; }
body{ margin:0; color:var(--ink); font:18px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PT Sans",sans-serif;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px; min-height:100vh; padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
h1{ font-size:30px; line-height:1.2; margin:.2em 0 .4em; }
h2{ font-size:21px; margin:.2em 0 .5em; }
h3{ font-size:17px; margin:1em 0 .4em; color:var(--ink2); }
button,input,select,textarea{ font:inherit; color:inherit; }
.wrap{ max-width:860px; margin:0 auto; padding:16px 16px 60px; }
.wrap.narrow{ max-width:520px; }
.card{ background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:18px 20px; margin:14px 0; box-shadow:var(--sh); }
.hero{ padding:20px 0 6px; }
.eyebrow{ text-transform:uppercase; letter-spacing:.08em; font-size:13px; font-weight:600; color:var(--acc); margin:0; }
.hint{ color:var(--ink2); font-size:15px; }
.center{ text-align:center; }
.row{ display:flex; flex-wrap:wrap; gap:8px; margin:6px 0; }

.btn{ appearance:none; border:0; border-radius:12px; background:var(--acc); color:#fff; font-weight:600; padding:12px 20px; min-height:48px; cursor:pointer; }
.btn:disabled{ opacity:.45; cursor:default; }
.btn.big{ display:block; width:100%; font-size:20px; padding:16px 20px; min-height:60px; margin:14px 0; }
.btn.small{ padding:8px 14px; min-height:40px; font-size:16px; }
.btn.ghost{ background:var(--accsoft); color:var(--acc); }
.btn.mic{ background:var(--green); }
.btn.stop{ background:var(--red); }
.btn:active{ transform:translateY(1px); }
.link{ appearance:none; border:0; background:none; color:var(--acc); font-weight:600; padding:10px 4px; cursor:pointer; }
.chip{ appearance:none; border:1.5px solid var(--line); background:var(--card); border-radius:999px; padding:9px 16px; min-height:44px; cursor:pointer; }
.chip.on{ border-color:var(--acc); background:var(--accsoft); color:var(--acc); font-weight:600; }

.bar{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:4px 0; }
.coins{ display:inline-flex; align-items:center; gap:6px; background:var(--card); border:1px solid var(--line); border-radius:999px; padding:6px 14px; font-size:18px; }
.coin{ display:inline-block; width:20px; height:20px; border-radius:50%; background:radial-gradient(circle at 35% 35%,#ffe28a,var(--gold) 60%,var(--gold2)); box-shadow:inset 0 0 0 2px rgba(0,0,0,.08); vertical-align:-4px; }

/* вход */
.kids{ display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:16px; margin:18px 0; }
.kidcard{ display:grid; justify-items:center; gap:4px; padding:28px 16px; border-radius:22px; border:2px solid var(--acc); background:var(--card); cursor:pointer; box-shadow:var(--sh); }
.avatar{ width:96px; height:96px; border-radius:50%; background:var(--acc); color:#fff; font-size:52px; font-weight:700; display:grid; place-items:center; }
.kn{ font-size:28px; font-weight:700; }
.kg{ color:var(--ink2); }
.kc{ display:inline-flex; align-items:center; gap:6px; margin-top:6px; }
.pinbox{ display:grid; justify-items:center; gap:18px; margin-top:10px; }
.dots{ display:flex; gap:16px; }
.dots i{ width:20px; height:20px; border-radius:50%; border:2px solid var(--ink2); }
.dots i.on{ background:var(--ink); border-color:var(--ink); }
.pad{ display:grid; grid-template-columns:repeat(3,84px); gap:14px; }
.pad span{ display:block; }
.key{ width:84px; height:84px; border-radius:50%; border:1px solid var(--line); background:var(--card); font-size:30px; font-weight:600; cursor:pointer; box-shadow:var(--sh); }
.key:active{ background:var(--soft); }

/* главная */
.hello h1{ margin-bottom:0; }
.hello p{ margin:.2em 0 .6em; color:var(--ink2); }
.prog{ height:10px; border-radius:99px; background:var(--soft); overflow:hidden; }
.prog i{ display:block; height:100%; background:var(--acc); border-radius:99px; transition:width .4s; }
.note{ background:#fff7d6; color:#4a3b00; border:1px solid #f0dc8a; border-radius:12px; padding:12px 16px; margin:12px 0; }
@media (prefers-color-scheme: dark){ .note{ background:#3a3214; color:#f3e3a3; border-color:#5c4f1d; } }
.tiles{ display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:12px; margin:18px 0; }
.tile{ position:relative; display:flex; align-items:center; gap:14px; text-align:left; background:var(--card); border:1.5px solid var(--line); border-radius:var(--r); padding:16px; min-height:92px; cursor:pointer; box-shadow:var(--sh); }
.tile.main{ border-color:var(--acc); }
.tile.done{ opacity:.75; }
.ico{ flex:none; width:56px; height:56px; border-radius:14px; background:var(--accsoft); color:var(--acc); display:grid; place-items:center; font-weight:700; font-size:19px; }
.tt{ display:grid; gap:2px; min-width:0; }
.sn{ font-weight:700; }
.sn em{ font-style:normal; font-size:12px; background:var(--acc); color:#fff; border-radius:6px; padding:1px 6px; margin-left:4px; vertical-align:2px; }
.ut{ color:var(--ink2); font-size:15px; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
.state{ margin-left:auto; font-size:13px; color:var(--acc); font-weight:600; }
.mark,.bigmark{ font-family:"Caveat","Marker Felt","Segoe Print",cursive; color:var(--red); font-weight:700; }
.mark{ margin-left:auto; font-size:42px; line-height:1; transform:rotate(-8deg); }
.m2{ color:var(--ink2); }
.card.win{ border-color:var(--green); text-align:center; }
.speeds{ display:flex; flex-wrap:wrap; gap:8px; }
.speeds span{ background:var(--soft); border-radius:10px; padding:4px 10px; font-size:15px; }

/* урок */
.steps{ display:flex; gap:6px; list-style:none; padding:0; margin:0 0 10px; flex-wrap:wrap; }
.steps li{ font-size:14px; padding:4px 12px; border-radius:99px; background:var(--soft); color:var(--ink2); }
.steps li.now{ background:var(--acc); color:#fff; font-weight:600; }
.steps li.ok{ background:var(--accsoft); color:var(--acc); }
.steps li.ok::before{ content:"✓ "; }
.theory .th{ font-size:19px; }
.theory .th b,.theory .th strong{ color:var(--acc); }
.theory table{ border-collapse:collapse; margin:8px 0; }
.theory td,.theory th{ border:1px solid var(--line); padding:4px 10px; }
.vw{ appearance:none; border:1px solid var(--line); background:var(--soft); border-radius:10px; padding:6px 12px; margin:3px; cursor:pointer; }
.src{ font-size:14px; color:var(--ink2); margin:4px 2px; }
.author{ color:var(--ink2); margin-top:-8px; }
.counter{ font-size:15px; color:var(--ink2); margin-top:8px; }
.task .q{ font-size:24px; line-height:1.4; margin:4px 0 14px; }
.gap{ display:inline-block; min-width:44px; border-bottom:2px solid var(--acc); color:var(--acc); text-align:center; }
.opts{ display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px; }
.opt{ appearance:none; border:2px solid var(--line); background:var(--card); border-radius:14px; padding:14px; min-height:60px; font-size:21px; cursor:pointer; }
.opt:disabled{ cursor:default; }
.opt.right{ border-color:var(--green); background:rgba(35,130,74,.12); color:var(--green); font-weight:700; }
.opt.wrong{ border-color:var(--red); color:var(--red); text-decoration:line-through; opacity:.8; }
.numf{ display:flex; gap:10px; }
.numf input{ flex:1; min-width:0; font-size:26px; padding:10px 14px; border:2px solid var(--line); border-radius:12px; background:var(--card); }
.numf input:focus{ outline:none; border-color:var(--acc); }
.fb{ margin-top:14px; padding:12px 14px; border-radius:12px; }
.fb.ok{ background:rgba(35,130,74,.12); color:var(--green); }
.fb.bad{ background:rgba(200,49,43,.1); color:var(--red); }
.fb.bad .hint{ color:var(--ink2); }
.fb.try{ background:var(--soft); }
.survey textarea{ width:100%; margin-top:6px; padding:10px; border:1.5px solid var(--line); border-radius:12px; background:var(--card); }
.free{ display:block; margin-top:14px; color:var(--ink2); font-size:15px; }
.result{ text-align:center; }
.bigmark{ font-size:110px; line-height:1; transform:rotate(-6deg); display:inline-block; }
.earn{ display:inline-flex; gap:6px; align-items:center; font-size:20px; }
.check{ display:flex; gap:10px; align-items:center; padding:8px 0; font-size:19px; }
.check input{ width:26px; height:26px; }

/* чтение */
.warm{ display:flex; flex-wrap:wrap; gap:10px; margin:10px 0; }
.ww{ appearance:none; border:1.5px solid var(--acc); background:var(--accsoft); color:var(--ink); border-radius:12px; padding:10px 16px; font-size:22px; cursor:pointer; }
.reading .text,.peek .text{ font-size:26px; line-height:1.75; font-family:Georgia,"PT Serif","Times New Roman",serif; }
.anya .reading .text{ font-size:22px; }
.text p{ margin:0 0 .6em; }
.w{ border-radius:5px; padding:0 1px; transition:background .2s; }
.w.r1{ color:var(--green); }
.w.r2{ background:rgba(200,49,43,.15); color:var(--red); text-decoration:underline wavy; }
.w.rc{ background:var(--accsoft); outline:2px solid var(--acc); }
.rest summary,.peek summary{ cursor:pointer; color:var(--acc); font-weight:600; padding:8px 0; }
.rest{ margin-top:12px; color:var(--ink2); }
.readbar{ position:sticky; bottom:0; padding:8px 0 calc(8px + env(safe-area-inset-bottom)); background:linear-gradient(transparent,var(--paper) 30%); }
.readbar .btn.big{ margin:6px 0; }
.rstat{ display:block; text-align:center; color:var(--ink2); }
.readres{ display:flex; flex-wrap:wrap; gap:10px; margin:6px 0; }
.readres span{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:8px 14px; }
.readres b{ font-size:22px; color:var(--acc); }

/* магазин */
.shop{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; }
.item{ display:grid; gap:10px; margin:0; }
.iname{ font-weight:600; }
.price{ display:inline-flex; gap:6px; align-items:center; font-size:20px; }
.plain{ padding-left:20px; }

/* родителям */
.tabs{ display:flex; gap:6px; margin:10px 0; border-bottom:1px solid var(--line); }
.tab{ appearance:none; border:0; background:none; padding:10px 14px; border-bottom:3px solid transparent; cursor:pointer; color:var(--ink2); }
.tab.on{ border-color:var(--acc); color:var(--ink); font-weight:700; }
.tscroll{ overflow-x:auto; }
table{ border-collapse:collapse; width:100%; font-size:15px; }
th,td{ text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
th{ color:var(--ink2); font-weight:600; }
.form label{ display:block; margin:10px 0; color:var(--ink2); font-size:15px; }
.form input,.form select,.shoprow input{ display:block; width:100%; margin-top:4px; padding:10px 12px; border:1.5px solid var(--line); border-radius:10px; background:var(--card); font-size:18px; color:var(--ink); }
.shoprow{ display:grid; grid-template-columns:1fr 90px auto; gap:8px; align-items:center; margin:6px 0; }
.shoprow input{ margin:0; }
.toast{ position:fixed; left:50%; bottom:30px; transform:translateX(-50%); background:var(--ink); color:var(--paper); padding:12px 20px; border-radius:12px; z-index:9; }

@media (max-width:520px){
  body{ font-size:17px; } h1{ font-size:25px; }
  .task .q{ font-size:21px; } .reading .text{ font-size:22px; }
  .pad{ grid-template-columns:repeat(3,72px); } .key{ width:72px; height:72px; }
}

/* картинки и интересы */
.kb{ font-size:26px; letter-spacing:4px; }
.banner{ display:flex; justify-content:space-around; font-size:34px; margin:6px 0 -6px; }
.banner span{ display:inline-block; animation:bob 3s ease-in-out infinite; }
@keyframes bob{ 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-6px) rotate(-6deg) } }
@media (prefers-reduced-motion: reduce){ .banner span{ animation:none; } }
.task{ position:relative; }
.sticker{ position:absolute; top:-18px; right:12px; font-size:40px; transform:rotate(12deg); }
.pic{ display:inline-block; font-size:34px; letter-spacing:2px; line-height:1.3; }
.cheer{ font-size:28px; font-weight:700; color:var(--acc); margin-bottom:6px; }
.anya .hello h1,.anya .cheer{ font-family:Georgia,"PT Serif",serif; }
.anya .card.task{ border-color:#cdbf98; }
.tile.locked{ opacity:.45; filter:grayscale(.6); }
.tile.locked .ico::after{ content:"🔒"; position:absolute; font-size:16px; transform:translate(22px,-22px); }
.tile.locked .ico{ position:relative; }
.rtell{ min-height:4em; margin-top:10px; padding:10px 12px; border:1.5px dashed var(--acc); border-radius:12px; color:var(--ink2); font-size:17px; }
.note.warn{ background:#fff4e0; color:#7a4a00; }
@media (prefers-color-scheme: dark){ .note.warn{ background:#3a2c12; color:#ffd99a; } }
.card.example{ background:var(--accsoft); margin-top:12px; }
.card.example h3{ margin-top:0; }
.task .link[data-act="dunnotask"]{ display:block; margin-top:12px; }
.illus{ margin:12px 0 4px; display:flex; justify-content:center; }
.pic{ max-width:100%; height:auto; color:var(--ink); }
.pic.tens,.pic.arr{ max-height:200px; } .pic.pie,.pic.pct,.pic.clock,.pic.angle,.pic.bars,.pic.box{ max-height:190px; } .pic.scale{ max-height:170px; } .pic.rect{ max-height:200px; }
.wpics{ display:flex; gap:14px; justify-content:center; font-size:64px; line-height:1.1; }
.wpics span{ background:var(--soft); border-radius:18px; padding:6px 12px; }
.task .wpics{ font-size:58px; }
.groups{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; justify-content:center; font-size:26px; }
.groups .grp{ background:var(--soft); border-radius:12px; padding:6px 10px; max-width:260px; word-break:break-all; }
.scenebar{ margin:-18px -20px 12px; border-radius:16px 16px 0 0; overflow:hidden; line-height:0; }
.scenebar .pic{ width:100%; height:auto; display:block; }
.coverwrap{ margin:0 0 14px; border-radius:16px; overflow:hidden; line-height:0; box-shadow:0 2px 10px rgba(0,0,0,.12); }
.coverwrap .pic{ width:100%; height:auto; display:block; }
.pair{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:center; } .pair b{ font-size:28px; } .pic.place{ max-height:110px; } .pic.line{ max-height:110px; }
.illus .pic{ max-width:100%; height:auto; }
.stack{ display:flex; flex-direction:column; align-items:center; gap:6px; }
.pair .pic{ max-width:46%; }
.prizes{ display:flex; flex-wrap:wrap; gap:8px; margin:14px 0; }
.prizes .chip{ font-size:16px; }
</style></head>

<script>/* ve5b637b4 */
/* ===== Общие утилиты ===== */
const U = {
  h(s){ let h = 2166136261; for (const c of String(s)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; },
  rng(seed){
    let a = typeof seed === 'number' ? seed : U.h(seed);
    const f = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
    f.int = (x, y) => x + Math.floor(f() * (y - x + 1));
    f.pick = arr => arr[Math.floor(f() * arr.length)];
    f.shuffle = arr => { arr = arr.slice(); for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(f() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
    f.sample = (arr, n) => f.shuffle(arr).slice(0, n);
    return f;
  },
  pl(n, one, few, many){ const m10 = n % 10, m100 = n % 100; if (m10 === 1 && m100 !== 11) return one; if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few; return many; },
  dec(x){ return String(Math.round(x * 1000) / 1000).replace('.', ','); },
  big(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); },
  esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); },
  today(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); },
  dayNum(ds){ const [y, m, d] = ds.split('-').map(Number); return Math.floor(Date.UTC(y, m - 1, d) / 864e5); },
  addDays(ds, n){ const [y, m, d] = ds.split('-').map(Number); const t = new Date(Date.UTC(y, m - 1, d + n)); return t.toISOString().slice(0, 10); },
  roman(n){ const r = [[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']]; let s = ''; for (const [v, c] of r) while (n >= v) { s += c; n -= v; } return s; },
  gcd(a, b){ while (b) [a, b] = [b, a % b]; return Math.abs(a); }
};

/* ===== Конструкторы заданий =====
   k:'c' — выбор ответа, k:'n' — число. q — вопрос (html), a — ответ, w — неверные, e — пояснение */
function C(q, a, w, e){ a = String(a); const ws = []; for (const x of w) { const s = String(x); if (s !== a && !ws.includes(s)) ws.push(s); } return { k: 'c', q, a, w: ws.slice(0, 3), e: e || '' }; }
function N(q, a, e){ return { k: 'n', q, a: Number(a), e: e || '' }; }
function cmp(a, b){ return a > b ? '>' : a < b ? '<' : '='; }
function CMP(q, x, y, e){ const s = cmp(x, y); return C(q, s, ['>', '<', '='].filter(z => z !== s), e); }
/* Банк: строки "вопрос|ответ|неверный1;неверный2;неверный3|пояснение" */
function B(lines){
  const items = lines.map(l => { const [q, a, w, e] = l.split('|'); return { q, a, w: (w || '').split(';').filter(Boolean), e }; });
  return r => { const it = r.pick(items); return C(it.q, it.a, it.w, it.e); };
}
/* Несколько генераторов вперемешку */
function MIX(...gs){ return r => r.pick(gs)(r); }
/* Неверные числовые ответы рядом с правильным */
function near(a, r, steps){ steps = steps || [1, 2, 10, -1, -2, -10, 5, -5]; const out = []; for (const s of r.shuffle(steps)) { const v = a + s; if (v >= 0 && v !== a && !out.includes(v)) out.push(v); if (out.length === 3) break; } return out; }

/* ===== Ярик, 2 класс. Математика — по учебнику М. И. Моро и др. (1986) ===== */
const Y_MATH = [
 { id:'m2_1', t:'Числа от 1 до 100. Десятки и единицы',
   th:'Число 47 состоит из <b>4 десятков</b> и <b>7 единиц</b>. Десятки пишут слева, единицы справа.<br>10 единиц = 1 десяток. 10 десятков = 1 сотня (100).<br>Сравнивая числа, сначала смотрим на десятки: 52 &gt; 48, потому что 5 дес. больше 4 дес.',
   g: r => { const t = r.int(0,3), n = r.int(11,99), d = Math.floor(n/10), u = n%10;
     if (t===0) return N(`Сколько десятков в числе ${n}?`, d, `${n} = ${d} дес. ${u} ед.`);

     const a = r.int(10,99), b = r.int(10,99); return CMP(`Сравни числа: ${a} ? ${b}`, a, b, 'Сначала сравниваем десятки, потом единицы.'); } },
 { id:'m2_2', t:'Сложение и вычитание без перехода через десяток',
   th:'Десятки складываем с десятками, единицы — с единицами:<br>34 + 25 = (30 + 20) + (4 + 5) = 50 + 9 = <b>59</b>.<br>Так же вычитаем: 68 − 23 = (60 − 20) + (8 − 3) = 40 + 5 = <b>45</b>.',
   g: r => { if (r()<.5) { const d1=r.int(1,7), d2=r.int(1,9-d1), u1=r.int(0,8), u2=r.int(0,9-u1), a=d1*10+u1, b=d2*10+u2; return N(`${a} + ${b} = ?`, a+b, `${d1*10} + ${d2*10} = ${(d1+d2)*10}, ${u1} + ${u2} = ${u1+u2}`); }
     const a = r.int(3,9)*10 + r.int(1,9), u1 = a%10, b = r.int(1,Math.floor(a/10)-1)*10 + r.int(0,u1); return N(`${a} − ${b} = ?`, a-b, `Десятки: ${Math.floor(a/10)} − ${Math.floor(b/10)}, единицы: ${u1} − ${b%10}`); } },
 { id:'m2_3', t:'Единицы длины: сантиметр, дециметр, метр',
   th:'<b>1 дм = 10 см</b>, <b>1 м = 10 дм = 100 см</b>.<br>4 дм 6 см = 40 см + 6 см = 46 см.<br>Чтобы сравнить длины, переводим их в одинаковые единицы.',
   g: r => { const t = r.int(0,4);

     if (t===2) { const d=r.int(1,9), c=r.int(1,9); return N(`${d} дм ${c} см = ? см`, d*10+c, `${d*10} см + ${c} см`); }

 { id:'m2_4', t:'Сложение с переходом через десяток',
   th:'38 + 7: дополняем до круглого числа. 38 + 2 = 40, и ещё 5 — получается <b>45</b>.<br>Столбиком: 8 + 7 = 15, пишем 5 единиц, а 1 десяток добавляем к десяткам.',
   g: r => { const u1=r.int(2,9), u2=r.int(10-u1,9), d1=r.int(1,7), d2=r.int(0,8-d1), a=d1*10+u1, b=d2*10+u2; return N(`${a} + ${b} = ?`, a+b, `${u1} + ${u2} = ${u1+u2}: пишем ${(u1+u2)%10}, 1 десяток запоминаем`); } },
 { id:'m2_5', t:'Вычитание с переходом через десяток',
   th:'52 − 7: сначала вычтем 2, получим 50, потом ещё 5 — получится <b>45</b>.<br>Столбиком: из 2 нельзя вычесть 7, занимаем 1 десяток: 12 − 7 = 5.',
   g: r => { const d1=r.int(2,9), u1=r.int(0,8), u2=r.int(u1+1,9), d2=r.int(0,d1-1), a=d1*10+u1, b=d2*10+u2; return N(`${a} − ${b} = ?`, a-b, `Занимаем десяток: ${10+u1} − ${u2} = ${10+u1-u2}`); } },
 { id:'m2_6', t:'Уравнения: найди неизвестное число',
   th:'x + 8 = 15. Чтобы найти неизвестное слагаемое, из суммы вычитаем известное слагаемое: x = 15 − 8 = <b>7</b>.<br>Неизвестное уменьшаемое = разность + вычитаемое: x − 5 = 9, x = 14.<br>Неизвестное вычитаемое = уменьшаемое − разность: 20 − x = 12, x = 8.',

 { id:'m2_7', t:'Задачи в два действия',
   th:'Читаем задачу, находим, что известно и что нужно узнать. Если сразу ответить нельзя, сначала находим недостающее число.<br><i>В одной корзине 10 кг яблок, в другой на 4 кг меньше. Сколько в двух корзинах?</i><br>1) 10 − 4 = 6 (кг) — во второй; 2) 10 + 6 = <b>16</b> (кг).',

     r => { const a=r.int(5,15), b=r.int(2,9), c=r.int(2,a+b-1); return N(`На остановке стояли ${a} человек. Подошли ещё ${b}, а ${c} сели в автобус. Сколько человек осталось на остановке?`, a+b-c, `1) ${a} + ${b} = ${a+b}; 2) ${a+b} − ${c} = ${a+b-c}`); },
     r => { const a=r.int(2,6)*5, b=r.int(3,9)*5; return N(`Мама купила хлеб за ${a} центов и молоко за ${b} центов. Она дала 1 евро (100 центов). Сколько центов сдачи она получила?`, 100-a-b, `1) ${a} + ${b} = ${a+b}; 2) 100 − ${a+b} = ${100-a-b}`); },
     r => { const a=r.int(30,60), b=r.int(10,a-5), c=r.int(5,30); return N(`В бочке было ${a} вёдер воды. На полив взяли ${b} вёдер, потом долили ${c}. Сколько вёдер воды стало в бочке?`, a-b+c, `1) ${a} − ${b} = ${a-b}; 2) ${a-b} + ${c} = ${a-b+c}`); },
     r => { const a=r.int(6,15), b=r.int(2,a-2); return N(`Саша сделал ${a} корабликов, а Миша на ${b} меньше. Сколько корабликов сделали мальчики вместе?`, 2*a-b, `1) ${a} − ${b} = ${a-b}; 2) ${a} + ${a-b} = ${2*a-b}`); },
     r => { const a=r.int(20,40), b=r.int(10,25), c=r.int(10, a+b-5); return N(`Аня придумала ${a} слов, Ира ${b} слов, а Серёжа на ${c} слов меньше, чем Аня и Ира вместе. Сколько слов придумал Серёжа?`, a+b-c, `1) ${a} + ${b} = ${a+b}; 2) ${a+b} − ${c} = ${a+b-c}`); }
   ) },
 { id:'m2_8', t:'Периметр',
   th:'<b>Периметр</b> — это сумма длин всех сторон фигуры.<br>У прямоугольника противоположные стороны равны: P = 5 + 3 + 5 + 3 = 16 см.<br>У квадрата все 4 стороны равны: P = 4 + 4 + 4 + 4 = 16 см.',

     r => { const a=r.int(4,15), b=r.int(2,a-1); return N(`Длина прямоугольника ${a} см, ширина ${b} см. Найди периметр.`, 2*(a+b), `${a} + ${b} + ${a} + ${b}`); },

     r => { const a=r.int(2,9); return N(`Периметр квадрата ${4*a} см. Какова длина его стороны?`, a, `У квадрата 4 равные стороны: ${4*a} : 4`); }
   ) },
 { id:'m2_9', t:'Время: часы и минуты',
   th:'<b>1 ч = 60 мин</b>, <b>1 сутки = 24 ч</b>, <b>1 мин = 60 с</b>.<br>Полчаса = 30 мин, четверть часа = 15 мин.<br>Короткая стрелка часов — часовая, длинная — минутная.',
   g: MIX(

     r => { const h=r.int(8,15), m=r.pick([0,10,15,20,30]), d=r.pick([20,25,35,40,45]); const t=h*60+m+d; const f=x=>`${Math.floor(x/60)} ч ${String(x%60).padStart(2,'0')} мин`; return C(`Урок начался в ${f(h*60+m)} и длился ${d} мин. Когда он закончился?`, f(t), [f(t+5), f(t-10), f(t+60)], `${f(h*60+m)} + ${d} мин`); },
     r => { const h=r.int(9,17), m=r.pick([10,20,30,40,50]), d=r.pick([15,20,25,35,40,45]); const s=h*60+m, e=s+d, f=x=>`${Math.floor(x/60)}:${String(x%60).padStart(2,'0')}`; return N(`Мультфильм начался в ${f(s)} и закончился в ${f(e)}. Сколько минут он шёл?`, d, `От ${f(s)} до ${f(e)}`); },
     B(['Сколько часов в сутках?|24|12;60;100|1 сутки = 24 часа','Сколько минут в половине часа?|30|15;50;60|60 : 2 = 30','Сколько минут в четверти часа?|15|25;30;4|60 : 4 = 15','Сколько секунд в минуте?|60|100;30;24|1 мин = 60 с'])
   ) },
 { id:'m2_10', t:'Что такое умножение',
   th:'Если складываем <b>одинаковые</b> числа, можно записать короче — умножением:<br>3 + 3 + 3 + 3 = 3 · 4 = 12. Первое число — что складываем, второе — сколько раз.<br>От перестановки множителей произведение не меняется: 3 · 4 = 4 · 3.',

     r => { const a=r.int(2,9), b=r.int(2,9); return N(`${a} · ${b} = ${b} · ?`, a, 'От перестановки множителей произведение не меняется'); }
   ) },
 { id:'m2_11', t:'Таблица умножения на 2 и 3. Деление',
   th:'<b>Деление</b> — действие, обратное умножению.<br>3 · 4 = 12, значит 12 : 3 = 4 и 12 : 4 = 3.<br>Выучи: 2 · 2 = 4, 2 · 3 = 6, … 3 · 3 = 9, 3 · 4 = 12, 3 · 5 = 15 … 3 · 10 = 30.',
   g: r => { const a=r.pick([2,3]), b=r.int(2,10); return r()<.55 ? N(`${a} · ${b} = ?`, a*b, `${a} · ${b} = ${a*b}`) : N(`${a*b} : ${a} = ?`, b, `${a} · ${b} = ${a*b}`); } },
 { id:'m2_12', t:'Порядок действий и скобки',
   th:'Сначала выполняем действия <b>в скобках</b>.<br>Потом <b>умножение и деление</b>, затем <b>сложение и вычитание</b> — по порядку слева направо.<br>5 + 2 · 3 = 5 + 6 = 11, а (5 + 2) · 3 = 7 · 3 = 21.',

     r => { const a=r.int(1,5), b=r.int(1,5), c=r.int(2,3); return N(`(${a} + ${b}) · ${c} = ?`, (a+b)*c, `Сначала скобки: ${a+b}`); },

   ) },
 { id:'m2_13', t:'Таблица умножения на 4 и 5',
   th:'4 · 2 = 8, 4 · 3 = 12, 4 · 4 = 16, 4 · 5 = 20, 4 · 6 = 24, 4 · 7 = 28, 4 · 8 = 32, 4 · 9 = 36.<br>5 · 2 = 10, 5 · 3 = 15, … 5 · 9 = 45. Произведение на 5 всегда оканчивается на 0 или 5.',
   g: r => { const a=r.pick([4,5]), b=r.int(2,10); return r()<.55 ? N(`${a} · ${b} = ?`, a*b) : N(`${a*b} : ${a} = ?`, b, `${a} · ${b} = ${a*b}`); } },
 { id:'m2_14', t:'Таблица умножения на 6, 7, 8, 9',
   th:'Самые трудные: 6 · 7 = 42, 6 · 8 = 48, 7 · 7 = 49, 7 · 8 = 56, 8 · 8 = 64, 8 · 9 = 72, 9 · 9 = 81.<br>Подсказка для 9: 9 · 6 = 54 — сумма цифр ответа всегда 9.',
   g: r => { const a=r.int(6,9), b=r.int(2,10); return r()<.55 ? N(`${a} · ${b} = ?`, a*b) : N(`${a*b} : ${a} = ?`, b, `${a} · ${b} = ${a*b}`); } },
 { id:'m2_15', t:'Задачи на умножение и деление',
   th:'<i>По 4 в 5 рядов</i> — умножение: 4 · 5 = 20.<br><i>20 разложили по 4</i> — деление: 20 : 4 = 5.<br><i>В 3 раза больше</i> — умножаем, <i>в 3 раза меньше</i> — делим.',

     r => { const a=r.int(2,6), n=r.int(2,8); return N(`${a*n} яблок разложили в пакеты по ${a}. Сколько получилось пакетов?`, n, `${a*n} : ${a}`); },
     r => { const a=r.int(2,9), n=r.int(2,4); return N(`У Ани ${a} ${U.pl(a,'марка','марки','марок')}, а у Ярика в ${n} раза больше. Сколько марок у Ярика?`, a*n, `${a} · ${n}`); },
     r => { const n=r.int(2,5), a=r.int(2,9); return N(`Уменьши ${a*n} в ${n} ${U.pl(n,'раз','раза','раз')}.`, a, `${a*n} : ${n}`); }
   ) }
];

function ptNum(n){ const D = PT_UNITS_DATA; if (n < 20) return D[10][n]; if (n < 100) { const t = Math.floor(n / 10), u = n % 10; return D.T[t] + (u ? ' e ' + D[10][u] : ''); } if (n === 100) return 'cem'; const h = Math.floor(n / 100), rest = n % 100; return D.H[h] + (rest ? ' e ' + ptNum(rest) : ''); }
function vocabGen(words, lname){ lname = lname || 'по-португальски';
  return r => { const [pt, ru, em] = r.pick(words); const others = words.filter(w => w[0] !== pt); const t = r.int(0, 2);
    if (t === 0) return Object.assign(C(`Что значит <span class="pt">${pt}</span>?`, ru, r.sample(others, 3).map(w => w[1]), `${pt} — ${ru}`), { sp: pt });
    if (t === 1) return Object.assign(C(`Как ${lname} «${ru}»? <span class="em">${em || ''}</span>`, pt, r.sample(others, 3).map(w => w[0]), `${ru} — ${pt}`), { sp: pt, spAfter: true });
    return Object.assign(C(`Послушай и выбери перевод 🔊`, ru, r.sample(others, 3).map(w => w[1]), `${pt} — ${ru}`), { sp: pt, auto: true }); };
}
function vocabTheory(words, intro){ return (intro ? intro + '<br>' : '') + '<div class="vocab">' + words.map(([pt, ru, em]) => `<button class="vw" data-say="${U.esc(pt)}"><span class="em">${em || ''}</span> <b>${pt}</b> — ${ru}</button>`).join('') + '</div><p class="hint">Нажми на слово, чтобы послушать.</p>'; }

 { id:'r5_14', t:'Разряды местоимений',
   th:'Личные: я, ты, он. Возвратное: себя. Притяжательные: мой, твой, свой. Вопросительные: кто? что? какой? Указательные: этот, тот, такой. Определительные: весь, каждый, сам. Отрицательные: никто, ничего. Неопределённые: кто-то, некто.',

 { id:'r5_16', t:'Наклонения глагола',

 { id:'y6', title:'Ветер и Солнце', author:'К. Д. Ушинский (по Эзопу)',
   text:'Однажды Солнце и сердитый северный Ветер затеяли спор о том, кто из них сильнее. Долго спорили они и, наконец, решились померяться силами над путешественником, который в это самое время ехал верхом по большой дороге.\n— Посмотри, — сказал Ветер, — как я налечу на него: мигом сорву с него плащ.\nСказал — и начал дуть что было мочи. Но чем более старался Ветер, тем крепче закутывался путешественник в свой плащ: он ворчал на непогоду, но ехал всё дальше и дальше. Ветер сердился, свирепел, осыпал бедного путника дождём и снегом; путешественник надел свой плащ в рукава и подвязался поясом. Тут уж Ветер и сам убедился, что ему плаща не сдёрнуть.\nСолнце, видя бессилие своего соперника, улыбнулось, выглянуло из-за облаков, обогрело, осушило землю, а вместе с тем и бедного полузамёрзшего путешественника. Почувствовав теплоту солнечных лучей, он приободрился, сам снял свой плащ, свернул его и привязал к седлу.\n— Видишь ли, — сказало тогда кроткое Солнце сердитому Ветру, — лаской и добротой можно сделать гораздо более, чем гневом.',
   qs:[['О чём спорили Солнце и Ветер?','кто из них сильнее','кто красивее','кто раньше встаёт','куда поедет путник'],['Что делал путник, когда дул Ветер?','крепче закутывался в плащ','снимал плащ','прятался в доме','бежал домой'],['Какой вывод в конце?','лаской и добротой можно сделать больше, чем гневом','сильнее всех ветер','плащ не нужен','солнце всегда за тучами']] },
 { id:'y7', title:'Дельфины', author:'',
   text:'Дельфины живут в море, но они не рыбы. Дельфины дышат воздухом, как люди. Поэтому они часто поднимаются к поверхности, чтобы вдохнуть.\nДельфины живут большими семьями — стаями. Они «разговаривают» друг с другом свистом и щелчками. У каждого дельфина есть свой свист, как имя.\nУ берегов Португалии, в устье реки Саду возле города Сетубал, живёт целая стая дельфинов. Туда приезжают люди, чтобы посмотреть на них с лодки.',
   qs:[['Чем дышат дельфины?','воздухом','водой','жабрами','они не дышат'],['Как дельфины «разговаривают»?','свистом и щелчками','лаем','песнями птиц','никак'],['Где в Португалии живёт стая дельфинов?','в устье реки Саду у Сетубала','в Лиссабоне в фонтане','на вершине горы','в озере на Азорах']] },
 { id:'y8', title:'Лев и собачка', author:'Л. Н. Толстой',
   text:'В Лондоне показывали диких зверей и за смотренье брали деньгами или собаками и кошками на корм диким зверям.\nОдному человеку захотелось поглядеть зверей: он ухватил на улице собачонку и принёс её в зверинец. Его пустили смотреть, а собачонку взяли и бросили в клетку ко льву на съеденье.\nСобачка поджала хвост и прижалась в угол клетки. Лев подошёл к ней и понюхал её.\nСобачка легла на спину, подняла лапки и стала махать хвостиком.\nЛев тронул её лапой и перевернул.\nСобачка вскочила и стала перед львом на задние лапки.\nЛев смотрел на собачку, поворачивал голову со стороны на сторону и не трогал её.\nКогда хозяин бросил льву мяса, лев оторвал кусок и оставил собачке.\nВечером, когда лев лёг спать, собачка легла подле него и положила свою голову ему на лапу.\nС тех пор собачка жила в одной клетке со львом, лев не трогал её, ел корм, спал с ней вместе, а иногда играл с ней.\nТак прожили лев и собачка целый год в одной клетке.',
   qs:[['В каком городе был зверинец?','в Лондоне','в Лиссабоне','в Москве','в Париже'],['Что сделал лев, когда ему бросили мясо?','оторвал кусок и оставил собачке','съел всё сам','отдал хозяину','не стал есть'],['Сколько времени лев и собачка прожили вместе в этом отрывке?','целый год','один день','неделю','десять лет'],['Какими стали лев и собачка?','друзьями','врагами','чужими','соседями, которые ссорились']] },
 { id:'y9', title:'Почему листья желтеют', author:'',
   text:'Летом листья зелёные. Им помогает особое вещество — хлорофилл. С его помощью лист ловит солнечный свет и делает из него пищу для дерева.\nОсенью дни становятся короче, солнца меньше. Дерево готовится к зиме и перестаёт делать хлорофилл. Зелёный цвет исчезает, и становятся видны жёлтые и оранжевые краски, которые прятались в листе всё лето.\nПотом листья опадают, а дерево отдыхает до весны.',
   qs:[['Какое вещество делает листья зелёными?','хлорофилл','сок','краска','вода'],['Почему осенью листья меняют цвет?','солнца меньше, и дерево перестаёт делать хлорофилл','их красят птицы','от дождя','от ветра'],['Где были жёлтые краски летом?','прятались в листе','в корнях','в земле','их не было']] },
 { id:'y10', title:'Прыжок', author:'Л. Н. Толстой',
   text:'Один корабль обошёл вокруг света и возвращался домой. Была тихая погода, весь народ был на палубе. Посреди народа вертелась большая обезьяна и забавляла всех.\nОна подпрыгнула к двенадцатилетнему мальчику, сыну капитана корабля, сорвала с его головы шляпу, надела и живо взобралась на мачту. Все засмеялись, а мальчик остался без шляпы и сам не знал, смеяться ли ему или плакать.\nОбезьяна села на первой перекладине мачты, сняла шляпу и стала зубами и лапами рвать её. Мальчик погрозил ей и крикнул на неё, но она ещё злее рвала шляпу. Матросы громче стали смеяться, а мальчик покраснел, скинул куртку и бросился за обезьяной на мачту.\nТак обезьяна и мальчик добрались до самого верха. Обезьяна повесила шляпу на край последней перекладины. Мальчик бросил мачту и ступил на перекладину. Все замерли от страха: стоило ему только оступиться — и он бы разбился о палубу.\nВ это время капитан корабля, отец мальчика, вышел из каюты. Он увидал сына на мачте и тотчас закричал: «В воду! Прыгай сейчас в воду!» Мальчик размахнулся и прыгнул.\nТочно пушечное ядро, шлёпнуло тело мальчика в море, и не успели волны закрыть его, как уже двадцать молодцов-матросов спрыгнули с корабля в море. Его схватили и вытащили на корабль. Через несколько минут мальчик стал дышать.\nКогда капитан увидал это, он вдруг закричал, как будто его что-то душило, и убежал к себе в каюту, чтоб никто не видал, как он плачет.',
   qs:[['Что сделала обезьяна?','сорвала шляпу с мальчика','украла еду','прыгнула в море','разбудила капитана'],['Куда велел прыгнуть капитан?','в воду','на палубу','на соседнюю мачту','в лодку'],['Почему капитан приказал прыгать в воду?','с перекладины нельзя было вернуться, а упасть на палубу — разбиться','он хотел наказать сына','чтобы мальчик искупался','чтобы поймать обезьяну'],['Почему капитан убежал в каюту?','чтобы никто не видел, как он плачет','он рассердился','ему стало скучно','его позвали обедать']] },
 { id:'y11', title:'Воробьишко', author:'М. Горький',
   text:'Жил-был желторотый воробей, звали его Пудик, а жил он над окошком бани, за верхним наличником, в тёплом гнезде из пакли, моховинок и других мягких материалов. Летать он ещё не пробовал, но уже крыльями махал и всё выглядывал из гнезда: хотелось поскорее узнать — что такое мир и годится ли он для него?\n— Что, что? — спрашивала его воробьиха-мама.\nОн потряхивал крыльями и, глядя на землю, чирикал:\n— Чересчур черна, чересчур!\nПудик не верил маме; он ещё не знал, что если маме не верить, это плохо кончится. Он сидел на самом краю гнезда и во всё горло распевал стихи собственного сочинения. Пел, пел да и вывалился из гнезда, а воробьиха за ним, а кошка — рыжая, зелёные глаза — тут как тут.\nИспугался Пудик, растопырил крылья, качается на сереньких ногах и чирикает. А воробьиха отталкивает его в сторону, перья у неё дыбом встали — страшная, храбрая, клюв раскрыла — в глаз кошке целит.\n— Прочь, прочь! Лети, Пудик, лети на окно, лети…\nСтрах приподнял с земли воробьишку, он подпрыгнул, замахал крыльями — раз, раз и — на окне! Тут и мама подлетела — без хвоста, но в большой радости, села рядом с ним, клюнула его в затылок.\n— Ну что ж! — сказал Пудик. — Всему сразу не научишься!',
   qs:[['Как звали воробья?','Пудик','Чик','Барсик','Пушок'],['Где было гнездо?','над окошком бани','на берёзе','под крышей школы','в скворечнике'],['Кто спас Пудика от кошки?','мама-воробьиха','папа-воробей','собака','мальчик'],['Что потеряла мама-воробьиха?','хвост','крыло','гнездо','голос']] },
 { id:'y12', title:'Муравьи-строители', author:'',
   text:'Муравьи маленькие, но очень сильные. Муравей может поднять груз в двадцать раз тяжелее себя.\nВ муравейнике у каждого своя работа. Одни муравьи строят ходы, другие приносят еду, третьи охраняют вход. Главная в муравейнике — царица. Она откладывает яйца.\nМуравейник похож на подземный город с комнатами и коридорами. Зимой муравьи закрывают входы и спят глубоко под землёй.',
   qs:[['Во сколько раз тяжелее себя груз может поднять муравей?','в двадцать','в два','в сто','в пять'],['Кто откладывает яйца?','царица','охранник','строитель','никто'],['Что делают муравьи зимой?','закрывают входы и спят под землёй','улетают на юг','строят новый муравейник','собирают грибы']] }

 { id:'a1', title:'Волк и Ягнёнок', author:'И. А. Крылов',
   text:'У сильного всегда бессильный виноват:\nТому в Истории мы тьму примеров слышим,\nНо мы Истории не пишем;\nА вот о том как в Баснях говорят.\nЯгнёнок в жаркий день зашёл к ручью напиться;\nИ надобно ж беде случиться,\nЧто около тех мест голодный рыскал Волк.\nЯгнёнка видит он, на добычу стремится;\nНо, делу дать хотя законный вид и толк,\nКричит: «Как смеешь ты, наглец, нечистым рылом\nЗдесь чистое мутить питьё\nМоё\nС песком и с илом?\nЗа дерзость такову\nЯ голову с тебя сорву».\n«Когда светлейший Волк позволит,\nОсмелюсь я донесть, что ниже по ручью\nОт Светлости его шагов я на сто пью;\nИ гневаться напрасно он изволит:\nПитья мутить ему никак я не могу».\n«Поэтому я лгу!\nНегодный! слыхана ль такая дерзость в свете!\nДа помнится, что ты ещё в запрошлом лете\nМне здесь же как-то нагрубил:\nЯ этого, приятель, не забыл!»\n«Помилуй, мне ещё и отроду нет году», —\nЯгнёнок говорит. «Так это был твой брат». —\n«Нет братьев у меня». — «Так это кум иль сват\nИ, словом, кто-нибудь из вашего же роду».\n«Ах, я чем виноват?» — «Молчи! устал я слушать,\nДосуг мне разбирать вины твои, щенок!\nТы виноват уж тем, что хочется мне кушать».\nСказал и в тёмный лес Ягнёнка поволок.',

 { id:'a2', title:'Край земли', author:'',
   text:'Если поехать из Лиссабона на запад, через час дороги окажешься на мысе Рока — самой западной точке континентальной Европы. Дальше только Атлантический океан.\nСкалы здесь поднимаются над водой почти на сто сорок метров, а ветер бывает таким сильным, что трудно стоять на ногах. На памятном камне высечены слова поэта Луиша де Камоэнса: «Здесь, где земля кончается и начинается море».\nПятьсот лет назад отсюда смотрели на горизонт люди, которые не знали, что лежит за океаном. Сегодня рядом с мысом стоит маяк. Его свет виден за десятки километров и помогает кораблям не разбиться о скалы в тумане.',
   qs:[['Чем знаменит мыс Рока?','это самая западная точка континентальной Европы','там самая высокая гора','там начинается река Тежу','там жил Камоэнс'],['Чьи слова высечены на камне?','поэта Луиша де Камоэнса','Васко да Гамы','короля Португалии','неизвестного моряка'],['Зачем у мыса нужен маяк?','чтобы корабли не разбились о скалы в тумане','для красоты','чтобы туристы фотографировали','чтобы освещать дорогу машинам']] },
 { id:'a3', title:'Квартет', author:'И. А. Крылов',
   text:'Проказница-Мартышка,\nОсёл,\nКозёл\nДа косолапый Мишка\nЗатеяли сыграть Квартет.\nДостали нот, баса, альта, две скрипки\nИ сели на лужок под липки, —\nПленять своим искусством свет.\nУдарили в смычки, дерут, а толку нет.\n«Стой, братцы, стой! — кричит Мартышка. — Погодите!\nКак музыке идти? Ведь вы не так сидите.\nТы с басом, Мишенька, садись против альта,\nЯ, прима, сяду против вторы;\nТогда пойдёт уж музыка не та:\nУ нас запляшут лес и горы!»\nРасселись, начали Квартет;\nОн всё-таки на лад нейдёт.\n«Постойте ж, я сыскал секрет! —\nКричит Осёл, — мы, верно, уж поладим,\nКоль рядом сядем».\nПослушались Осла: уселись чинно в ряд;\nА всё-таки Квартет нейдёт на лад.\nВот пуще прежнего пошли у них разборы\nИ споры,\nКому и как сидеть.\nСлучилось Соловью на шум их прилететь.\nТут с просьбой все к нему, чтоб их решить сомненье.\n«Пожалуй, — говорят, — возьми на час терпенье,\nЧтобы Квартет в порядок наш привесть:\nИ ноты есть у нас, и инструменты есть,\nСкажи лишь, как нам сесть!» —\n«Чтоб музыкантом быть, так надобно уменье\nИ уши ваших понежней, —\nИм отвечает Соловей, —\nА вы, друзья, как ни садитесь,\nВсё в музыканты не годитесь».',
   qs:[['Кто затеял сыграть квартет?','Мартышка, Осёл, Козёл и Мишка','Соловей и Мартышка','Волк и Ягнёнок','Лиса и Журавль'],['Что музыканты меняли, чтобы музыка пошла?','как сидеть','инструменты','ноты','место — ушли в лес'],['Что сказал Соловей?','чтобы быть музыкантом, нужно уменье и чуткий слух','садитесь в круг','купите новые скрипки','играйте громче'],['Над чем смеётся басня?','над теми, кто подменяет умение пустыми переменами','над музыкой','над соловьями','над лесом']] },
 { id:'a4', title:'Пробковый дуб', author:'',
   text:'Португалия — главный в мире производитель пробки. Её получают из коры пробкового дуба. Удивительно, но дерево при этом не срубают. Кору аккуратно снимают вручную специальным топориком, и через девять лет она вырастает снова.\nПервый раз кору снимают, когда дереву исполнится около двадцати пяти лет, а живёт пробковый дуб около двухсот лет. Из пробки делают не только затычки для бутылок, но и полы, обувь, сумки и даже детали для космических кораблей: пробка лёгкая, не пропускает воду и хорошо защищает от жары.\nНа стволе каждого дерева белой краской пишут последнюю цифру года, когда сняли кору, чтобы знать, когда приходить снова.',

 { id:'a5', title:'Кавказский пленник (начало)', author:'Л. Н. Толстой',

   text:'Девочка Дороти жила в канзасской степи вместе с дядей Генри, тётей Эм и чёрным пёсиком Тото. Их домик был маленьким, в одну комнату, а вокруг на много миль тянулась серая выжженная солнцем трава.\nОднажды небо потемнело, и с севера донёсся низкий вой ветра. «Циклон идёт!» — крикнул дядя Генри. Тётя Эм бросилась к люку в погреб, а Тото испугался и забился под кровать. Дороти побежала за ним — и в этот миг дом вздрогнул, закружился и медленно поднялся в воздух.\nЦиклон нёс домик, как пёрышко. Сначала Дороти было страшно, но часы шли, а ничего не случалось. Тогда она легла на кровать, обняла Тото и уснула.\nПроснулась она от сильного толчка. В окно светило яркое солнце. Дороти открыла дверь и ахнула: вокруг были зелёные луга, высокие деревья с чудесными плодами, пели птицы с ярким оперением и журчал ручей. Это была волшебная Страна Оз.',
   qs:[['Как звали пёсика Дороти?','Тото','Тим','Джек','Шарик'],['Почему Дороти не успела спрятаться в погреб?','побежала за Тото','спала','была в поле','потеряла ключ'],['Что сделала Дороти во время полёта?','уснула','плакала всё время','выпрыгнула','звала на помощь'],['Чем новая страна отличалась от Канзаса?','она была яркой и цветущей','там была зима','там не было солнца','она была пустой']] },
 { id:'ao2', title:'Алиса и Чеширский Кот', author:'Л. Кэрролл, пересказ',
   text:'Алиса шла по лесу и вдруг увидела на ветке дерева Кота. Кот улыбался до ушей.\n«Скажите, пожалуйста, куда мне отсюда идти?» — вежливо спросила Алиса.\n«А куда ты хочешь попасть?» — ответил Кот.\n«Мне всё равно…»\n«Тогда всё равно, куда идти», — заметил Кот.\n«…только бы попасть куда-нибудь», — пояснила Алиса.\n«Куда-нибудь ты обязательно попадёшь, — сказал Кот. — Нужно только достаточно долго идти».\nПотом Кот сказал, что в одной стороне живёт Шляпник, а в другой — Мартовский Заяц, и оба они не в своём уме. «Здесь все не в своём уме, — добавил он. — И я, и ты». И Кот стал медленно исчезать: сначала хвост, потом лапы, потом туловище. Последней исчезла улыбка. Она ещё долго висела в воздухе.\n«Кота без улыбки я видела много раз, — подумала Алиса. — А вот улыбку без кота — впервые!»',
   qs:[['Где сидел Кот?','на ветке дерева','на крыше','у реки','на стуле'],['Что ответил Кот, когда Алисе было всё равно, куда попасть?','тогда всё равно, куда идти','иди направо','иди к королеве','оставайся здесь'],['Что исчезло последним?','улыбка','хвост','глаза','уши'],['Какая мысль главная в разговоре?','надо знать, куда хочешь прийти','коты умеют говорить','в лесу опасно','надо слушаться взрослых']] },
 { id:'ao3', title:'Снежная королева. Осколок зеркала', author:'Г. Х. Андерсен, пересказ',
   text:'Жил-был злой тролль. Однажды он сделал зеркало, в котором всё доброе и красивое казалось маленьким и некрасивым, а всё плохое — большим и важным. Ученики тролля понесли зеркало на небо, чтобы посмеяться над ангелами, но оно задрожало, выскользнуло и разбилось на миллионы осколков.\nКрошечные осколки разлетелись по всему свету. Если такой осколок попадал человеку в глаз, тот начинал видеть во всём только плохое. А если в сердце — сердце становилось холодным, как лёд.\nВ большом городе жили мальчик Кай и девочка Герда. Они не были братом и сестрой, но любили друг друга, как родные. Летом они сидели в садике на крыше, где в ящиках росли розы, а зимой грели на печке медные монетки и прикладывали к замёрзшему стеклу, чтобы сделать круглое окошко.\nОднажды Кай вскрикнул: «Ой! Что-то кольнуло меня в сердце! И в глаз попало!» Осколок зеркала попал прямо в него. Кай стал грубым и насмешливым, а розы назвал противными. Скоро за ним приедут сани Снежной королевы…',
   qs:[['Что делало зеркало тролля?','показывало доброе плохим','исполняло желания','показывало будущее','делало людей невидимыми'],['Что происходило, если осколок попадал в сердце?','сердце становилось ледяным','человек засыпал','человек летал','сердце болело один день'],['Что росло в садике на крыше?','розы','яблоки','тюльпаны','кактусы'],['Как изменился Кай?','стал грубым и насмешливым','заболел','стал добрее','уехал к бабушке']] }
);

const BOOK_TXT = {"sh1": "Первый осенний холод, от которого пожелтела трава, привел всех птиц в большую тревогу. Все начали готовиться в далекий путь, и все имели такой серьезный, озабоченный вид. Да, нелегко перелететь пространство в несколько тысяч верст… Сколько бедных птиц дорогой выбьются из сил, сколько погибнут от разных случайностей, — вообще было о чем серьезно подумать.\nСерьезная большая птица, как лебеди, гуси и утки, собирались в дорогу с важным видом, сознавая всю трудность предстоящего подвига; а более всех шумели, суетились и хлопотали маленькие птички, как кулички-песочники, кулички-плавунчики, чернозобики, черныши, зуйки. Они давно уже собирались стайками и переносились с одного берега на другой по отмелям и болотам с такой быстротой, точно кто бросил горсть гороху. У маленьких птичек была такая большая работа…\nЛес стоял темный и молчаливый, потому что главные певцы улетели, не дожидаясь холода.\n— И куда эта мелочь торопится! — ворчал старый Селезень, не любивший себя беспокоить. — В свое время все улетим… Не понимаю, о чем тут беспокоиться.\n— Ты всегда был лентяем, поэтому тебе и неприятно смотреть на чужие хлопоты, — объяснила его жена, старая Утка.\n— Я был лентяем? Ты просто несправедлива ко мне, и больше ничего. Может быть, я побольше всех забочусь, а только не показываю вида. Толку от этого немного, если буду бегать с утра до ночи по берегу, кричать, мешать другим, надоедать всем.\nУтка вообще была не совсем довольна своим супругом, а теперь окончательно рассердилась:\n— Ты посмотри на других-то, лентяй! Вон наши соседи, гуси или лебеди, — любо на них посмотреть. Живут душа в душу… Небось лебедь или гусь не бросит своего гнезда и всегда впереди выводка. Да, да… А тебе до детей и дела нет. Только и думаешь о себе, чтобы набить зоб. Лентяй, одним словом… Смотреть-то на тебя даже противно!\n— Не ворчи, старуха!.. Ведь я ничего но говорю, что у тебя такой неприятный характер. У всякого есть свои недостатки… Я не виноват, что гусь — глупая птица и поэтому нянчится со своим выводком. Вообще мое правило — не вмешиваться в чужие дела. Зачем? Пусть всякий живет по-своему.\nСелезень любил серьезные рассуждения, причем оказывалось как-то так, что именно он, Селезень, всегда прав, всегда умен и всегда лучше всех. Утка давно к этому привыкла, а сейчас волновалась по совершенно особенному случаю.\n— Какой ты отец? — накинулась она на мужа. — Отцы заботятся о детях, а тебе — хоть трава не расти!..\n— Ты это о Серой Шейке говоришь? Что же я могу поделать, если она не может летать? Я не виноват…\nСерой Шейкой они называли свою калеку-дочь, у которой было переломлено крыло еще весной, когда подкралась к выводку Лиса и схватила утенка. Старая Утка смело бросилась на врага и отбила утенка; но одно крылышко оказалось сломанным.\n— Даже и подумать страшно, как мы покинем здесь Серую Шейку одну, — повторяла Утка со слезами. — Все улетят, а она останется одна-одинешенька. Да, совсем одна… Мы улетим на юг, в тепло, а она, бедняжка, здесь будет мерзнуть… Ведь она наша дочь, и как я ее люблю, мою Серую Шейку! Знаешь, старик, останусь-ка я с ней зимовать здесь вместе…\n— А другие дети?\n— Те здоровы, обойдутся и без меня.\nСелезень всегда старался замять разговор, когда речь заходила о Серой Шейке. Конечно, он тоже любил ее, но зачем же напрасно тревожить себя? Ну, останется, ну, замерзнет, — жаль, конечно, а все-таки ничего не поделаешь. Наконец, нужно подумать и о других детях. Жена вечно волнуется, а нужно смотреть на вещи серьезно. Селезень про себя жалел жену, но не понимал в полной мере ее материнского горя. Уж лучше было бы, если бы тогда Лиса совсем съела Серую Шейку, — ведь все равно она должна погибнуть зимой.", "sh2": "Старая Утка ввиду близившейся разлуки относилась к дочери-калеке с удвоенной нежностью. Бедняжка еще не знала, что такое разлука и одиночество, и смотрела на сборы других в дорогу с любопытством новичка. Правда, ей иногда делалось завидно, что ее братья и сестры так весело собираются к отлету, что они будут опять где-то там, далеко-далеко, где не бывает зимы.\n— Ведь вы весной вернетесь? — спрашивала Серая Шейка у матери.\n— Да, да, вернемся, моя дорогая… И опять будем жить все вместе.\nДля утешения начинавшей задумываться Серой Шейки мать рассказала ей несколько таких же случаев, когда утки оставались на зиму. Она была лично знакома с двумя такими парами.\n— Как-нибудь, милая, пробьешься, — успокаивала старая Утка. — Сначала поскучаешь, а потом привыкнешь. Если бы можно было тебя перенести на теплый ключ, что и зимой не замерзает, — совсем было бы хорошо. Это недалеко отсюда… Впрочем, что же и говорить-то попусту, все равно нам не перенести тебя туда!\n— Я буду все время думать о вас… — повторяла бедная Серая Шейка. — Все буду думать: где вы, что вы делаете, весело ли вам? Все равно и будет, точно и я с вами вместе.\nСтарой Утке нужно было собрать все силы, чтобы не выдать своего отчаяния. Она старалась казаться веселой и плакала потихоньку ото всех. Ах, как ей было жаль милой, бедненькой Серой Шейки… Других детей она теперь почти не замечала и не обращала на них внимания, и ей казалось, что она даже совсем их не любит.\nА как быстро летело время… Был уже целый ряд холодных утренников, а от инея пожелтели березки и покраснели осины. Вода в реке потемнела, и сама река казалась больше, потому что берега оголели, — береговая поросль быстро теряла листву. Холодный осенний ветер обрывал засыхавшие листья и уносил их. Небо часто покрывалось тяжелыми осенними облаками, ронявшими мелкий осенний дождь. Вообще хорошего было мало, и который день уже неслись мимо стаи перелетной птицы… Первыми тронулись болотные птицы, потому что болота уже начинали замерзать. Дольше всех оставались водоплавающие. Серую Шейку больше всех огорчал перелет журавлей, потому что они так жалобно курлыкали, точно звали ее с собой. У нее еще в первый раз сжалось сердце от какого-то тайного предчувствия, и она долго провожала глазами уносившуюся в небе журавлиную стаю.\n«Как им, должно быть, хорошо», — думала Серая Шейка.\nЛебеди, гуси и утки тоже начинали готовиться к отлету. Отдельные гнезда соединялись в большие стаи. Старые и бывалые птицы учили молодых. Каждое утро эта молодежь с веселым криком делала большие прогулки, чтобы укрепить крылья для далекого перелета. Умные вожаки сначала обучали отдельные партии, а потом всех вместе. Сколько было крика, молодого веселья и радости… Одна Серая Шейка не могла принимать участия в этих прогулках и любовалась ими только издали. Что делать, приходилось мириться со своей судьбой. Зато как она плавала, как ныряла! Вода для нее составляла все.\n— Нужно отправляться… пора! — говорили старики вожаки. — Что нам здесь ждать?\nА время летело, быстро летело… Наступил и роковой день. Вся стая сбилась в одну живую кучу на реке. Это было ранним осенним утром, когда вода еще была покрыта густым туманом. Утиный косяк сбился из трехсот штук. Слышно было только кряканье главных вожаков. Старая Утка не спала всю ночь, — это была последняя ночь, которую она проводила вместе с Серой Шейкой.\n— Ты держись вон около того берега, где в реку сбегает ключик, — советовала она. — Там вода не замерзнет целую зиму…\nСерая Шейка держалась в стороне от косяка, как чужая… Да, все были так заняты общим отлетом, что на нее никто не обращал внимания. У старой Утки изболелось все сердце, глядя на бедную Серую Шейку. Несколько раз она решала про себя, что останется; но как останешься, когда есть другие дети и нужно лететь вместе с косяком?..\n— Ну, трогай! — громко скомандовал главный вожак, и стая поднялась разом вверх.\nСерая Шейка осталась на реке одна и долго провожала глазами улетавший косяк. Сначала все летели одной живой кучей, а потом вытянулись в правильный треугольник и скрылись.\n«Неужели я совсем одна? — думала Серая Шейка, заливаясь слезами. — Лучше бы было, если бы тогда Лиса меня съела…»", "sh3": "Река, на которой осталась Серая Шейка, весело катилась в горах, покрытых густым лесом. Место было глухое, и никакого жилья кругом. По утрам вода у берегов начинала замерзать, а днем тонкий, как стекло, лед таял.\n«Неужели вся река замерзнет?» — думала Серая Шейка с ужасом.\nСкучно ей было одной, и она все думала про своих улетевших братьев и сестер. Где-то они сейчас? Благополучно ли долетели? Вспоминают ли про нее? Времени было достаточно, чтобы подумать обо всем. Узнала она и одиночество. Река была пуста, и жизнь сохранялась только в лесу, где посвистывали рябчики, прыгали белки и зайцы. Раз со скуки Серая Шейка забралась в лес и страшно перепугалась, когда из-под куста кубарем вылетел Заяц.\n— Ах, как ты меня напугала, глупая! — проговорил Заяц, немного успокоившись. — Душа в пятки ушла… И зачем ты толчешься здесь? Ведь все утки давно улетели…\n— Я не могу летать: Лиса мне крылышко перекусила, когда я еще была совсем маленькой…\n— Уж эта мне Лиса!.. Нет хуже зверя. Она и до меня давно добирается… Ты берегись ее, особенно когда река покроется льдом. Как раз сцапает…\nОни познакомились. Заяц был такой же беззащитный, как и Серая Шейка, и спасал свою жизнь постоянным бегством.\n— Если бы мне крылья, как птице, так я бы, кажется, никого на свете не боялся!.. У тебя вот хоть и крыльев нет, так зато ты плавать умеешь, а не то возьмешь и нырнешь в воду, — говорил он. — А я постоянно дрожу со страху… У меня — кругом враги. Летом еще можно спрятаться куда-нибудь, а зимой все видно.\nСкоро выпал и первый снег, а река все еще не поддавалась холоду. Все, что замерзало по ночам, вода разбивала. Борьба шла не на живот, а на смерть. Всего опаснее были ясные, звездные ночи, когда все затихало и на реке не было волн. Река точно засыпала, и холод старался сковать ее льдом сонную. Так и случилось. Была тихая-тихая звездная ночь. Тихо стоял темный лес на берегу, точно стража из великанов. Горы казались выше, как это бывает ночью. Высокий месяц обливал все своим трепетным искрившимся светом. Бурлившая днем горная река присмирела, и к ней тихо-тихо подкрался холод, крепко-крепко обнял гордую, непокорную красавицу и точно прикрыл ее зеркальным стеклом. Серая Шейка была в отчаянии, потому что не замерзла только самая середина реки, где образовалась широкая полынья. Свободного места, где можно было плавать, оставалось не больше пятнадцати сажен. Огорчение Серой Шейки дошло до последней степени, когда на берегу показалась Лиса, — это была та самая Лиса, которая переломила ей крыло.\n— А, старая знакомая, здравствуй! — ласково проговорила Лиса, останавливаясь на берегу. — Давненько не видались… Поздравляю с зимой.\n— Уходи, пожалуйста, я совсем не хочу с тобой разговаривать, — ответила Серая Шейка.\n— Это за мою-то ласку! Хороша же ты, нечего сказать!.. А впрочем, про меня много лишнего говорят. Сами наделают что-нибудь, а потом на меня и свалят… Пока — до свидания!\nКогда Лиса убралась, приковылял Заяц и сказал:\n— Берегись, Серая Шейка: она опять придет.\nИ Серая Шейка тоже начала бояться, как боялся Заяц. Бедная даже не могла любоваться творившимися кругом нее чудесами. Наступила уже настоящая зима. Земля была покрыта белоснежным ковром. Не оставалось ни одного темного пятнышка. Даже голые березы, ольхи, ивы и рябины убрались инеем, точно серебристым пухом. А ели сделались еще важнее. Они стояли засыпанные снегом, как будто надели дорогую теплую шубу. Да, чудно, хорошо было кругом; а бедная Серая Шейка знала только одно, что эта красота не для нее, и трепетала при одной мысли, что ее полынья вот-вот замерзнет и ей некуда будет деться. Лиса действительно пришла через несколько дней, села на берегу и опять заговорила:\n— Соскучилась я по тебе, уточка… Выходи сюда; а не хочешь, так я сама к тебе приду. Я не спесива…\nИ Лиса принялась ползти осторожно по льду к самой полынье. У Серой Шейки замерло сердце. Но Лиса не могла подобраться к самой воде, потому что там лед был еще очень тонок. Она положила голову на передние лапки, облизнулась и проговорила:\n— Какая ты глупая, уточка… Вылезай на лед! А впрочем, до свидания! Я тороплюсь по своим делам…\nЛиса начала приходить каждый день — проведать, не застыла ли полынья. Наступившие морозы делали свое дело. От большой полыньи оставалось всего одно окно в сажень величиной. Лед был крепкий, и Лиса садилась на самом краю. Бедная Серая Шейка со страху ныряла в воду, а Лиса сидела и зло подсмеивалась над ней:\n— Ничего, ныряй, а я тебя все равно съем… Выходи лучше сама.\nЗаяц видел с берега, что проделывала Лиса, и возмущался всем своим заячьим сердцем:\n— Ах, какая бессовестная эта Лиса… Какая несчастная эта Серая Шейка! Съест ее Лиса…", "sh4": "По всей вероятности, Лиса и съела бы Серую Шейку, когда полынья замерзла бы совсем, но случилось иначе. Заяц все видел своими собственными косыми глазами.\nДело было утром. Заяц выскочил из своего логова покормиться и поиграть с другими зайцами. Мороз был здоровый, и зайцы грелись, поколачивая лапку о лапку. Хотя и холодно, а все-таки весело.\n— Братцы, берегитесь! — крикнул кто-то.\nДействительно, опасность была на носу. На опушке леса стоял сгорбленный старичок охотник, который подкрался на лыжах совершенно неслышно и высматривал, которого бы зайца застрелить.\n«Эх, теплая старухе шуба будет», — соображал он, выбирая самого крупного зайца.\nОн даже прицелился из ружья, но зайцы его заметили и кинулись в лес, как сумасшедшие.\n— Ах, лукавцы! — рассердился старичок. — Вот ужо я вас… Того не понимают, глупые, что нельзя старухе без шубы. Не мерзнуть же ей… А вы Акинтича не обманете, сколько ни бегайте. Акинтич-то похитрее будет… А старуха Акинтичу вон как наказывала: «Ты, смотри, старик, без шубы не приходи!» А вы сигать…\nСтаричок пустился разыскивать зайцев по следам, но зайцы рассыпались по лесу, как горох. Старичок порядком измучился, обругал лукавых зайцев и присел на берегу реки отдохнуть.\n— Эх, старуха, старуха, убежала наша шуба! — думал он вслух. — Ну, вот отдохну и пойду искать другую…\nСидит старичок, горюет, а тут, глядь, Лиса по реке ползет, — так и ползет, точно кошка.\n— Ге, ге, вот так штука! — обрадовался старичок. — К старухиной-то шубе воротник сам ползет… Видно, пить захотела, а то, может, и рыбки вздумала половить…\nЛиса действительно подползла к самой полынье, в которой плавала Серая Шейка, и улеглась на льду. Стариковские глаза видели плохо и из-за лисы не замечали утки.\n«Надо так ее застрелять, чтобы воротника не испортить, — соображал старик, прицеливаясь в Лису. — А то вот как старуха будет браниться, если воротник-то в дырьях окажется… Тоже своя сноровка везде надобна, а без снасти и клопа не убьешь».\nСтаричок долго прицеливался, выбирая место в будущем воротнике. Наконец грянул выстрел. Сквозь дым от выстрела охотник видел, как что-то метнулось на льду, — и со всех ног кинулся к полынье; по дороге он два раза упал, а когда добежал до полыньи, то только развел руками, — воротника как не бывало, а в полынье плавала одна перепуганная Серая Шейка.\n— Вот так штука! — ахнул старичок, разводя руками. — В первый раз вижу, как Лиса в утку обратилась. Ну, и хитер зверь.\n— Дедушка, Лиса убежала, — объяснила Серая Шейка.\n— Убежала? Вот тебе, старуха, и воротник к шубе… Что же я теперь буду делать, а? Ну и грех вышел… А ты, глупая, зачем тут плаваешь?\n— А я, дедушка, не могла улететь вместе с другими. У меня одно крылышко попорчено…\n— Ах, глупая, глупая… Да ведь ты замерзнешь тут или Лиса тебя съест! Да…\nСтаричок подумал-подумал, покачал головой и решил:\n— А мы вот что с тобой сделаем: я тебя внучкам унесу. Вот-то обрадуются… А весной ты старухе яичек нанесешь да утяток выведешь. Так я говорю? Вот то-то, глупая…\nСтаричок добыл Серую Шейку из полыньи и положил за пазуху. «А старухе я ничего не скажу, — соображал он, направляясь домой.\n— Пусть ее шуба с воротником вместе еще погуляет в лесу. Главное: внучки вот как обрадуются…»\nЗайцы все это видели и весело смеялись. Ничего, старуха и без шубы на печке не замерзнет.", "lg1": "Жила-была на свете лягушка-квакушка. Сидела она в болоте, ловила комаров да мошку, весною громко квакала вместе со своими подругами. И весь век она прожила бы благополучно — конечно, в том случае, если бы не съел её аист. Но случилось одно происшествие.\nОднажды она сидела на сучке высунувшейся из воды коряги и наслаждалась тёплым мелким дождиком.\n«Ах, какая сегодня прекрасная мокрая погода! — думала она. — Какое это наслаждение — жить на свете!»\nДождик моросил по её пёстренькой лакированной спинке; капли его подтекали ей под брюшко и за лапки, и это было восхитительно приятно, так приятно, что она чуть-чуть не заквакала, но, к счастью, вспомнила, что была уже осень и что осенью лягушки не квакают, — на это есть весна, — и что, заквакав, она может уронить своё лягушечье достоинство. Поэтому она промолчала и продолжала нежиться.\nВдруг тонкий, свистящий, прерывистый звук раздался в воздухе. Есть такая порода уток: когда они летят, то их крылья, рассекая воздух, точно поют, или, лучше сказать, посвистывают. Фью-фью-фью-фью — раздаётся в воздухе, когда летит высоко над вами стадо таких уток, а их самих даже и не видно, так они высоко летят. На этот раз утки, описав огромный полукруг, спустились и сели как раз в то самое болото, где жила лягушка.\n— Кря, кря! — сказала одна из них, — Лететь ещё далеко; надо покушать.\nИ лягушка сейчас же спряталась. Хотя она и знала, что утки не станут есть её, большую и толстую квакушку, но всё-таки, на всякий случай, она нырнула под корягу. Однако, подумав, она решилась высунуть из воды свою лупоглазую голову: ей было очень интересно узнать, куда летят утки.\n— Кря, кря! — сказала другая утка, — уже холодно становится! Скорей на юг! Скорей на юг!\nИ все утки стали громко крякать в знак одобрения.\n— Госпожи утки! — осмелилась сказать лягушка, — что такое юг, на который вы летите? Прошу извинения за беспокойство.\nИ утки окружили лягушку. Сначала у них явилось желание съесть её, но каждая из них подумала, что лягушка слишком велика и не пролезет в горло. Тогда все они начали кричать, хлопая крыльями:\n— Хорошо на юге! Теперь там тепло! Там есть такие славные тёплые болота! Какие там червяки! Хорошо на юге!\nОни так кричали, что почти оглушили лягушку. Едва-едва она убедила их замолчать и попросила одну из них, которая казалась ей толще и умнее всех, объяснить ей, что такое юг. И когда та рассказала ей о юге, то лягушка пришла в восторг, но в конце всё-таки спросила, потому что была осторожна:\n— А много ли там мошек и комаров?\n— О! целые тучи! — отвечала утка.\n— Ква! — сказала лягушка и тут же обернулась посмотреть, нет ли здесь подруг, которые могли бы услышать её и осудить за кваканье осенью. Она уж никак не могла удержаться, чтобы не квакнуть хоть разик.\n— Возьмите меня с собой!\n— Это мне удивительно! — воскликнула утка. — Как мы тебя возьмём? У тебя нет крыльев.\n— Когда вы летите? — спросила лягушка.\n— Скоро, скоро! — закричали все утки. — Кря, кря! кря! кря! Тут холодно! На юг! На юг!\n— Позвольте мне подумать только пять минут, — сказала лягушка, — я сейчас вернусь, я наверно придумаю что-нибудь хорошее.", "lg2": "И она шлёпнулась с сучка, на который было снова влезла, в воду, нырнула в тину и совершенно зарылась в ней, чтобы посторонние предметы не мешали ей размышлять. Пять минут прошло, утки совсем было собрались лететь, как вдруг из воды, около сучка, на котором она сидела, показалась её морда, и выражение этой морды было самое сияющее, на какое только способна лягушка.\n— Я придумала! Я нашла! — сказала она. — Пусть две из вас возьмут в свои клювы прутик, а я прицеплюсь за него посередине. Вы будете лететь, а я ехать. Нужно только, чтобы вы не крякали, а я не квакала, и всё будет превосходно.\nХотя молчать и тащить хоть бы и лёгкую лягушку три тысячи вёрст не бог знает какое удовольствие, но её ум привёл уток в такой восторг, что они единодушно согласились нести её. Решили переменяться каждые два часа, и так как уток было, как говорится в загадке, столько, да ещё столько, да полстолько, да четверть столька, а лягушка была одна, то нести её приходилось не особенно часто. Нашли хороший, прочный прутик, две утки взяли его в клювы, лягушка прицепилась ртом за середину, и всё стадо поднялось на воздух. У лягушки захватило дух от страшной высоты, на которую её подняли; кроме того, утки летели неровно и дёргали прутик; бедная квакушка болталась в воздухе, как бумажный паяц, и изо всей мочи стискивала свои челюсти, чтобы не оторваться и не шлёпнуться на землю. Однако она скоро привыкла к своему положению и даже начала осматриваться. Под нею быстро проносились поля, луга, реки и горы, которые ей, впрочем, было очень трудно рассматривать, потому что, вися на прутике, она смотрела назад и немного вверх, но кое-что всё-таки видела и радовалась и гордилась.\n«Вот как я превосходно придумала», — думала она про себя.\nА утки летели вслед за нёсшей её передней парой, кричали и хвалили её.\n— Удивительно умная голова наша лягушка, — говорили они, — даже между утками мало таких найдётся.\nОна едва удержалась, чтобы не поблагодарить их, но вспомнив, что, открыв рот, она свалится со страшной высоты, ещё крепче стиснула челюсти и решилась терпеть. Она болталась таким образом целый день: нёсшие её утки переменялись на лету, ловко подхватывая прутик; это было очень страшно: не раз лягушка чуть было не квакала от страха, но нужно было иметь присутствие духа, и она его имела. Вечером вся компания остановилась в каком-то болоте; с зарёю утки с лягушкой снова пустились в путь, но на этот раз путешественница, чтобы лучше видеть, что делается на пути, прицепилась спинкой и головой вперёд, а брюшком назад. Утки летели над сжатыми полями, над пожелтевшими лесами и над деревнями, полными хлеба в скирдах; оттуда доносился людской говор и стук цепов, которыми молотили рожь. Люди смотрели на стаю уток и, замечая в ней что-то странное, показывали на неё руками. И лягушке ужасно захотелось лететь поближе к земле, показать себя и послушать, что об ней говорят. На следующем отдыхе она сказала:\n— Нельзя ли нам лететь не так высоко? У меня от высоты кружится голова, и я боюсь свалиться, если мне вдруг сделается дурно.\nИ добрые утки обещали ей лететь пониже. На следующий день они летели так низко, что слышали голоса:\n— Смотрите, смотрите! — кричали дети в одной деревне, — утки лягушку несут!\nЛягушка услышала это, и у неё прыгало сердце.\n— Смотрите, смотрите! — кричали в другой деревне взрослые, — вот чудо-то!\n«Знают ли они, что это придумала я, а не утки?» — подумала квакушка.\n— Смотрите, смотрите! — кричали в третьей деревне. — Экое чудо! И кто это придумал такую хитрую штуку?\nТут лягушка уж не выдержала и, забыв всякую осторожность, закричала изо всей мочи:\n— Это я! Я!\nИ с этим криком она полетела вверх тормашками на землю. Утки громко закричали; одна из них хотела подхватить бедную спутницу на лету, но промахнулась. Лягушка, дрыгая всеми четырьмя лапками, быстро падала на землю; но так как утки летели очень быстро, то и она упала не прямо на то место, над которым закричала и где была твёрдая дорога, а гораздо дальше, что было для неё большим счастьем, потому что она бултыхнулась в грязный пруд на краю деревни.\nОна скоро вынырнула из воды и тотчас же опять сгоряча закричала во всё горло:\n— Это я! Это я придумала!\nНо вокруг неё никого не было. Испуганные неожиданным плеском, местные лягушки все попрятались в воду. Когда они начали показываться из неё, то с удивлением смотрели на новую.\nИ она рассказала им чудную историю о том, как она думала всю жизнь и наконец изобрела новый, необыкновенный способ путешествия на утках; как у неё были свои собственные утки, которые носили её, куда ей было угодно; как она побывала на прекрасном юге, где так хорошо, где такие прекрасные тёплые болота и так много мошек и всяких других съедобных насекомых.\n— Я заехала к вам посмотреть, как вы живёте, — сказала она. — Я пробуду у вас до весны, пока не вернутся мои утки, которых я отпустила.\nНо утки уж никогда не вернулись. Они думали, что квакушка разбилась о землю, и очень жалели её.", "ka1": "Глава первая. Дурное поведение\nМолодая рыжая собака — помесь такса с дворняжкой — очень похожая мордой на лисицу, бегала взад и вперёд по тротуару и беспокойно оглядывалась по сторонам. Изредка она останавливалась и, плача, приподнимая то одну озябшую лапу, то другую, старалась дать себе отчёт: как это могло случиться, что она заблудилась?\nОна отлично помнила, как она провела день и как в конце концов попала на этот незнакомый тротуар.\nДень начался с того, что её хозяин, столяр Лука Александрыч, надел шапку, взял под мышку какую-то деревянную штуку, завёрнутую в красный платок, и крикнул:\n— Каштанка, пойдём!\nУслыхав своё имя, помесь таксы с дворняжкой вышла из-под верстака, где она спала на стружках, сладко потянулась и побежала за хозяином. Заказчики Луки Александрыча жили ужасно далеко, так что, прежде чем дойти до каждого из них, столяр должен был по нескольку раз заходить в трактир и подкрепляться. Каштанка помнила, что по дороге она вела себя крайне неприлично. От радости, что её взяли гулять, она прыгала, бросалась с лаем на вагоны конно-железки, забегала во дворы и гонялась за собаками. Столяр то и дело терял её из виду, останавливался и сердито кричал на неё. Раз даже он с выражением алчности на лице забрал в кулак её лисье ухо, потрепал и проговорил с расстановкой:\n— Чтоб… ты… из… дох…ла, холера!\nПобывав у заказчиков, Лука Александрыч зашёл на минутку к сестре, у которой пил и закусывал; от сестры пошёл он к знакомому переплётчику, от переплётчика в трактир, из трактира к куму и т. д. Одним словом, когда Каштанка попала на незнакомый тротуар, то уже вечерело и столяр был пьян, как сапожник. Он размахивал руками и, глубоко вздыхая, бормотал:\n— Во гресех роди мя мати во утробе моей! Ох, грехи, грехи! Теперь вот мы по улице идём и на фонарики глядим, а как помрём — в гиене огненной гореть будем…\nИли же он впадал в добродушный тон, подзывал к себе Каштанку и говорил ей:\n— Ты, Каштанка, насекомое существо и больше ничего. Супротив человека ты всё равно, что плотник супротив столяра…\nКогда он разговаривал с ней таким образом, вдруг загремела музыка. Каштанка оглянулась и увидела, что по улице прямо на неё шёл полк солдат. Не вынося музыки, которая расстраивала ей нервы, она заметалась и завыла. К великому её удивлению, столяр, вместо того, чтобы испугаться, завизжать и залаять, широко улыбнулся, вытянулся во фрунт и всей пятернёй сделал под козырёк. Видя, что хозяин не протестует, Каштанка ещё громче завыла и, не помня себя, бросилась через дорогу на другой тротуар.\nКогда она опомнилась, музыка уже не играла и полка не было. Она перебежала дорогу к тому месту, где оставила хозяина, но, увы! столяра уже там не было. Она бросилась вперёд, потом назад, ещё раз перебежала дорогу, но столяр точно сквозь землю провалился… Каштанка стала обнюхивать тротуар, надеясь найти хозяина по запаху его следов, но раньше какой-то негодяй прошёл в новых резиновых калошах, и теперь все тонкие запахи мешались с острою каучуковою вонью, так что ничего нельзя было разобрать.\nКаштанка бегала взад и вперёд и не находила хозяина, а между тем становилось темно. По обе стороны улицы зажглись фонари и в окнах домов показались огни. Шёл крупный, пушистый снег и красил в белое мостовую, лошадиные спины, шапки извозчиков, и чем больше темнел воздух, тем белее становились предметы. Мимо Каштанки, заслоняя ей поле зрения и толкая её ногами, безостановочно взад и вперёд проходили незнакомые заказчики. (Всё человечество Каштанка делила на две очень неравные части: на хозяев и на заказчиков; между теми и другими была существенная разница: первые имели право бить её, а вторых она сама имела право хватать за икры.) Заказчики куда-то спешили и не обращали на неё никакого внимания.\nКогда стало совсем темно, Каштанкою овладели отчаяние и ужас. Она прижалась к какому-то подъезду и стала горько плакать. Целодневное путешествие с Лукой Александрычем утомило её, уши и лапы её озябли, и к тому же ещё она была ужасно голодна. За весь день ей приходилось жевать только два раза: покушала у переплётчика немножко клейстеру да в одном из трактиров около прилавка нашла колбасную кожицу — вот и всё. Если бы она была человеком, то наверное подумала бы:\n«Нет, так жить невозможно! Нужно застрелиться!»\nГлава вторая.Таинственный незнакомец\nНо она ни о чём не думала и только плакала. Когда мягкий, пушистый снег совсем облепил её спину и голову и она от изнеможения погрузилась в тяжёлую дремоту, вдруг подъездная дверь щёлкнула, запищала и ударила её по боку. Она вскочила. Из отворённой двери вышел какой-то человек, принадлежащий к разряду заказчиков. Так как Каштанка взвизгнула и попала ему под ноги, то он не мог не обратить на неё внимания. Он нагнулся к ней и спросил:\n— Псина, ты откуда? Я тебя ушиб? О, бедная, бедная… Ну, не сердись, не сердись… Виноват.\nКаштанка поглядела на незнакомца сквозь снежинки, нависшие на ресницы, и увидела перед собой коротенького и толстенького человечка с бритым пухлым лицом, в цилиндре и в шубе нараспашку.\n— Что же ты скулишь? — продолжал он, сбивая пальцем с её спины снег. — Где твой хозяин? Должно быть, ты потерялась? Ах, бедный пёсик! Что же мы теперь будем делать?\nУловив в голосе незнакомца тёплую, душевную нотку, Каштанка лизнула ему руку и заскулила ещё жалостнее.\n— А ты хорошая, смешная! — сказал незнакомец. — Совсем лисица! Ну, что ж, делать нечего, пойдём со мной! Может быть, ты и сгодишься на что-нибудь… Ну, фюйть!\nОн чмокнул губами и сделал Каштанке знак рукой, который мог означать только одно: «Пойдём!» Каштанка пошла.\nНе больше как через полчаса она уже сидела на полу в большой, светлой комнате и, склонив голову набок, с умилением и с любопытством глядела на незнакомца, который сидел за столом и обедал. Он ел и бросал ей кусочки… Сначала он дал ей хлеба и зелёную корочку сыра, потом кусочек мяса, полпирожка, куриных костей, а она с голодухи всё это съела так быстро, что не успела разобрать вкуса. И чем больше она ела, тем сильнее чувствовался голод.\n— Однако, плохо же кормят тебя твои хозяева! — говорил незнакомец, глядя, с какою свирепою жадностью она глотала неразжеванные куски. — И какая ты тощая! Кожа да кости…\nКаштанка съела много, но не наелась, а только опьянела от еды. После обеда она разлеглась среди комнаты, протянула ноги и, чувствуя во всём теле приятную истому, завиляла хвостом. Пока её новый хозяин, развалившись в кресле, курил сигару, она виляла хвостом и решала вопрос: где лучше — у незнакомца или у столяра? У незнакомца обстановка бедная и некрасивая; кроме кресел, дивана, лампы и ковров, у него нет ничего, и комната кажется пустою; у столяра же вся квартира битком набита вещами; у него есть стол, верстак, куча стружек, рубанки, стамески, пилы, клетка с чижиком, лохань… У незнакомца не пахнет ничем, у столяра же в квартире всегда стоит туман и великолепно пахнет клеем, лаком и стружками. Зато у незнакомца есть одно очень важное преимущество — он даёт много есть и, надо отдать ему полную справедливость, когда Каштанка сидела перед столом и умильно глядела на него, он ни разу не ударил её, не затопал ногами и ни разу не крикнул: «По-ошла вон, треклятая!»\nВыкурив сигару, новый хозяин вышел и через минуту вернулся, держа в руках маленький матрасик.\n— Эй ты, пёс, поди сюда! — сказал он, кладя матрасик в углу около дивана. — Ложись здесь. Спи!\nЗатем он потушил лампу и вышел. Каштанка разлеглась на матрасике и закрыла глаза; с улицы послышался лай, и она хотела ответить на него, но вдруг неожиданно ею овладела грусть. Она вспомнила Луку Александрыча, его сына Федюшку, уютное местечко под верстаком… Вспомнила она, что в длинные зимние вечера, когда столяр строгал или читал вслух газету, Федюшка обыкновенно играл с нею… Он вытаскивал её за задние лапы из-под верстака и выделывал с нею такие фокусы, что у неё зеленело в глазах и болело во всех суставах. Он заставлял её ходить на задних лапах, изображал из неё колокол, то есть сильно дёргал её за хвост, отчего она визжала и лаяла, давал ей нюхать табаку… Особенно мучителен был следующий фокус: Федюшка привязывал на ниточку кусочек мяса и давал его Каштанке, потом же, когда она проглатывала, он с громким
